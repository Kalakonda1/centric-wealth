<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="referrer" content="no-referrer" />
  <title>Ledgerly — Private Finance</title>
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Pinned CDN versions (React 18 is the last line with UMD builds). sw.js caches these for offline use. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <style>
    html, body { background:#0f172a; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    input, select, textarea { font-size:16px; } /* prevents iOS zoom on focus */
  </style>
</head>
<body class="h-full text-slate-100 antialiased">
<div id="root" class="h-full"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* =========================================================================
   1. IndexedDB wrapper (native API, promise-based)
   Stores: income, expenses, debts, bills (autoIncrement id) + meta (key/value)
   Money is stored as integer cents to avoid floating-point drift.
   ========================================================================= */
const DB_NAME = 'ledgerly';
const DB_VERSION = 1;
const STORES = ['income', 'expenses', 'debts', 'bills'];

const db = (() => {
  let conn = null;

  function open() {
    if (conn) return Promise.resolve(conn);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const d = req.result;
        for (const name of STORES) {
          if (!d.objectStoreNames.contains(name)) {
            const s = d.createObjectStore(name, { keyPath: 'id', autoIncrement: true });
            if (name === 'income' || name === 'expenses') s.createIndex('date', 'date');
          }
        }
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = () => {
        conn = req.result;
        conn.onversionchange = () => { conn.close(); conn = null; };
        resolve(conn);
      };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('Database blocked by another open tab.'));
    });
  }

  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((resolve, reject) => {
      const t = d.transaction(store, mode);
      const s = t.objectStore(store);
      let result;
      const r = fn(s);
      if (r) r.onsuccess = () => { result = r.result; };
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }

  return {
    getAll: (store) => tx(store, 'readonly', (s) => s.getAll()),
    get: (store, id) => tx(store, 'readonly', (s) => s.get(id)),
    add: (store, item) => tx(store, 'readwrite', (s) => s.add({ ...item, createdAt: Date.now() })),
    put: (store, item) => tx(store, 'readwrite', (s) => s.put({ ...item, updatedAt: Date.now() })),
    remove: (store, id) => tx(store, 'readwrite', (s) => s.delete(id)),
    clear: (store) => tx(store, 'readwrite', (s) => s.clear()),
    async bulkAdd(store, items) {
      const d = await open();
      return new Promise((resolve, reject) => {
        const t = d.transaction(store, 'readwrite');
        const s = t.objectStore(store);
        items.forEach((i) => { const { id, ...rest } = i; s.add({ ...rest, createdAt: Date.now() }); });
        t.oncomplete = () => resolve(items.length);
        t.onerror = () => reject(t.error);
      });
    },
    async getMeta(key, fallback = null) {
      const row = await tx('meta', 'readonly', (s) => s.get(key));
      return row ? row.value : fallback;
    },
    setMeta: (key, value) => tx('meta', 'readwrite', (s) => s.put({ key, value })),
    async exportAll() {
      const out = { app: DB_NAME, version: DB_VERSION, exportedAt: new Date().toISOString() };
      for (const s of [...STORES, 'meta']) out[s] = await db.getAll(s);
      return out;
    },
    async importAll(data) {
      for (const s of [...STORES, 'meta']) {
        if (!Array.isArray(data[s])) continue;
        await db.clear(s);
        const d = await open();
        await new Promise((resolve, reject) => {
          const t = d.transaction(s, 'readwrite');
          data[s].forEach((row) => t.objectStore(s).put(row));
          t.oncomplete = resolve; t.onerror = () => reject(t.error);
        });
      }
    },
    async wipe() { for (const s of [...STORES, 'meta']) await db.clear(s); },
  };
})();

/* =========================================================================
   2. API key storage (localStorage)
   ========================================================================= */
const KEY_STORAGE = 'ledgerly.anthropicKey';
const MODEL_STORAGE = 'ledgerly.model';
const keyStore = {
  get: () => { try { return localStorage.getItem(KEY_STORAGE) || ''; } catch { return ''; } },
  set: (v) => { try { localStorage.setItem(KEY_STORAGE, v.trim()); } catch {} },
  clear: () => { try { localStorage.removeItem(KEY_STORAGE); } catch {} },
  mask: (v) => (v ? `${v.slice(0, 10)}••••••••${v.slice(-4)}` : ''),
};
const getModel = () => { try { return localStorage.getItem(MODEL_STORAGE) || 'claude-sonnet-5-5'; } catch { return 'claude-sonnet-5-5'; } };

/* =========================================================================
   Helpers
   ========================================================================= */
const toCents = (v) => Math.round(parseFloat(String(v).replace(/[^0-9.\-]/g, '')) * 100) || 0;
const fmt = (cents, opts = {}) =>
  new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', ...opts }).format((cents || 0) / 100);
const todayISO = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD in local time
const monthKey = (d = new Date()) => d.toLocaleDateString('en-CA').slice(0, 7);
const sum = (arr, f = (x) => x.amount) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const CATEGORIES = ['Housing', 'Groceries', 'Dining', 'Transport', 'Utilities', 'Health', 'Shopping', 'Entertainment', 'Subscriptions', 'Debt Payment', 'Other'];
const INCOME_CATS = ['Salary', 'Freelance', 'Interest', 'Refund', 'Other'];

function nextDueDate(dueDay) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const clamp = (y, m) => Math.min(dueDay, new Date(y, m + 1, 0).getDate());
  let d = new Date(now.getFullYear(), now.getMonth(), clamp(now.getFullYear(), now.getMonth()));
  if (d < now) {
    const y = now.getMonth() === 11 ? now.getFullYear() + 1 : now.getFullYear();
    const m = (now.getMonth() + 1) % 12;
    d = new Date(y, m, clamp(y, m));
  }
  return d;
}
const daysUntil = (d) => Math.round((d - new Date(new Date().setHours(0, 0, 0, 0))) / 86400000);

/* =========================================================================
   UI primitives
   ========================================================================= */
function Icon({ name, size = 20, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el || !window.lucide) return;
    el.innerHTML = '';
    const node = window.lucide.icons?.[name];
    if (!node) return;
    const svg = window.lucide.createElement(node);
    svg.setAttribute('width', size); svg.setAttribute('height', size);
    el.appendChild(svg);
  }, [name, size]);
  return <span ref={ref} aria-hidden="true" className={`inline-flex shrink-0 ${className}`} />;
}

const Card = ({ children, className = '' }) => (
  <div className={`rounded-2xl bg-slate-800/70 ring-1 ring-white/5 p-4 ${className}`}>{children}</div>
);

function StatCard({ label, value, icon, tone = 'slate', sub }) {
  const tones = {
    emerald: 'text-emerald-400 bg-emerald-400/10', rose: 'text-rose-400 bg-rose-400/10',
    sky: 'text-sky-400 bg-sky-400/10', violet: 'text-violet-400 bg-violet-400/10', slate: 'text-slate-300 bg-white/5',
  };
  return (
    <Card className="flex flex-col gap-3 min-w-0">
      <div className="flex items-center justify-between">
        <span className="text-xs font-medium uppercase tracking-wide text-slate-400">{label}</span>
        <span className={`rounded-lg p-1.5 ${tones[tone]}`}><Icon name={icon} size={16} /></span>
      </div>
      <div className="text-xl font-semibold tabular-nums truncate">{value}</div>
      {sub && <div className="text-xs text-slate-400 -mt-2 truncate">{sub}</div>}
    </Card>
  );
}

function Sheet({ open, title, onClose, children }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true">
      <div className="absolute inset-0 bg-black/60" onClick={onClose} />
      <div className="relative w-full max-w-md rounded-t-3xl bg-slate-900 ring-1 ring-white/10 p-5 pb-safe max-h-[90vh] overflow-y-auto">
        <div className="mx-auto mb-4 h-1 w-10 rounded-full bg-white/20" />
        <div className="mb-4 flex items-center justify-between">
          <h2 className="text-lg font-semibold">{title}</h2>
          <button onClick={onClose} className="p-2 -mr-2 text-slate-400" aria-label="Close"><Icon name="X" /></button>
        </div>
        {children}
        <div className="h-4" />
      </div>
    </div>
  );
}

const Field = ({ label, children }) => (
  <label className="block mb-3">
    <span className="mb-1 block text-xs font-medium text-slate-400">{label}</span>
    {children}
  </label>
);
const inputCls = 'w-full rounded-xl bg-slate-800 px-3 py-2.5 ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-emerald-500';
const btnPrimary = 'w-full rounded-xl bg-emerald-500 py-3 font-semibold text-slate-950 active:scale-[.98] transition disabled:opacity-40';
const btnGhost = 'rounded-xl bg-white/5 px-3 py-2 text-sm ring-1 ring-white/10 active:bg-white/10';

function Empty({ icon, text }) {
  return (
    <div className="flex flex-col items-center gap-2 py-8 text-slate-500">
      <Icon name={icon} size={28} /><p className="text-sm">{text}</p>
    </div>
  );
}

/* =========================================================================
   Data hook
   ========================================================================= */
function useFinanceData() {
  const [data, setData] = useState({ income: [], expenses: [], debts: [], bills: [], assets: 0, loaded: false });
  const reload = useCallback(async () => {
    const [income, expenses, debts, bills, assets] = await Promise.all([
      db.getAll('income'), db.getAll('expenses'), db.getAll('debts'), db.getAll('bills'), db.getMeta('assets', 0),
    ]);
    setData({ income, expenses, debts, bills, assets, loaded: true });
  }, []);
  useEffect(() => { reload().catch(console.error); }, [reload]);
  return [data, reload];
}

function useSummary(data) {
  return useMemo(() => {
    const mk = monthKey();
    const mIncome = sum(data.income.filter((t) => t.date?.startsWith(mk)));
    const mExpense = sum(data.expenses.filter((t) => t.date?.startsWith(mk)));
    const debtTotal = sum(data.debts, (d) => d.balance);
    const cashFlow = sum(data.income) - sum(data.expenses);
    const subs = data.bills.filter((b) => b.isSubscription && b.active !== false);
    return {
      netWorth: (data.assets || 0) + cashFlow - debtTotal,
      mIncome, mExpense, debtTotal, subs, subsTotal: sum(subs),
    };
  }, [data]);
}

/* =========================================================================
   Views
   ========================================================================= */
function Dashboard({ data, summary, go }) {
  const upcoming = data.bills
    .filter((b) => b.active !== false)
    .map((b) => ({ ...b, due: nextDueDate(b.dueDay) }))
    .sort((a, b) => a.due - b.due)
    .slice(0, 4);
  const recent = [
    ...data.income.map((t) => ({ ...t, kind: 'income' })),
    ...data.expenses.map((t) => ({ ...t, kind: 'expense' })),
  ].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id - a.id).slice(0, 5);
  const savingsRate = summary.mIncome ? Math.round(((summary.mIncome - summary.mExpense) / summary.mIncome) * 100) : null;

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 gap-3">
        <StatCard label="Net Worth" icon="Landmark" tone="sky" value={fmt(summary.netWorth, { maximumFractionDigits: 0 })}
          sub={`Debt ${fmt(summary.debtTotal, { maximumFractionDigits: 0 })}`} />
        <StatCard label="Income" icon="TrendingUp" tone="emerald" value={fmt(summary.mIncome, { maximumFractionDigits: 0 })} sub="This month" />
        <StatCard label="Expenses" icon="TrendingDown" tone="rose" value={fmt(summary.mExpense, { maximumFractionDigits: 0 })}
          sub={savingsRate !== null ? `Savings rate ${savingsRate}%` : 'This month'} />
        <StatCard label="Subscriptions" icon="Repeat" tone="violet" value={summary.subs.length} sub={`${fmt(summary.subsTotal)}/mo`} />
      </div>

      <Card>
        <div className="mb-3 flex items-center justify-between">
          <h3 className="font-semibold">Upcoming bills</h3>
          <button className="text-xs text-emerald-400" onClick={() => go('transactions', 'bills')}>Manage</button>
        </div>
        {upcoming.length === 0 ? <Empty icon="CalendarCheck" text="No bill reminders yet" /> : (
          <ul className="divide-y divide-white/5">
            {upcoming.map((b) => {
              const d = daysUntil(b.due);
              return (
                <li key={b.id} className="flex items-center justify-between py-2.5">
                  <div className="min-w-0">
                    <p className="truncate text-sm font-medium">{b.name}</p>
                    <p className={`text-xs ${d <= 3 ? 'text-amber-400' : 'text-slate-400'}`}>
                      {d === 0 ? 'Due today' : d === 1 ? 'Due tomorrow' : `Due in ${d} days`} · {b.due.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
                    </p>
                  </div>
                  <span className="text-sm tabular-nums">{fmt(b.amount)}</span>
                </li>
              );
            })}
          </ul>
        )}
      </Card>

      <Card>
        <div className="mb-3 flex items-center justify-between">
          <h3 className="font-semibold">Recent activity</h3>
          <button className="text-xs text-emerald-400" onClick={() => go('transactions', 'tx')}>See all</button>
        </div>
        {recent.length === 0 ? <Empty icon="Receipt" text="Add a transaction or import a CSV" /> : (
          <ul className="divide-y divide-white/5">
            {recent.map((t) => <TxRow key={t.kind + t.id} t={t} />)}
          </ul>
        )}
      </Card>
    </div>
  );
}

function TxRow({ t, onDelete }) {
  const inc = t.kind === 'income';
  return (
    <li className="flex items-center gap-3 py-2.5">
      <span className={`rounded-xl p-2 ${inc ? 'bg-emerald-400/10 text-emerald-400' : 'bg-rose-400/10 text-rose-400'}`}>
        <Icon name={inc ? 'ArrowDownLeft' : 'ArrowUpRight'} size={16} />
      </span>
      <div className="min-w-0 flex-1">
        <p className="truncate text-sm font-medium">{t.description || t.category}</p>
        <p className="text-xs text-slate-400">{t.category} · {t.date}</p>
      </div>
      <span className={`text-sm tabular-nums ${inc ? 'text-emerald-400' : ''}`}>{inc ? '+' : '−'}{fmt(t.amount)}</span>
      {onDelete && (
        <button onClick={onDelete} className="p-1.5 text-slate-500 active:text-rose-400" aria-label="Delete">
          <Icon name="Trash2" size={16} />
        </button>
      )}
    </li>
  );
}

function Transactions({ data, reload, initialSeg }) {
  const [seg, setSeg] = useState(initialSeg || 'tx');
  const [month, setMonth] = useState(monthKey());
  const [sheet, setSheet] = useState(null);
  useEffect(() => { if (initialSeg) setSeg(initialSeg); }, [initialSeg]);

  const txs = useMemo(() => [
    ...data.income.map((t) => ({ ...t, kind: 'income' })),
    ...data.expenses.map((t) => ({ ...t, kind: 'expense' })),
  ].filter((t) => t.date?.startsWith(month))
    .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id), [data, month]);

  const del = async (store, id) => { if (confirm('Delete this item?')) { await db.remove(store, id); reload(); } };

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-3 gap-1 rounded-xl bg-slate-800 p-1">
        {[['tx', 'Transactions'], ['debts', 'Debts'], ['bills', 'Bills']].map(([k, l]) => (
          <button key={k} onClick={() => setSeg(k)}
            className={`rounded-lg py-2 text-sm font-medium ${seg === k ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>{l}</button>
        ))}
      </div>

      {seg === 'tx' && (
        <Card>
          <div className="mb-2 flex items-center justify-between gap-2">
            <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} className={`${inputCls} !w-auto !py-1.5`} />
            <button className={btnGhost} onClick={() => setSheet('tx')}><span className="flex items-center gap-1"><Icon name="Plus" size={16} />Add</span></button>
          </div>
          {txs.length === 0 ? <Empty icon="Receipt" text="Nothing recorded this month" /> : (
            <ul className="divide-y divide-white/5">
              {txs.map((t) => <TxRow key={t.kind + t.id} t={t} onDelete={() => del(t.kind === 'income' ? 'income' : 'expenses', t.id)} />)}
            </ul>
          )}
        </Card>
      )}

      {seg === 'debts' && (
        <Card>
          <div className="mb-2 flex items-center justify-between">
            <h3 className="font-semibold">Debt accounts</h3>
            <button className={btnGhost} onClick={() => setSheet('debt')}><span className="flex items-center gap-1"><Icon name="Plus" size={16} />Add</span></button>
          </div>
          {data.debts.length === 0 ? <Empty icon="CreditCard" text="No debt accounts tracked" /> : (
            <ul className="divide-y divide-white/5">
              {[...data.debts].sort((a, b) => (b.apr || 0) - (a.apr || 0)).map((d) => (
                <li key={d.id} className="flex items-center gap-3 py-2.5">
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-sm font-medium">{d.name}</p>
                    <p className="text-xs text-slate-400">{d.apr || 0}% APR · min {fmt(d.minPayment)}</p>
                  </div>
                  <span className="text-sm tabular-nums text-rose-300">{fmt(d.balance)}</span>
                  <button onClick={() => setSheet({ edit: 'debt', item: d })} className="p-1.5 text-slate-500" aria-label="Edit"><Icon name="Pencil" size={16} /></button>
                  <button onClick={() => del('debts', d.id)} className="p-1.5 text-slate-500" aria-label="Delete"><Icon name="Trash2" size={16} /></button>
                </li>
              ))}
            </ul>
          )}
        </Card>
      )}

      {seg === 'bills' && (
        <Card>
          <div className="mb-2 flex items-center justify-between">
            <h3 className="font-semibold">Bill reminders</h3>
            <button className={btnGhost} onClick={() => setSheet('bill')}><span className="flex items-center gap-1"><Icon name="Plus" size={16} />Add</span></button>
          </div>
          {data.bills.length === 0 ? <Empty icon="BellRing" text="No bills or subscriptions yet" /> : (
            <ul className="divide-y divide-white/5">
              {[...data.bills].sort((a, b) => a.dueDay - b.dueDay).map((b) => (
                <li key={b.id} className="flex items-center gap-3 py-2.5">
                  <div className="min-w-0 flex-1">
                    <p className="flex items-center gap-1.5 truncate text-sm font-medium">
                      {b.name}{b.isSubscription && <span className="rounded bg-violet-400/15 px-1.5 text-[10px] text-violet-300">SUB</span>}
                    </p>
                    <p className="text-xs text-slate-400">Monthly on day {b.dueDay}</p>
                  </div>
                  <span className="text-sm tabular-nums">{fmt(b.amount)}</span>
                  <button onClick={() => del('bills', b.id)} className="p-1.5 text-slate-500" aria-label="Delete"><Icon name="Trash2" size={16} /></button>
                </li>
              ))}
            </ul>
          )}
        </Card>
      )}

      <Sheet open={sheet === 'tx'} title="New transaction" onClose={() => setSheet(null)}>
        <TxForm onDone={() => { setSheet(null); reload(); }} />
      </Sheet>
      <Sheet open={sheet === 'debt' || sheet?.edit === 'debt'} title={sheet?.item ? 'Edit debt' : 'New debt account'} onClose={() => setSheet(null)}>
        <DebtForm item={sheet?.item} onDone={() => { setSheet(null); reload(); }} />
      </Sheet>
      <Sheet open={sheet === 'bill'} title="New bill reminder" onClose={() => setSheet(null)}>
        <BillForm onDone={() => { setSheet(null); reload(); }} />
      </Sheet>
    </div>
  );
}

function TxForm({ onDone }) {
  const [f, setF] = useState({ kind: 'expense', amount: '', description: '', category: 'Groceries', date: todayISO() });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const cats = f.kind === 'income' ? INCOME_CATS : CATEGORIES;
  const save = async (e) => {
    e.preventDefault();
    const amount = Math.abs(toCents(f.amount));
    if (!amount) return;
    await db.add(f.kind === 'income' ? 'income' : 'expenses', { amount, description: f.description.trim(), category: f.category, date: f.date });
    onDone();
  };
  return (
    <form onSubmit={save}>
      <div className="mb-3 grid grid-cols-2 gap-1 rounded-xl bg-slate-800 p-1">
        {['expense', 'income'].map((k) => (
          <button type="button" key={k} onClick={() => setF({ ...f, kind: k, category: k === 'income' ? 'Salary' : 'Groceries' })}
            className={`rounded-lg py-2 text-sm capitalize ${f.kind === k ? (k === 'income' ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white') : 'text-slate-400'}`}>{k}</button>
        ))}
      </div>
      <Field label="Amount"><input className={inputCls} inputMode="decimal" placeholder="0.00" value={f.amount} onChange={set('amount')} autoFocus required /></Field>
      <Field label="Description"><input className={inputCls} value={f.description} onChange={set('description')} placeholder="e.g. Publix" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Category"><select className={inputCls} value={f.category} onChange={set('category')}>{cats.map((c) => <option key={c}>{c}</option>)}</select></Field>
        <Field label="Date"><input type="date" className={inputCls} value={f.date} onChange={set('date')} required /></Field>
      </div>
      <button className={btnPrimary}>Save</button>
    </form>
  );
}

function DebtForm({ item, onDone }) {
  const [f, setF] = useState(item
    ? { name: item.name, balance: (item.balance / 100).toFixed(2), apr: item.apr ?? '', minPayment: ((item.minPayment || 0) / 100).toFixed(2) }
    : { name: '', balance: '', apr: '', minPayment: '' });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const save = async (e) => {
    e.preventDefault();
    const row = { name: f.name.trim(), balance: Math.abs(toCents(f.balance)), apr: parseFloat(f.apr) || 0, minPayment: Math.abs(toCents(f.minPayment)) };
    item ? await db.put('debts', { ...item, ...row }) : await db.add('debts', row);
    onDone();
  };
  return (
    <form onSubmit={save}>
      <Field label="Account name"><input className={inputCls} value={f.name} onChange={set('name')} placeholder="e.g. Visa, Car loan" required /></Field>
      <Field label="Current balance"><input className={inputCls} inputMode="decimal" value={f.balance} onChange={set('balance')} required /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="APR %"><input className={inputCls} inputMode="decimal" value={f.apr} onChange={set('apr')} /></Field>
        <Field label="Min. payment"><input className={inputCls} inputMode="decimal" value={f.minPayment} onChange={set('minPayment')} /></Field>
      </div>
      <button className={btnPrimary}>Save</button>
    </form>
  );
}

function BillForm({ onDone }) {

    await db.add('bills', { name: f.name.trim(), amount: Math.abs(toCents(f.amount)), dueDay: Math.min(31, Math.max(1, parseInt(f.dueDay) || 1)), isSubscription: f.isSubscription, active: true });

/* ---------- Upload: CSV import (parsed locally, never leaves the device) ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (q) { if (c === '"' && n === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && n === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}

function normalizeDate(s) {
  s = (s || '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); // MM/DD/YYYY (US bank exports)
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; }
  const d = new Date(s); return isNaN(d) ? null : d.toLocaleDateString('en-CA');
}

function Upload({ reload }) {
  const [preview, setPreview] = useState(null);
  const [msg, setMsg] = useState('');
  const fileRef = useRef(null);

  const onFile = async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    setMsg('');
    const rows = parseCSV(await file.text());
    if (rows.length < 2) return setMsg('That file has no data rows.');
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const idx = (...names) => head.findIndex((h) => names.some((n) => h.includes(n)));
    const iDate = idx('date'), iDesc = idx('description', 'memo', 'payee', 'name'), iAmt = idx('amount'), iCat = idx('category');
    const iDebit = idx('debit', 'withdrawal'), iCredit = idx('credit', 'deposit');
    if (iDate < 0 || (iAmt < 0 && iDebit < 0 && iCredit < 0)) return setMsg('Need at least a Date column and an Amount (or Debit/Credit) column.');
    const parsed = rows.slice(1).map((r) => {
      let cents = iAmt >= 0 ? toCents(r[iAmt]) : toCents(r[iCredit] || 0) - Math.abs(toCents(r[iDebit] || 0));
      return { date: normalizeDate(r[iDate]), description: (r[iDesc] || '').trim(), category: (r[iCat] || '').trim() || (cents >= 0 ? 'Other' : 'Other'), cents };
    }).filter((t) => t.date && t.cents);
    setPreview(parsed);
    e.target.value = '';
  };

  const commit = async () => {
    const inc = preview.filter((t) => t.cents > 0).map((t) => ({ date: t.date, description: t.description, category: t.category, amount: t.cents }));
    const exp = preview.filter((t) => t.cents < 0).map((t) => ({ date: t.date, description: t.description, category: t.category, amount: -t.cents }));
    await db.bulkAdd('income', inc); await db.bulkAdd('expenses', exp);
    setMsg(`Imported ${inc.length} income and ${exp.length} expense rows.`);
    setPreview(null); reload();
  };

  return (
    <div className="space-y-4">
      <Card>
        <h3 className="mb-1 font-semibold">Import bank CSV</h3>
        <p className="mb-4 text-sm text-slate-400">Parsed entirely on this device. Columns: <code className="text-slate-300">date, description, amount, category</code> — negative amounts are expenses. Debit/Credit column pairs also work.</p>
        <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={onFile} className="hidden" />
        <button onClick={() => fileRef.current.click()}
          className="flex w-full flex-col items-center gap-2 rounded-2xl border-2 border-dashed border-white/15 py-8 text-slate-400 active:bg-white/5">
          <Icon name="FileUp" size={28} /><span className="text-sm">Choose a CSV file</span>
        </button>
        {msg && <p className="mt-3 text-sm text-emerald-400">{msg}</p>}
      </Card>

      {preview && (
        <Card>
          <div className="mb-2 flex items-center justify-between">
            <h3 className="font-semibold">Preview · {preview.length} rows</h3>
            <button className="text-xs text-slate-400" onClick={() => setPreview(null)}>Cancel</button>
          </div>
          <ul className="mb-4 max-h-64 divide-y divide-white/5 overflow-y-auto">
            {preview.slice(0, 50).map((t, i) => (
              <li key={i} className="flex justify-between gap-2 py-2 text-sm">
                <span className="truncate">{t.date} · {t.description || '—'}</span>
                <span className={`tabular-nums ${t.cents > 0 ? 'text-emerald-400' : ''}`}>{fmt(t.cents)}</span>
              </li>
            ))}
          </ul>
          <button className={btnPrimary} onClick={commit}>Import {preview.length} rows</button>
        </Card>
      )}
    </div>
  );
}

/* ---------- AI Insights: sends an aggregated summary (no raw transactions) ---------- */
function buildSnapshot(data, summary) {
  const months = [...Array(3)].map((_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); return monthKey(d); });
  const byMonth = months.map((m) => {
    const exp = data.expenses.filter((t) => t.date?.startsWith(m));
    const cats = {};
    exp.forEach((t) => { cats[t.category] = (cats[t.category] || 0) + t.amount; });
    return {
      month: m,
      income: fmt(sum(data.income.filter((t) => t.date?.startsWith(m)))),
      expenses: fmt(sum(exp)),
      byCategory: Object.fromEntries(Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, fmt(v)])),
    };
  });
  return {
    netWorth: fmt(summary.netWorth),
    debts: data.debts.map((d) => ({ label: d.name, balance: fmt(d.balance), apr: d.apr, minPayment: fmt(d.minPayment) })),
    subscriptions: summary.subs.map((s) => ({ label: s.name, monthly: fmt(s.amount) })),
    last3Months: byMonth,
  };
}

function Insights({ data, summary, go }) {
  const [out, setOut] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [showPayload, setShowPayload] = useState(false);
  const key = keyStore.get();
  const snapshot = useMemo(() => buildSnapshot(data, summary), [data, summary]);

  const run = async () => {
    setBusy(true); setErr(''); setOut('');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: getModel(),
          max_tokens: 1200,
          system: 'You are a careful personal-finance coach. Give concise, practical observations in plain text with short sections: Spending patterns, Debt strategy, Subscriptions, Three next steps. You are not a licensed financial advisor; say so briefly at the end.',
          messages: [{ role: 'user', content: `Here is my aggregated financial snapshot:\n${JSON.stringify(snapshot, null, 2)}` }],
        }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json?.error?.message || `HTTP ${res.status}`);
      setOut(json.content?.filter((b) => b.type === 'text').map((b) => b.text).join('\n') || '(empty response)');
    } catch (e) {
      setErr(navigator.onLine ? e.message : 'You are offline. AI Insights needs a connection; everything else works offline.');
    } finally { setBusy(false); }
  };

  if (!key) return (
    <Card className="text-center">
      <div className="py-6">
        <Icon name="KeyRound" size={32} className="mb-3 text-slate-500" />
        <p className="mb-4 text-sm text-slate-400">Add your Anthropic API key in Settings to enable AI Insights.</p>
        <button className={btnGhost} onClick={() => go('settings')}>Open Settings</button>
      </div>
    </Card>
  );

  return (
    <div className="space-y-4">
      <Card>
        <div className="mb-2 flex items-center gap-2">
          <Icon name="ShieldCheck" size={18} className="text-emerald-400" />
          <h3 className="font-semibold">What gets sent</h3>
        </div>
        <p className="mb-3 text-sm text-slate-400">Only monthly totals, category sums, debt balances and subscription amounts — no individual transactions or descriptions.</p>
        <button className="text-xs text-emerald-400" onClick={() => setShowPayload(!showPayload)}>{showPayload ? 'Hide' : 'Show'} exact payload</button>
        {showPayload && <pre className="mt-2 max-h-56 overflow-auto rounded-xl bg-slate-950 p-3 text-[11px] text-slate-300">{JSON.stringify(snapshot, null, 2)}</pre>}
      </Card>
      <button className={btnPrimary} onClick={run} disabled={busy}>
        <span className="flex items-center justify-center gap-2">
          <Icon name={busy ? 'Loader' : 'Sparkles'} size={18} className={busy ? 'animate-spin' : ''} />
          {busy ? 'Analyzing…' : 'Generate insights'}
        </span>
      </button>
      {err && <Card className="!bg-rose-500/10 text-sm text-rose-300">{err}</Card>}
      {out && <Card><div className="whitespace-pre-wrap text-sm leading-relaxed">{out}</div></Card>}
    </div>
  );
}

/* ---------- Settings ---------- */
function Settings({ data, reload }) {
  const [key, setKey] = useState('');
  const [saved, setSaved] = useState(keyStore.get());
  const [reveal, setReveal] = useState(false);
  const [model, setModel] = useState(getModel());
  const [assets, setAssets] = useState(((data.assets || 0) / 100).toFixed(2));
  const [note, setNote] = useState('');
  const restoreRef = useRef(null);
  const flash = (m) => { setNote(m); setTimeout(() => setNote(''), 2500); };

  const saveKey = () => {
    if (!/^sk-ant-/.test(key.trim())) return flash('That doesn’t look like an Anthropic key (sk-ant-…).');
    keyStore.set(key); setSaved(keyStore.get()); setKey(''); flash('API key saved on this device.');
  };
  const exportData = async () => {
    const blob = new Blob([JSON.stringify(await db.exportAll(), null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `ledgerly-backup-${todayISO()}.json` });
    a.click(); URL.revokeObjectURL(a.href);
  };
  const restore = async (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    try {
      const json = JSON.parse(await f.text());
      if (json.app !== DB_NAME) throw new Error('Not a Ledgerly backup');
      if (!confirm('Replace all current data with this backup?')) return;
      await db.importAll(json); reload(); flash('Backup restored.');
    } catch (err) { flash(err.message); } finally { e.target.value = ''; }
  };

  return (
    <div className="space-y-4">
      <Card>
        <h3 className="mb-1 flex items-center gap-2 font-semibold"><Icon name="KeyRound" size={18} />Anthropic API key</h3>
        <p className="mb-3 text-xs text-slate-400">Stored only in this browser’s localStorage and sent only to api.anthropic.com. Use a key with a low spend limit.</p>
        {saved ? (
          <div className="mb-3 flex items-center gap-2 rounded-xl bg-slate-900 px-3 py-2.5 ring-1 ring-white/10">
            <code className="flex-1 truncate text-sm">{reveal ? saved : keyStore.mask(saved)}</code>
            <button onClick={() => setReveal(!reveal)} className="p-1 text-slate-400" aria-label="Toggle visibility"><Icon name={reveal ? 'EyeOff' : 'Eye'} size={16} /></button>
            <button onClick={() => { keyStore.clear(); setSaved(''); }} className="p-1 text-rose-400" aria-label="Remove key"><Icon name="Trash2" size={16} /></button>
          </div>
        ) : null}
        <div className="flex gap-2">
          <input type="password" autoComplete="off" spellCheck="false" className={inputCls} placeholder={saved ? 'Replace key…' : 'sk-ant-…'} value={key} onChange={(e) => setKey(e.target.value)} />
          <button className={btnGhost} onClick={saveKey} disabled={!key}>Save</button>
        </div>
        <Field label="Model"><input className={`${inputCls} mt-3`} value={model} onChange={(e) => { setModel(e.target.value); try { localStorage.setItem(MODEL_STORAGE, e.target.value); } catch {} }} /></Field>
      </Card>

      <Card>
        <h3 className="mb-1 flex items-center gap-2 font-semibold"><Icon name="Wallet" size={18} />Starting assets</h3>
        <p className="mb-3 text-xs text-slate-400">Cash, savings and investments as of when you started tracking. Net worth = this + income − expenses − debts.</p>
        <div className="flex gap-2">
          <input className={inputCls} inputMode="decimal" value={assets} onChange={(e) => setAssets(e.target.value)} />
          <button className={btnGhost} onClick={async () => { await db.setMeta('assets', toCents(assets)); reload(); flash('Saved.'); }}>Save</button>
        </div>
      </Card>

      <Card>
        <h3 className="mb-3 flex items-center gap-2 font-semibold"><Icon name="Database" size={18} />Your data</h3>
        <div className="grid grid-cols-2 gap-2">
          <button className={btnGhost} onClick={exportData}><span className="flex items-center justify-center gap-1.5"><Icon name="Download" size={16} />Export JSON</span></button>
          <button className={btnGhost} onClick={() => restoreRef.current.click()}><span className="flex items-center justify-center gap-1.5"><Icon name="Upload" size={16} />Restore</span></button>
        </div>
        <input ref={restoreRef} type="file" accept="application/json,.json" className="hidden" onChange={restore} />
        <button className="mt-3 w-full rounded-xl bg-rose-500/10 py-2.5 text-sm text-rose-300 ring-1 ring-rose-500/20"
          onClick={async () => { if (confirm('Permanently erase all data on this device?')) { await db.wipe(); keyStore.clear(); setSaved(''); reload(); flash('All data erased.'); } }}>
          Erase everything
        </button>
      </Card>

      {note && <div className="fixed inset-x-4 bottom-24 z-40 mx-auto max-w-md rounded-xl bg-slate-700 px-4 py-3 text-center text-sm shadow-lg">{note}</div>}
      <p className="pb-2 text-center text-xs text-slate-500">No accounts. No tracking. Data lives in IndexedDB on this device.</p>
    </div>
  );
}

/* =========================================================================
   App shell + bottom navigation
   ========================================================================= */
const TABS = [
  { id: 'dashboard', label: 'Home', icon: 'LayoutDashboard', title: 'Overview' },
  { id: 'transactions', label: 'Activity', icon: 'ArrowLeftRight', title: 'Transactions' },
  { id: 'upload', label: 'Upload', icon: 'FileUp', title: 'Upload' },
  { id: 'insights', label: 'Insights', icon: 'Sparkles', title: 'AI Insights' },
  { id: 'settings', label: 'Settings', icon: 'Settings', title: 'Settings' },
];

function App() {
  const [tab, setTab] = useState(() => location.hash.slice(1) || 'dashboard');
  const [seg, setSeg] = useState(null);
  const [online, setOnline] = useState(navigator.onLine);
  const [data, reload] = useFinanceData();
  const summary = useSummary(data);
  const mainRef = useRef(null);

  const go = (t, s = null) => { setTab(t); setSeg(s); history.replaceState(null, '', '#' + t); mainRef.current?.scrollTo(0, 0); };
  useEffect(() => {
    const up = () => setOnline(true), down = () => setOnline(false);
    addEventListener('online', up); addEventListener('offline', down);
    navigator.storage?.persist?.(); // ask the browser not to evict IndexedDB under storage pressure
    return () => { removeEventListener('online', up); removeEventListener('offline', down); };
  }, []);

  const current = TABS.find((t) => t.id === tab) || TABS[0];

  return (
    <div className="mx-auto flex h-full max-w-md flex-col">
      <header className="pt-safe sticky top-0 z-30 bg-slate-900/80 backdrop-blur">
        <div className="flex items-center justify-between px-4 py-3">
          <h1 className="text-lg font-semibold">{current.title}</h1>
          <span className={`flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] ${online ? 'bg-emerald-400/10 text-emerald-400' : 'bg-amber-400/10 text-amber-400'}`}>
            <Icon name={online ? 'Wifi' : 'WifiOff'} size={12} />{online ? 'Online' : 'Offline'}
          </span>
        </div>
      </header>

      <main ref={mainRef} className="no-scrollbar flex-1 overflow-y-auto px-4 pb-28 pt-2">
        {!data.loaded ? <Empty icon="Loader" text="Loading…" /> : (
          <>
            {tab === 'dashboard' && <Dashboard data={data} summary={summary} go={go} />}
            {tab === 'transactions' && <Transactions data={data} reload={reload} initialSeg={seg} />}
            {tab === 'upload' && <Upload reload={reload} />}
            {tab === 'insights' && <Insights data={data} summary={summary} go={go} />}
            {tab === 'settings' && <Settings data={data} reload={reload} />}
          </>
        )}
      </main>

      <nav className="pb-safe fixed inset-x-0 bottom-0 z-40 border-t border-white/5 bg-slate-900/95 backdrop-blur">
        <ul className="mx-auto grid max-w-md grid-cols-5">
          {TABS.map((t) => {
            const active = t.id === tab;
            return (
              <li key={t.id}>
                <button onClick={() => go(t.id)} aria-current={active ? 'page' : undefined}
                  className={`flex w-full flex-col items-center gap-1 py-2.5 text-[11px] transition ${active ? 'text-emerald-400' : 'text-slate-400'}`}>
                  <span className={`rounded-full px-4 py-1 transition ${active ? 'bg-emerald-400/15' : ''}`}><Icon name={t.icon} size={20} /></span>
                  {t.label}
                </button>
              </li>
            );
          })}
        </ul>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
