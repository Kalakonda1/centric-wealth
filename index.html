  /* ===================================================== SAVINGS FUNDS */
  const GOAL_ICONS = ['PiggyBank', 'Plane', 'TrendingUp', 'House', 'Car', 'GraduationCap', 'Gift', 'Heart'];
  const FUND_COLORS = ['#10b981', '#2a78d6', '#eb6834', '#6250d6', '#e87ba4', '#eda100'];

  function SavingsSection() {
    const { data, fmt } = useApp();
    const funds = useMemo(() => Analytics.funds(data), [data]);
    const [modal, setModal] = useState(null); // { kind: 'move'|'setup', fund?, mode?, fundType? }
    const total = funds.reduce((s, f) => s + f.balance, 0);
    const ef = funds.find((f) => f.fundType === 'emergency');
    const goals = funds.filter((f) => f !== ef);
    return (
      <>
        <SectionTitle action={funds.length > 0 && <span className="num text-xs font-semibold text-slate-500">Total <AnimatedMoney value={total} className="text-slate-800 dark:text-slate-100" /></span>}>Savings & emergency fund</SectionTitle>
        {ef ? <EmergencyCard fund={ef} onMove={(mode) => setModal({ kind: 'move', fund: ef, mode })} onEdit={() => setModal({ kind: 'setup', fund: ef })} />
          : <Card className="p-4 flex items-center gap-4">
              <LiquidGauge pct={0} size={84} label="start" />
              <div className="flex-1 min-w-0"><p className="font-semibold">Build your emergency fund</p><p className="text-sm text-slate-500 mt-0.5">A cushion of 3-6 months of essential spending{funds.length || data.transactions.length ? ` (about ${fmt(Analytics.monthlyEssentials(data))}/mo for you)` : ''}.</p>
                <Button className="mt-3 !h-10" onClick={() => setModal({ kind: 'setup', fundType: 'emergency' })}><Icon name="ShieldCheck" size={16} />Set up</Button></div>
            </Card>}
        {goals.length > 0 && <div className="mt-3 space-y-3">{goals.map((g) => <GoalCard key={g.id} fund={g} onMove={(mode) => setModal({ kind: 'move', fund: g, mode })} onEdit={() => setModal({ kind: 'setup', fund: g })} />)}</div>}
        <button onClick={() => setModal({ kind: 'setup', fundType: 'goal' })} className="press mt-3 w-full rounded-[20px] border-2 border-dashed border-slate-300 dark:border-slate-700 p-3 text-sm font-semibold text-slate-600 dark:text-slate-300 inline-flex items-center justify-center gap-2 active:bg-brand-500/5"><Icon name="Plus" size={16} />New savings goal</button>
        <Sheet open={!!modal} title={modal?.kind === 'move' ? (modal.mode === 'add' ? `Add funds · ${modal.fund.name}` : `Withdraw funds · ${modal.fund.name}`) : modal?.fund ? `Edit ${modal.fund.name}` : modal?.fundType === 'emergency' ? 'Emergency fund' : 'New savings goal'} onClose={() => setModal(null)}>
          {modal?.kind === 'move' && <FundMoveForm fund={modal.fund} initialMode={modal.mode} onDone={() => setModal(null)} />}
          {modal?.kind === 'setup' && <FundSetupForm fund={modal.fund} fundType={modal.fund ? modal.fund.fundType : modal.fundType} onDone={() => setModal(null)} />}
        </Sheet>
      </>
    );
  }

  // Remembers the last balance so a deposit shows a floating "+$X" and a glow.
  function useMoneyDelta(balance) {
    const prev = useRef(balance); const [delta, setDelta] = useState(null);
    useEffect(() => { const d = balance - prev.current; prev.current = balance; if (Math.abs(d) > 0.004) { setDelta({ d, key: Date.now() }); const t = setTimeout(() => setDelta(null), 2000); return () => clearTimeout(t); } }, [balance]);
    return delta;
  }
  function DeltaChip({ delta }) {
    const { fmt } = useApp();
    if (!delta) return null;
    return <span key={delta.key} className={cls('pop-up absolute -top-1 right-0 text-xs font-bold px-2 py-0.5 rounded-full', delta.d > 0 ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-white')}>{delta.d > 0 ? '+' : '−'}{fmt(Math.abs(delta.d))}</span>;
  }

  function EmergencyCard({ fund: f, onMove, onEdit }) {
    const { fmt } = useApp();
    const delta = useMoneyDelta(f.balance);
    const milestones = [1, 3, 6].filter((m) => m <= Math.max(6, f.targetMonths));
    const maxMonths = Math.max(6, f.targetMonths);
    return (
      <Card className={cls('p-4 relative overflow-hidden bg-gradient-to-br from-emerald-500/[.07] to-transparent', delta && delta.d > 0 && 'glow')}>
        <div className="flex gap-4 items-center">
          <LiquidGauge pct={f.progress} color={f.progress >= 1 ? '#0ca30c' : '#10b981'} />
          <div className="flex-1 min-w-0 relative">
            <DeltaChip delta={delta} />
            <p className="text-xs font-semibold text-emerald-700 dark:text-emerald-400 inline-flex items-center gap-1"><Icon name="ShieldCheck" size={13} />{f.name}</p>
            <p className="text-[26px] leading-8 font-extrabold tracking-tight mt-0.5"><AnimatedMoney value={f.balance} /></p>
            <p className="text-xs text-slate-500">of <span className="num">{fmt(f.target)}</span> target{f.targetMode === 'months' ? ` · ${f.targetMonths} months of essentials` : ''}</p>
            {f.monthsCovered != null && <p className="text-xs mt-1 font-medium">{f.monthsCovered >= f.targetMonths && f.targetMode === 'months' ? '🎉 ' : ''}Covers <span className="num">{f.monthsCovered.toFixed(1)}</span> months of essentials</p>}
          </div>
        </div>
        {f.essentials > 0 && <div className="mt-4">
          <GrowBar liquid value={(f.monthsCovered || 0) / maxMonths} color="linear-gradient(90deg,#6ee7b7,#10b981 45%,#047857)" h="h-2.5">
            {milestones.map((m) => <span key={m} className="absolute top-0 bottom-0 w-0.5 bg-white/80 dark:bg-slate-900/80" style={{ left: `${(m / maxMonths) * 100}%` }} />)}
          </GrowBar>
          <div className="relative h-4 mt-1 text-[10px] text-slate-400">{milestones.map((m) => <span key={m} className={cls('absolute whitespace-nowrap', m === maxMonths ? '-translate-x-full' : '-translate-x-1/2')} style={{ left: `${(m / maxMonths) * 100}%` }}>{m} mo</span>)}</div>
        </div>}
        <div className="flex gap-2 mt-2">
          <Button className="flex-1 !h-10" onClick={() => onMove('add')}><Icon name="Plus" size={16} />Add Funds</Button>
          <Button variant="secondary" className="flex-1 !h-10" disabled={f.balance <= 0} onClick={() => onMove('withdraw')}><Icon name="Minus" size={16} />Withdraw</Button>
          <Button variant="secondary" className="!h-10 !px-3" onClick={onEdit} aria-label={`Edit ${f.name}`}><Icon name="Settings2" size={16} /></Button>
        </div>
      </Card>
    );
  }

  function GoalCard({ fund: g, onMove, onEdit }) {
    const { fmt } = useApp();
    const delta = useMoneyDelta(g.balance);
    const color = FUND_COLORS[g.color % FUND_COLORS.length];
    const done = g.target > 0 && g.balance >= g.target;
    return (
      <Card className={cls('p-4 relative', delta && delta.d > 0 && 'glow')}>
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-[14px] grid place-items-center text-white shrink-0" style={{ background: `linear-gradient(135deg, ${color}cc, ${color})`, boxShadow: `0 8px 16px -8px ${color}` }}><Icon name={g.icon} size={18} /></div>
          <div className="flex-1 min-w-0 relative">
            <DeltaChip delta={delta} />
            <p className="font-semibold truncate">{g.name}</p>
            <p className="text-xs text-slate-500"><AnimatedMoney value={g.balance} className="font-semibold text-slate-800 dark:text-slate-100" /> of <span className="num">{fmt(g.target)}</span>{g.targetDate ? ` · by ${parseISO(g.targetDate).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })}` : ''}</p>
          </div>
          <span className="num text-sm font-bold" style={{ color }}>{Math.round(Math.min(1, g.progress) * 100)}%</span>
        </div>
        <div className="mt-3"><GrowBar liquid h="h-3" value={g.progress} color={`linear-gradient(90deg, ${color}88, ${color})`} /></div>
        <p className="text-xs text-slate-500 mt-2">{done ? '🎉 Goal reached!' : g.perMonthNeeded ? `Save ${fmt(g.perMonthNeeded)}/month to reach it on time.` : `${fmt(Math.max(0, g.target - g.balance))} to go.`}</p>
        <div className="flex gap-2 mt-3">
          <Button variant="secondary" className="flex-1 !h-9 !text-sm" onClick={() => onMove('add')}><Icon name="Plus" size={15} />Add Funds</Button>
          <Button variant="secondary" className="flex-1 !h-9 !text-sm" disabled={g.balance <= 0} onClick={() => onMove('withdraw')}><Icon name="Minus" size={15} />Withdraw</Button>
          <Button variant="ghost" className="!h-9 !px-2" onClick={onEdit} aria-label={`Edit ${g.name}`}><Icon name="Settings2" size={16} /></Button>
        </div>
      </Card>
    );
  }

  // Add / withdraw. Optionally moves the money from/to a bank account or the cash wallet (a transfer on both sides).
  function FundMoveForm({ fund, initialMode, onDone }) {
    const { data, save, toast, fmt } = useApp();
    const [mode, setMode] = useState(initialMode || 'add');
    const [amount, setAmount] = useState('');
    const [date, setDate] = useState(todayISO());
    const [link, setLink] = useState('');
    const [note, setNote] = useState('');
    const sources = data.accounts.filter(isBankAccount);
    const submit = async (e) => {
      e.preventDefault();
      const amt = round2(Math.abs(parseAmount(amount)));
      if (!amt) return toast('Enter an amount', 'error');
      if (mode === 'withdraw' && amt > fund.balance + 0.004) return toast(`Only ${fmt(fund.balance)} is in ${fund.name}`, 'error');
      const into = mode === 'add';
      const other = sources.find((a) => a.id === link);
      const desc = note.trim() || (into ? `Saved to ${fund.name}` : `Withdrawn from ${fund.name}`);
      const leg = { type: 'transfer', amount: amt, date, category: 'Savings Transfer', description: desc, fundId: fund.id, source: 'savings', manual: true };
      const a = { ...leg, direction: into ? 'in' : 'out', accountType: 'fund', accountName: fund.name }; a.hash = hashTx(a);
      await save('transactions', a);
      if (other) { const b = { ...leg, direction: into ? 'out' : 'in', accountType: isCashWallet(other) ? 'cash' : 'bank', accountName: other.name }; b.hash = hashTx(b); await save('transactions', b); }
      toast(into ? `${fmt(amt)} added to ${fund.name}` : `${fmt(amt)} withdrawn from ${fund.name}`);
      onDone();
    };
    return (
      <form onSubmit={submit} className="space-y-4">
        <Segmented value={mode} onChange={setMode} options={[{ value: 'add', label: 'Add Funds' }, { value: 'withdraw', label: 'Withdraw Funds' }]} />
        <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3 text-sm flex justify-between"><span className="text-slate-500">Current balance</span><span className="num font-semibold">{fmt(fund.balance)}</span></div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Amount"><Input inputMode="decimal" placeholder="0.00" value={amount} onChange={(e) => setAmount(e.target.value)} autoFocus /></Field>
          <Field label="Date"><Input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        </div>
        {mode === 'add' && fund.target > fund.balance && <div className="flex gap-2 flex-wrap">{[50, 100, 250, Math.ceil(fund.target - fund.balance)].filter((v, i, a) => v > 0 && a.indexOf(v) === i).map((v) => <button type="button" key={v} onClick={() => setAmount(String(v))} className="press text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-900/[.05] dark:bg-white/[.07]">{v === Math.ceil(fund.target - fund.balance) ? `Fill to target (${fmt(v, true)})` : fmt(v, true)}</button>)}</div>}
        <Field label={mode === 'add' ? 'Money comes from' : 'Money goes to'} hint={link ? 'Recorded as a transfer on both sides: your total net worth stays the same.' : 'Use this when the fund is a separate account, e.g. a high-yield savings account.'}>
          <Select options={[{ value: '', label: 'Not tracked here (separate account)' }, ...sources.map((a) => ({ value: a.id, label: `${a.name} · ${fmt(a.balance)}` }))]} value={link} onChange={(e) => setLink(e.target.value)} />
        </Field>
        <Field label="Note (optional)"><Input value={note} onChange={(e) => setNote(e.target.value)} placeholder={mode === 'add' ? 'e.g. Bonus' : 'e.g. Car repair'} /></Field>
        <Button type="submit" className="w-full">{mode === 'add' ? 'Add to fund' : 'Withdraw from fund'}</Button>
      </form>
    );
  }

  function FundSetupForm({ fund, fundType, onDone }) {
    const { data, save, remove, toast, fmt, reload } = useApp();
    const emergency = fundType === 'emergency';
    const essentials = useMemo(() => Analytics.monthlyEssentials(data), [data]);
    const raw = fund ? data.accounts.find((a) => a.id === fund.id) : null;
    const [name, setName] = useState(raw ? raw.name : emergency ? 'Emergency Fund' : '');
    const [mode, setMode] = useState(raw ? raw.targetMode || 'amount' : emergency && essentials > 0 ? 'months' : 'amount');
    const [months, setMonths] = useState(String(raw ? raw.targetMonths || 3 : 3));
    const [target, setTarget] = useState(raw && raw.target ? String(raw.target) : '');
    const [date, setDate] = useState(raw ? raw.targetDate || '' : '');
    const [start, setStart] = useState('');
    const [color, setColor] = useState(raw ? raw.color || 0 : data.accounts.filter(isFundAccount).length % FUND_COLORS.length);
    const [icon, setIcon] = useState(raw ? raw.icon || 'PiggyBank' : 'PiggyBank');
    const computed = mode === 'months' ? (Number(months) || 0) * essentials : parseAmount(target) || 0;
    const submit = async (e) => {
      e.preventDefault();
      const nm = name.trim();
      if (!nm) return toast('Give it a name', 'error');
      if (data.accounts.some((a) => a.id !== (raw && raw.id) && sameName(a.name, nm))) return toast('You already have an account with that name', 'error');
      if (mode === 'amount' && !(computed > 0)) return toast('Set a target amount', 'error');
      const rec = { ...(raw || { balance: 0, ledger: true, anchorDate: null, anchorBalance: round2(parseAmount(start) || 0), balanceSource: 'manual' }),
        name: nm, kind: 'fund', type: 'Savings', fundType: emergency ? 'emergency' : 'goal', targetMode: mode, targetMonths: Number(months) || 3, target: mode === 'amount' ? round2(computed) : null,
        targetDate: date || null, color, icon: emergency ? 'ShieldCheck' : icon };
      if (raw && !sameName(raw.name, nm)) {
        // Fund entries are linked by name: rename them too.
        const moved = data.transactions.filter((t) => t.accountType === 'fund' && sameName(t.accountName, raw.name)).map((t) => ({ ...t, accountName: nm }));
        if (moved.length) await DB.bulkPut('transactions', moved);
      }
      await save('accounts', rec);
      if (raw) await reload('transactions');
      toast(raw ? 'Saved' : `${nm} created`);
      onDone();
    };
    const del = async () => {
      if (!confirm(`Delete ${raw.name}? Its deposit/withdrawal entries are removed too. Transfers recorded on your bank or cash accounts stay.`)) return;
      const own = data.transactions.filter((t) => t.accountType === 'fund' && sameName(t.accountName, raw.name));
      for (const t of own) await DB.delete('transactions', t.id);
      await remove('accounts', raw.id); await reload('transactions'); toast('Deleted'); onDone();
    };
    return (
      <form onSubmit={submit} className="space-y-4">
        <Field label="Name"><Input value={name} onChange={(e) => setName(e.target.value)} placeholder={emergency ? 'Emergency Fund' : 'e.g. Vacation Fund'} /></Field>
        <div>
          <p className="text-[13px] font-medium text-slate-600 dark:text-slate-300 mb-1.5">Target</p>
          <Segmented value={mode} onChange={setMode} options={[{ value: 'months', label: 'Months of expenses' }, { value: 'amount', label: 'Fixed amount' }]} />
        </div>
        {mode === 'months' ? (
          <Field label="How many months?" hint={essentials > 0 ? `Your essential spending is about ${fmt(essentials)}/month. The target updates as that changes.` : 'Import a few months of statements so the app can measure your essential spending.'}>
            <Select options={['1', '2', '3', '4', '6', '9', '12'].map((v) => ({ value: v, label: `${v} month${v === '1' ? '' : 's'}${v === '3' || v === '6' ? ' (recommended range)' : ''}` }))} value={months} onChange={(e) => setMonths(e.target.value)} />
          </Field>
        ) : (
          <Field label="Target amount"><Input inputMode="decimal" placeholder="e.g. 2,000" value={target} onChange={(e) => setTarget(e.target.value)} /></Field>
        )}
        <div className="rounded-xl bg-emerald-50 dark:bg-emerald-500/10 p-3 text-sm flex justify-between"><span>Target</span><span className="num font-bold">{fmt(computed)}</span></div>
        {!emergency && <>
          <Field label="Target date (optional)"><Input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <div><p className="text-[13px] font-medium text-slate-600 dark:text-slate-300 mb-1.5">Look</p>
            <div className="flex gap-2 flex-wrap">{FUND_COLORS.map((c, i) => <button type="button" key={c} onClick={() => setColor(i)} aria-label={`Color ${i + 1}`} className={cls('press w-8 h-8 rounded-full ring-offset-2 dark:ring-offset-slate-900', color === i && 'ring-2 ring-slate-900 dark:ring-white')} style={{ background: c }} />)}</div>
            <div className="flex gap-2 flex-wrap mt-2">{GOAL_ICONS.map((ic) => <button type="button" key={ic} onClick={() => setIcon(ic)} aria-label={ic} className={cls('press w-10 h-10 rounded-xl grid place-items-center border-2', icon === ic ? 'border-slate-900 dark:border-white' : 'border-slate-200 dark:border-slate-700')}><Icon name={ic} size={18} /></button>)}</div>
          </div>
        </>}
        {!raw && <Field label="Already saved (optional)" hint="Money already in this fund today."><Input inputMode="decimal" placeholder="0.00" value={start} onChange={(e) => setStart(e.target.value)} /></Field>}
        <Button type="submit" className="w-full">{raw ? 'Save changes' : emergency ? 'Create emergency fund' : 'Create goal'}</Button>
        {raw && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={del}><Icon name="Trash2" size={16} />Delete {raw.name}</Button>}
      </form>
    );
  }

  /* ============================================== QUICK LOG (cash & transfers) */
  const QL_KINDS = [
    { value: 'cash-expense', label: 'Cash Expense', icon: 'Banknote', tone: 'amber' },
    { value: 'cash-income', label: 'Cash Income', icon: 'HandCoins', tone: 'emerald' },
    { value: 'sent', label: 'Money Sent (Transfer)', icon: 'Send', tone: 'rose' },
    { value: 'received', label: 'Money Received', icon: 'ArrowDownToLine', tone: 'sky' },
  ];
  const QL_SOURCES = [{ value: 'cash', label: 'Cash Wallet', icon: 'Wallet' }, { value: 'bank', label: 'Bank Account', icon: 'Landmark' }, { value: 'credit', label: 'Credit Card', icon: 'CreditCard' }];
  // What a transfer was for decides whether it counts as income/spending or only moves balances.
  const QL_PURPOSES = {
    sent: [
      { value: 'payment', label: 'Paid someone (bill split, rent share…)', type: 'expense', category: 'Personal Payments' },
      { value: 'gift', label: 'Gift', type: 'expense', category: 'Gifts' },
      { value: 'lent', label: 'Lent money (they owe me)', type: 'transfer', category: 'Money Lent', person: true },
      { value: 'repay', label: 'Repaid money I borrowed', type: 'transfer', category: 'Loan Repayment', person: true },
      { value: 'own', label: 'Moved to my own account', type: 'transfer', category: 'Transfer' },
    ],
    received: [

  /* ====================================================== MONTHLY REPORT */
  // Small Markdown renderer for the report preview: headings, tables, **bold**, _italic_.
  function inlineMd(s) { return s.split(/(\*\*[^*]+\*\*|_[^_]+_)/g).map((p, i) => p.startsWith('**') ? <b key={i}>{p.slice(2, -2)}</b> : /^_[^_]+_$/.test(p) ? <i key={i}>{p.slice(1, -1)}</i> : p); }
  function MarkdownView({ text }) {
    const lines = String(text).split('\n'); const out = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^\|/.test(l)) {
        const block = []; while (i < lines.length && /^\|/.test(lines[i])) block.push(lines[i++]); i--;
        const cells = (r) => r.replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));
        const [head, sep, ...body] = block; const right = cells(sep || '').map((c) => /:$/.test(c));
        out.push(<div key={i} className="overflow-x-auto my-3"><table className="w-full text-sm"><thead><tr>{cells(head).map((c, j) => <th key={j} className={cls('py-1.5 px-2 border-b border-slate-200 dark:border-slate-700 font-semibold', right[j] ? 'text-right' : 'text-left')}>{inlineMd(c)}</th>)}</tr></thead>
          <tbody>{body.map((r, k) => <tr key={k} className="border-b border-slate-100 dark:border-slate-800">{cells(r).map((c, j) => <td key={j} className={cls('py-1.5 px-2 num', right[j] ? 'text-right' : 'text-left')}>{inlineMd(c)}</td>)}</tr>)}</tbody></table></div>);
      } else if (/^# /.test(l)) out.push(<h2 key={i} className="text-xl font-bold mt-1">{inlineMd(l.slice(2))}</h2>);
      else if (/^## /.test(l)) out.push(<h3 key={i} className="text-base font-bold mt-5">{inlineMd(l.slice(3))}</h3>);
      else if (l.trim()) out.push(<p key={i} className="text-sm text-slate-600 dark:text-slate-300 mt-2">{inlineMd(l)}</p>);
    }
    return <div>{out}</div>;
  }

          <Row icon="Coins" label="Currency">
            <select className={smallSelect} value={st.currency || 'USD'} onChange={(e) => setSetting('currency', e.target.value)}>
              {['USD', 'EUR', 'GBP', 'CAD', 'AUD', 'INR', 'JPY', 'CHF', 'MXN', 'BRL', 'ZAR', 'SGD'].map((c) => <option key={c}>{c}</option>)}
            </select>
          </Row>
          <Row icon="SunMoon" label="Appearance">
            <select className={smallSelect} value={st.theme || 'system'} onChange={(e) => setSetting('theme', e.target.value)}>
              <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
            </select>
          </Row>
          <Row icon="Bell" label="Bill & subscription reminders" sub={notifyStatus ? notifyStatus.note : 'Checking…'}>
            <button onClick={toggleNotify} role="switch" aria-checked={!!st.notify} className={cls('press w-12 h-7 rounded-full p-0.5 transition-colors duration-300', st.notify ? 'bg-brand-500' : 'bg-slate-300 dark:bg-slate-700')}>
              <span className={cls('block w-6 h-6 rounded-full bg-white shadow transition-transform', st.notify && 'translate-x-5')} />
            </button>
          </Row>
          {st.notify && <Row icon="BellRing" label="Send a test reminder" onClick={async () => { const ok = await RecurringScanner.notifications.test(); toast(ok ? 'Test sent' : 'Could not show a notification', ok ? 'ok' : 'error'); }}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>}
          <Row icon="CreditCard" label="Manage credit cards" sub="Names, last 4 digits, limits and payment due dates" onClick={() => openCards({})}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>
          <Row icon="Tags" label="Category rules" sub={(st.categoryRules || []).length ? `${st.categoryRules.length} saved merchant mapping${st.categoryRules.length === 1 ? '' : 's'} used on every import` : 'Created when you recategorize an imported transaction'} onClick={() => setRulesOpen(true)}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>
          <Row icon="CalendarClock" label="Remind me">
            <select className={smallSelect} value={st.reminderDays ?? 3} onChange={(e) => setSetting('reminderDays', Number(e.target.value))}>
              {[1, 2, 3, 5, 7].map((d) => <option key={d} value={d}>{d} day{d > 1 ? 's' : ''} before</option>)}
            </select>
          </Row>
        </Card>

        <SectionTitle>Your data</SectionTitle>
        <Card className="divide-y divide-slate-900/[.05] dark:divide-white/[.06]">
          <Row icon="Download" label="Back up (JSON)" sub={st.lastBackup ? `Last backup ${prettyDate(st.lastBackup)}` : 'Never backed up'} onClick={exportJSON}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>
          <Row icon="FileSpreadsheet" label="Export transactions (CSV)" onClick={exportCSV}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>
          <Row icon="HardDrive" label="Persistent storage" sub={storage ? `${(storage.used / 1024).toFixed(0)} KB used · ${storage.persisted ? 'protected' : 'may be cleared by browser'}` : 'Checking…'} onClick={storage && !storage.persisted ? persist : undefined}>
            {storage && !storage.persisted && <span className="text-xs font-semibold text-brand-700 dark:text-brand-400">Protect</span>}
          </Row>
          {installPrompt && <Row icon="Smartphone" label="Install app" sub="Add to home screen for offline use" onClick={install}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>}
          <Row icon="Sparkles" label="Load sample data" sub="Adds demo records (merge)" onClick={loadSample}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>
          <Row icon="Trash2" label="Erase all data" danger onClick={wipe} />
        </Card>
        <p className="text-center text-xs text-slate-400 mt-6">Centric Wealth · offline-first · v1.0.0</p>
        <Sheet open={rulesOpen} title="Category rules" onClose={() => setRulesOpen(false)}><CategoryRules /></Sheet>
      </div>
    );
  }

  /* ========================================================== sample data */
  function buildSample() {
    const now = new Date(); const mk = (offset, day) => toISO(new Date(now.getFullYear(), now.getMonth() - offset, Math.min(day, now.getDate() + (offset ? 31 : 0))));
    const tx = [];
    for (let m = 2; m >= 0; m--) {
      tx.push({ type: 'income', amount: 3200, category: 'Salary', date: mk(m, 1), description: 'Payroll deposit' });
      tx.push({ type: 'income', amount: 3200, category: 'Salary', date: mk(m, 15), description: 'Payroll deposit' });
      tx.push({ type: 'expense', amount: 1650, category: 'Housing', date: mk(m, 1), description: 'Rent' });
      tx.push({ type: 'expense', amount: 128.4 + m * 7, category: 'Utilities', date: mk(m, 6), description: 'Electric company' });
      [3, 9, 14, 20].forEach((d, i) => tx.push({ type: 'expense', amount: 62 + i * 18 + m * 4, category: 'Groceries', date: mk(m, d), description: 'Neighborhood market' }));
      [5, 12, 18].forEach((d, i) => tx.push({ type: 'expense', amount: 24 + i * 11, category: 'Dining', date: mk(m, d), description: 'Corner cafe' }));
      tx.push({ type: 'expense', amount: 48.2, category: 'Transport', date: mk(m, 8), description: 'Fuel station' });
      tx.push({ type: 'expense', amount: 15.99, category: 'Subscriptions', date: mk(m, 11), description: 'Streaming service' });
      tx.push({ type: 'expense', amount: m === 0 ? 12.99 : 9.99, category: 'Subscriptions', date: mk(m, 4), description: 'Fitness app membership' });
      tx.push({ type: 'expense', amount: 6.99, category: 'Subscriptions', date: mk(m, 9), description: 'Cloud photo storage' });
    }
    // Spending on the card, income and bills through checking, one card payment a month (a transfer on both sides).
    const ON_CARD = new Set(['Groceries', 'Dining', 'Transport', 'Subscriptions']);
    tx.forEach((t) => Object.assign(t, ON_CARD.has(t.category) ? { accountType: 'credit', accountName: 'Visa Card' } : { accountType: 'bank', accountName: 'Checking' }, { direction: t.type === 'income' ? 'in' : 'out' }));
    for (let m = 2; m >= 1; m--) {
      tx.push({ type: 'transfer', direction: 'out', amount: 640, category: 'Card Payment', date: mk(m, 25), description: 'Payment to Visa Card', accountType: 'bank', accountName: 'Checking' });
      tx.push({ type: 'transfer', direction: 'in', amount: 640, category: 'Card Payment', date: mk(m, 25), description: 'Payment - thank you', accountType: 'credit', accountName: 'Visa Card' });
    }
    tx.forEach((t) => (t.hash = hashTx(t), t.source = 'sample', t.createdAt = '2000-01-01T00:00:00.000Z'));
    const today = toISO(now);
    return {
      transactions: tx,
      accounts: [
        { name: 'Checking', type: 'Checking', kind: 'bank', balance: 4210.55, ledger: true, anchorBalance: 4210.55, anchorDate: today, anchorSetAt: '2000-01-02T00:00:00.000Z', balanceSource: 'manual' },
        { name: 'High-yield savings', type: 'Savings', kind: 'bank', balance: 12500 },
        { name: 'Retirement', type: 'Retirement', balance: 28400 },
      ],
      debts: [
        { name: 'Visa Card', type: 'Credit Card', kind: 'credit', last4: '4821', creditLimit: 8000, dueDay: 28, dueSince: '2000-01-01', reminders: true, color: 1, balance: 3840, apr: 24.99, minPayment: 95, ledger: true, anchorBalance: 3840, anchorDate: today, anchorSetAt: '2000-01-02T00:00:00.000Z', balanceSource: 'manual' },
        { name: 'Auto loan', type: 'Auto Loan', balance: 11200, apr: 6.4, minPayment: 310 },
        { name: 'Student loan', type: 'Student Loan', balance: 18750, apr: 4.99, minPayment: 210 },
      ],
      bills: [
        { name: 'Rent', amount: 1650, dueDay: 1, frequency: 'monthly', category: 'Housing', isSubscription: false, active: true },
        { name: 'Electric', amount: 135, dueDay: 6, frequency: 'monthly', category: 'Utilities', isSubscription: false, active: true },
        { name: 'Streaming service', amount: 15.99, dueDay: 11, frequency: 'monthly', category: 'Subscriptions', isSubscription: true, active: true },
        { name: 'Music streaming', amount: 10.99, dueDay: now.getDate() + 2 > 28 ? 2 : now.getDate() + 2, frequency: 'monthly', category: 'Subscriptions', isSubscription: true, active: true },
        { name: 'Cloud storage', amount: 29.99, dueDay: 14, dueMonth: 3, frequency: 'yearly', category: 'Subscriptions', isSubscription: true, active: true },
      ],
      budgets: [{ category: 'Groceries', limit: 450 }, { category: 'Dining', limit: 150 }, { category: 'Transport', limit: 120 }, { category: 'Utilities', limit: 160 }, { category: 'Shopping', limit: 200 }],
    };
  }

  /* ================================================================= APP */
  const TABS = [
    { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
    { id: 'transactions', label: 'Activity', aria: 'Transactions', icon: 'ArrowLeftRight' },
    { id: 'upload', label: 'Upload', icon: 'Upload' },
    { id: 'budget', label: 'Budget', aria: 'Budget & Debt', icon: 'PiggyBank' },
    { id: 'advisor', label: 'Advisor', aria: 'Budget & Health Advisor', icon: 'HeartPulse' },
    { id: 'settings', label: 'Settings', icon: 'Settings' },
  ];

  function App() {
    const store = useFinanceData();
    const { data, ready, error } = store;
    const [tab, setTab] = useState(() => (location.hash.slice(1).split('/')[0]) || 'dashboard');
    const [sub, setSub] = useState(() => location.hash.split('/')[1] || 'budget');
    const [toastState, setToastState] = useState(null);
    const [installPrompt, setInstallPrompt] = useState(null);
    const [online, setOnline] = useState(navigator.onLine);
    const [cardsUI, setCardsUI] = useState(null); // Manage credit cards sheet
    const toastTimer = useRef();

    const toast = useCallback((msg, kind = 'ok') => { setToastState({ msg, kind }); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastState(null), 2400); }, []);
    const go = useCallback((t, s) => { setTab(t); if (s) setSub(s); window.scrollTo(0, 0); }, []);

    useEffect(() => { history.replaceState(null, '', `#${tab}${tab === 'budget' ? '/' + sub : ''}`); }, [tab, sub]);
    useEffect(() => { const h = () => { const [t, s] = location.hash.slice(1).split('/'); if (t) setTab(t); if (s) setSub(s); }; addEventListener('hashchange', h); return () => removeEventListener('hashchange', h); }, []);
    useEffect(() => {
      const bip = (e) => { e.preventDefault(); setInstallPrompt(e); };
      const on = () => setOnline(true), off = () => setOnline(false);
      addEventListener('beforeinstallprompt', bip); addEventListener('online', on); addEventListener('offline', off);
      return () => { removeEventListener('beforeinstallprompt', bip); removeEventListener('online', on); removeEventListener('offline', off); };
    }, []);

    // Theme
    useEffect(() => {
      const mq = matchMedia('(prefers-color-scheme: dark)');
      const apply = () => { const t = data.settings.theme || 'system'; document.documentElement.classList.toggle('dark', t === 'dark' || (t === 'system' && mq.matches)); };
      apply(); mq.addEventListener('change', apply); return () => mq.removeEventListener('change', apply);
    }, [data.settings.theme]);

    // Imported ("ledger") accounts: balance = anchor + newer tagged transactions. Recalculated when data changes.
    useEffect(() => {
      if (!ready) return;
      (async () => {
        let changed = false;
        for (const [storeName, list, kind] of [['accounts', data.accounts, 'bank'], ['debts', data.debts, 'credit']]) {
          for (const a of list) {
            if (!a.ledger) continue;
            const b = ledgerBalance(a, isCashWallet(a) ? 'cash' : isFundAccount(a) ? 'fund' : kind, data.transactions);
            if (Math.abs(b - (Number(a.balance) || 0)) > 0.004) { await DB.put(storeName, { ...a, balance: b }); changed = true; }
          }
        }
        if (changed) store.reload(['accounts', 'debts']);
      })().catch((e) => console.warn('Balance update failed', e));
    }, [ready, data.transactions, data.accounts, data.debts]);

    // Recurring subscriptions & bills: detected locally from saved transactions (recurring-scanner.js)
    const decisionsJSON = JSON.stringify(data.settings.recurringDecisions || {});
    const recurring = useMemo(() => (window.RecurringScanner
      ? RecurringScanner.analyze(data.transactions, { bills: data.bills, decisions: JSON.parse(decisionsJSON) })
      : null), [data.transactions, data.bills, decisionsJSON]);

    // Imported charges mark linked bills as paid (and follow subscription price changes).
    useEffect(() => {
      if (!ready || !recurring) return;
      RecurringScanner.reconcile(recurring.items, data.bills).then((n) => n && store.reload('bills')).catch(() => {});
    }, [ready, recurring]);

    // Reminders: rebuild the schedule, show anything due, arm timers; again whenever the app returns to the foreground.
    useEffect(() => {
      if (!ready || !recurring) return;
      const cards = data.debts.filter(isCardDebt).map((c) => ({ ...c, lastPaid: cardLastPaid(c, data.transactions) }));
      const run = () => RecurringScanner.notifications.sync({ items: recurring.items, bills: data.bills, cards, leadDays: data.settings.reminderDays ?? 3, enabled: !!data.settings.notify }).catch((e) => console.warn('Reminder sync failed', e));
      run();
      const vis = () => document.visibilityState === 'visible' && run();
      document.addEventListener('visibilitychange', vis); return () => document.removeEventListener('visibilitychange', vis);
    }, [ready, recurring, data.debts, data.transactions, data.settings.notify, data.settings.reminderDays]);

    const currency = data.settings.currency || 'USD';
    const fmt = useMemo(() => {
      const full = new Intl.NumberFormat(undefined, { style: 'currency', currency });
      const compact = new Intl.NumberFormat(undefined, { style: 'currency', currency, notation: 'compact', maximumFractionDigits: 1 });
      return (n, short) => (short && Math.abs(n) >= 10000 ? compact : full).format(Number(n) || 0);
    }, [currency]);

    const loadSample = useCallback(async () => {
      const s = buildSample();
      for (const [name, rows] of Object.entries(s)) await DB.bulkPut(name, rows);
      await store.reload(); toast('Sample data loaded');
    }, [store, toast]);
    const install = async () => { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice; setInstallPrompt(null); };

    const recurringAction = useCallback(async (action, item) => {
      try {
        await RecurringScanner[action](item);
        await store.reload(['bills', 'settings']);
        toast(action === 'keep' ? `Keeping ${item.merchant}` : action === 'cancel' ? `${item.merchant} marked as cancelled` : 'Choice undone');
      } catch (e) { toast(e.message, 'error'); }
    }, [store, toast]);

    const markCardPaid = useCallback(async (c) => {
      const orig = data.debts.find((d) => d.id === c.id); if (!orig) return;
      await store.save('debts', { ...orig, lastPaid: todayISO() });
      toast(`${c.name} marked as paid`);
    }, [data.debts, store, toast]);
    const ctx = { ...store, fmt, toast, go, loadSample, installPrompt, install, recurring, recurringAction, openCards: setCardsUI, markCardPaid };

    if (!ready) return <SkeletonScreen />;
    if (error) return <div className="p-6"><Card className="p-4"><p className="font-semibold text-rose-600">Storage unavailable</p><p className="text-sm text-slate-500 mt-1">{error}. Private-browsing modes in some browsers block IndexedDB.</p></Card></div>;

    return (
      <AppCtx.Provider value={ctx}>
        <div className="min-h-full max-w-lg mx-auto">
          {!online && <div className="pt-safe fade-in"><div className="mx-4 mt-2 rounded-full bg-slate-900/85 dark:bg-white/10 text-white text-xs font-semibold text-center py-1.5 inline-flex w-[calc(100%-2rem)] justify-center gap-1.5 items-center"><Icon name="WifiOff" size={13} />Offline — everything still works</div></div>}
          <main className={cls('px-4 pt-safe', tab === 'dashboard' || tab === 'transactions' ? 'pb-48' : 'pb-28')}>
            <div className="pt-3 stagger" key={tab + (tab === 'budget' ? '/' + sub : '')}>
              {tab === 'dashboard' && <Dashboard go={go} />}
              {tab === 'transactions' && <Transactions />}
              {tab === 'upload' && <UploadView />}
              {tab === 'budget' && <BudgetDebt sub={sub} setSub={setSub} />}
              {tab === 'advisor' && <AdvisorView />}
              {tab === 'settings' && <SettingsView />}
            </div>
          </main>

          <nav className="fixed inset-x-0 bottom-0 z-40 px-3 pointer-events-none" style={{ paddingBottom: 'max(.6rem, env(safe-area-inset-bottom))' }} aria-label="Main">
            <div className="glass pointer-events-auto relative max-w-lg mx-auto grid grid-cols-6 rounded-[26px] p-1.5">
              {(() => { const i = Math.max(0, TABS.findIndex((t) => t.id === tab)); return (
                <span aria-hidden="true" className="absolute top-1.5 bottom-1.5 left-1.5 rounded-[20px] bg-gradient-to-b from-brand-500/15 to-brand-500/[.07] dark:from-brand-400/20 dark:to-brand-400/[.06] ring-1 ring-brand-500/15 transition-transform duration-300 ease-out"
                  style={{ width: 'calc((100% - .75rem) / 6)', transform: `translateX(${i * 100}%)` }} />); })()}
              {TABS.map((t) => {
                const active = tab === t.id;
                return (
                  <button key={t.id} onClick={() => go(t.id)} aria-label={t.aria || t.label} aria-current={active ? 'page' : undefined}
                    className={cls('press relative z-10 flex flex-col items-center justify-center gap-0.5 h-[52px] text-[10px] min-[410px]:text-[11px] tracking-[-0.01em] font-semibold min-w-0 rounded-[20px]', active ? 'text-brand-700 dark:text-brand-400' : 'text-slate-500 dark:text-slate-400')}>
                    <Icon name={t.icon} size={20} strokeWidth={active ? 2.4 : 2} className={cls('transition-transform duration-300 ease-out', active && '-translate-y-px scale-110')} />
                    <span className="max-w-full truncate">{t.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
          {(tab === 'dashboard' || tab === 'transactions') && <QuickLogFab />}
          <ManageCardsSheet state={cardsUI} setState={setCardsUI} />
          <Toast toast={toastState} />
        </div>
      </AppCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  // Service worker for offline support (requires HTTPS or localhost — GitHub Pages is HTTPS).
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed', e)));
  }
  </script>
</body>
</html>
