    /* ---------- design tokens ---------- */
    :root {
      color-scheme: light;
      --canvas: #eef2f6;
      --glow-a: rgba(16, 185, 129, .13);    /* emerald haze */
      --glow-b: rgba(42, 120, 214, .11);    /* blue haze */

      --glass: rgba(255, 255, 255, .70);
      --glass-border: rgba(255, 255, 255, .75);
      --glass-shadow: 0 20px 44px -20px rgba(14, 27, 44, .45);
      --sheet: rgba(250, 252, 254, .94);
      --ease-out: cubic-bezier(.22, 1, .36, 1);

      color-scheme: dark;

      --glass-border: rgba(148, 163, 184, .16);

    html, body { min-height: 100%; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    body { background: var(--canvas); font-feature-settings: "tnum" 1, "cv11" 1; text-rendering: optimizeLegibility; }
    /* Soft color haze behind everything (fixed, so cards scroll over it) */
    body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;

    .pt-safe { padding-top: env(safe-area-inset-top); }

    .card { background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--card-shadow); border-radius: 22px; }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass, .glass-sheet { background: var(--card-solid); } }

    .hero { position: relative; overflow: hidden; border-radius: 28px; color: #f1f5f9;

    @keyframes fabIn { from { opacity: 0; transform: translateY(16px) scale(.9); } to { opacity: 1; transform: none; } }
    /* Page entry: the page's sections rise in, one after another (plays when a tab opens). */
    .stagger > div > *:not([role=dialog]) { animation: rise .5s var(--ease-out) both; }

    .stagger > div > *:nth-child(4) { animation-delay: .12s; } .stagger > div > *:nth-child(5) { animation-delay: .16s; }
    .stagger > div > *:nth-child(6) { animation-delay: .2s; } .stagger > div > *:nth-child(7) { animation-delay: .24s; }

    /* Statement rows fade up as they come in from IndexedDB */
    .rise-list > * { animation: rise .42s var(--ease-out) both; }
    .rise-list > *:nth-child(2) { animation-delay: .03s; } .rise-list > *:nth-child(3) { animation-delay: .06s; } .rise-list > *:nth-child(4) { animation-delay: .09s; }
    .rise-list > *:nth-child(5) { animation-delay: .12s; } .rise-list > *:nth-child(6) { animation-delay: .15s; } .rise-list > *:nth-child(n+7) { animation-delay: .18s; }
    .fade-in { animation: fadeIn .3s var(--ease-out) both; }
    .sheet-in { animation: sheetIn .46s var(--ease-spring) backwards; }
    .sheet-out { animation: sheetOut .26s cubic-bezier(.4, 0, 1, 1) forwards; }
    .backdrop-in { animation: fadeIn .3s ease-out both; }
    .backdrop-out { animation: fadeOut .26s ease-in forwards; }
    .toast-in { animation: toastIn .42s var(--ease-spring) both; }
    .fab-in { animation: fabIn .5s .25s var(--ease-spring) both; }
    .skeleton { background: linear-gradient(100deg, rgba(148,163,184,.13) 30%, rgba(148,163,184,.30) 50%, rgba(148,163,184,.13) 70%); background-size: 300% 100%; animation: shimmer 1.5s ease-in-out infinite; border-radius: 14px; }
    /* Accordion: animates to the content's natural height */
    .accordion { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s var(--ease-out), opacity .32s; opacity: 0; }
    .accordion.open { grid-template-rows: 1fr; opacity: 1; }
    .accordion > div { overflow: hidden; min-height: 0; }
    /* Progress fills: gradient with a slow light sweep */
    .grow-bar { position: relative; overflow: hidden; transition: width 1.1s var(--ease-out); }
    .grow-bar.liquid::after { content: ''; position: absolute; inset: 0; width: 45%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: sheen 2.8s 1s ease-in-out infinite; }

    /* Savings animations: liquid waves, money pop-ups, glow on deposit */
    @keyframes waveX { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .wave-a { animation: waveX 6s linear infinite; transform-box: fill-box; }
    .wave-b { animation: waveX 9s linear infinite reverse; transform-box: fill-box; }
    @keyframes popUp { 0% { opacity: 0; transform: translateY(8px) scale(.9); } 15% { opacity: 1; transform: translateY(0) scale(1); } 75% { opacity: 1; transform: translateY(-12px); } 100% { opacity: 0; transform: translateY(-22px); } }
    .pop-up { animation: popUp 1.9s ease-out forwards; }
    @keyframes glowRing { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.45); } 100% { box-shadow: 0 0 0 16px rgba(16,185,129,0); } }
    .glow { animation: glowRing 1.1s ease-out; }
    /* Card due within 3 days or overdue: the badge pulses */
    @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(225,29,72,.55); } 70% { box-shadow: 0 0 0 9px rgba(225,29,72,0); } 100% { box-shadow: 0 0 0 0 rgba(225,29,72,0); } }
    .pulse-red { animation: pulseRed 1.6s ease-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .stagger > div > *:not([role=dialog]), .rise-list > *, .fade-in, .sheet-in, .sheet-out, .backdrop-in, .backdrop-out, .toast-in, .fab-in, .skeleton,
      .wave-a, .wave-b, .pop-up, .glow, .pulse-red, .grow-bar.liquid::after { animation: none !important; }
      .grow-bar, .press, .lift, .accordion { transition: none !important; }
    }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 14px system-ui; color: #64748b; }

  <!-- =====================================================================
       FinanceDB — native IndexedDB wrapper (plain JS, no dependencies).
       Exposed as window.FinanceDB so it can be reused outside React.
       ===================================================================== -->
  <script>
  (function () {
    'use strict';
    const DB_NAME = 'centric-wealth';
    const DB_VERSION = 1;

    // Schema: bump DB_VERSION and add to this map to migrate.
    const SCHEMA = {
      transactions: { keyPath: 'id', indexes: [['date', 'date'], ['type', 'type'], ['category', 'category'], ['hash', 'hash']] },
      debts:        { keyPath: 'id', indexes: [] },
      bills:        { keyPath: 'id', indexes: [['active', 'active']] },
      budgets:      { keyPath: 'category', indexes: [] },
      accounts:     { keyPath: 'id', indexes: [] },
      settings:     { keyPath: 'key', indexes: [] },
    };

    let dbPromise = null;

    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB is not supported in this browser.'));
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = req.result;
          const tx = req.transaction;
          for (const [name, def] of Object.entries(SCHEMA)) {
            const store = db.objectStoreNames.contains(name)
              ? tx.objectStore(name)
              : db.createObjectStore(name, { keyPath: def.keyPath });
            for (const [idx, path, opts] of def.indexes) {
              if (!store.indexNames.contains(idx)) store.createIndex(idx, path, opts || { unique: false });
            }
          }
        };
        req.onsuccess = () => {
          const db = req.result;
          db.onversionchange = () => { db.close(); dbPromise = null; }; // another tab upgraded
          resolve(db);
        };
        req.onerror = () => reject(req.error);
        req.onblocked = () => console.warn('[FinanceDB] upgrade blocked — close other tabs of this app.');
      });
      return dbPromise;
    }

    const promisify = (req) => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });

    /** Run fn(storeOrStores) inside a transaction; resolves after commit with fn's return value. */
    async function withTx(storeNames, mode, fn) {
      const db = await open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeNames, mode);
        const stores = Array.isArray(storeNames)
          ? Object.fromEntries(storeNames.map((n) => [n, tx.objectStore(n)]))
          : tx.objectStore(storeNames);
        let result;
        Promise.resolve(fn(stores, tx)).then((r) => { result = r; }).catch((err) => { try { tx.abort(); } catch (_) {} reject(err); });
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      });
    }

    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    const stamp = (obj) => { const now = new Date().toISOString(); return { createdAt: now, ...obj, updatedAt: now }; };

    const FinanceDB = {
      STORES: Object.keys(SCHEMA),
      uid,
      open,
      getAll: (store) => withTx(store, 'readonly', (s) => promisify(s.getAll())),
      get: (store, key) => withTx(store, 'readonly', (s) => promisify(s.get(key))),
      count: (store) => withTx(store, 'readonly', (s) => promisify(s.count())),
      /** Insert or update. Auto-assigns id (for id-keyed stores) and timestamps. */
      put: (store, obj) => withTx(store, 'readwrite', (s) => {
        const rec = stamp(SCHEMA[store].keyPath === 'id' && !obj.id ? { ...obj, id: uid() } : obj);
        s.put(rec);
        return rec;
      }),
      bulkPut: (store, arr) => withTx(store, 'readwrite', (s) => {
        const out = arr.map((o) => stamp(SCHEMA[store].keyPath === 'id' && !o.id ? { ...o, id: uid() } : o));
        out.forEach((r) => s.put(r));
        return out.length;
      }),
      delete: (store, key) => withTx(store, 'readwrite', (s) => { s.delete(key); }),
      clear: (store) => withTx(store, 'readwrite', (s) => { s.clear(); }),
      /** Range query on an index, e.g. FinanceDB.byIndex('transactions','date','2026-10-01','2026-10-31') */
      byIndex: (store, index, lower, upper) => withTx(store, 'readonly', (s) => {
        const range = lower != null && upper != null ? IDBKeyRange.bound(lower, upper) : lower != null ? IDBKeyRange.only(lower) : null;
        return promisify(s.index(index).getAll(range));
      }),

      // ---- settings helpers (key/value) ----
      getSetting: async (key, fallback) => { const r = await FinanceDB.get('settings', key); return r ? r.value : fallback; },
      setSetting: (key, value) => withTx('settings', 'readwrite', (s) => { s.put({ key, value }); }),

      // ---- backup / restore ----
      async exportAll() {
        const data = { app: 'centric-wealth', version: DB_VERSION, exportedAt: new Date().toISOString(), stores: {} };
        for (const name of FinanceDB.STORES) data.stores[name] = await FinanceDB.getAll(name);
        return data;
      },
      async importAll(data, { replace = false } = {}) {
        if (!data || !data.stores) throw new Error('Not a Centric Wealth backup file.');
        const names = FinanceDB.STORES.filter((n) => Array.isArray(data.stores[n]));
        await withTx(names, 'readwrite', (stores) => {
          for (const n of names) {
            if (replace) stores[n].clear();
            data.stores[n].forEach((rec) => stores[n].put(rec));
          }
        });
        return names.reduce((sum, n) => sum + data.stores[n].length, 0);
      },
      async wipe() {
        await withTx(FinanceDB.STORES, 'readwrite', (stores) => { Object.values(stores).forEach((s) => s.clear()); });
      },
    };

    window.FinanceDB = FinanceDB;
  })();
  </script>

  <!-- =====================================================================
       React app (JSX compiled in-browser by Babel Standalone)
       ===================================================================== -->
  <script type="text/babel" data-presets="react">
  const { useState, useEffect, useMemo, useCallback, useContext, createContext, useRef } = React;
  const DB = window.FinanceDB;

  /* ---------------------------------------------------------------- utils */
  const pad = (n) => String(n).padStart(2, '0');
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => toISO(new Date());
  const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const monthKey = (iso) => iso.slice(0, 7);
  const addMonths = (key, n) => { const [y, m] = key.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const monthLabel = (key, opts = { month: 'long', year: 'numeric' }) => { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, opts); };
  const daysInMonth = (y, m0) => new Date(y, m0 + 1, 0).getDate();
  const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  const prettyDate = (iso) => {
    const diff = daysBetween(todayISO(), iso);
    if (diff === 0) return 'Today';
    if (diff === -1) return 'Yesterday';
    if (diff === 1) return 'Tomorrow';
    return parseISO(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  };
  const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const cls = (...a) => a.filter(Boolean).join(' ');
  // Parses typed amounts like "1,234.56", "(45.00)" or "12,50".
  const parseAmount = (v) => {
    if (v == null) return NaN;
    let s = String(v).trim(); if (!s) return NaN;
    const neg = /^\(.*\)$/.test(s) || /-/.test(s);
    s = s.replace(/[^0-9.,]/g, '');
    if (/,\d{2}$/.test(s) && !/\.\d{2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
    const n = parseFloat(s); return isNaN(n) ? NaN : neg ? -n : n;
  };

  const EXPENSE_CATEGORIES = ['Housing', 'Utilities', 'Groceries', 'Dining', 'Transport', 'Health', 'Insurance', 'Shopping', 'Entertainment', 'Subscriptions', 'Debt Payment', 'Education', 'Government & Taxes', 'Fees & Interest', 'Travel', 'Gifts', 'Personal Payments', 'Other', 'Uncategorized'];
  const INCOME_CATEGORIES = ['Salary', 'Freelance', 'Interest', 'Refund', 'Gift', 'Payment Received', 'Other Income'];
  const DEBT_TYPES = ['Credit Card', 'Student Loan', 'Auto Loan', 'Mortgage', 'Personal Loan', 'Medical', 'Other'];
  const ACCOUNT_TYPES = ['Checking', 'Savings', 'Cash', 'Investment', 'Retirement', 'Property', 'Other'];
  const TRANSFER_CATEGORIES = ['Transfer', 'Card Payment', 'Card Credit', 'Money Lent', 'Money Borrowed', 'Loan Repayment', 'Loan Repaid to Me'];

  /* ------------------------------------------------- bank vs credit accounts
     Bank accounts (checking/savings/cash) live in the `accounts` store; credit cards live in `debts`
     so the payoff planner and Advisor include them. Transactions carry accountType + accountName.
     Imported ("ledger") accounts keep an anchor - a known balance on a date (statement ending balance,
     or one you typed) - and their balance = anchor + every tagged transaction after that date. */
  const BANK_TYPES = ['Checking', 'Savings', 'Cash'];
  const isBankAccount = (a) => a.kind === 'bank' || a.kind === 'cash' || (!a.kind && BANK_TYPES.includes(a.type)); // cash wallet counts as liquid cash
  const isCashWallet = (a) => a.kind === 'cash';
  const isFundAccount = (a) => a.kind === 'fund'; // Emergency Fund and savings goals
  const isCardDebt = (d) => d.kind === 'credit' || d.type === 'Credit Card';
  const sameName = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
  const acctTypeOf = (t) => (['bank', 'credit', 'cash', 'fund'].includes(t.accountType) ? t.accountType : null);
  const isMoneyIn = (t) => t.type === 'income' || (t.type === 'transfer' && t.direction === 'in');
  // Signed change to a balance: bank = cash in the account; credit = amount owed on the card.
  const txEffect = (t, kind) => (kind === 'credit' ? -1 : 1) * (isMoneyIn(t) ? 1 : -1) * Math.abs(Number(t.amount) || 0);
  function ledgerBalance(acct, kind, txs) {
    let bal = Number(acct.anchorBalance) || 0;
    // Entries dated after the anchor count. Same-day entries count only if added after the balance was set
    // (a statement's own rows are already inside its ending balance; a cash entry logged later today is not).
    const after = (t) => !acct.anchorDate || t.date > acct.anchorDate || (t.date === acct.anchorDate && !!acct.anchorSetAt && String(t.createdAt || '') > acct.anchorSetAt);
    for (const t of txs) if (acctTypeOf(t) === kind && sameName(t.accountName, acct.name) && after(t)) bal += txEffect(t, kind);
    return round2(bal);
  }
  const balanceNote = (a) => !a.ledger ? '' : a.balanceSource === 'statement' ? `statement balance ${prettyDate(a.anchorDate)}` : a.balanceSource === 'manual' ? `balance set ${prettyDate(a.anchorDate)}` : 'estimated from transactions';
  async function ensureAccount(kind, name, subtype, data) {
    const found = (kind === 'bank' ? data.accounts.filter(isBankAccount) : data.debts.filter(isCardDebt)).find((a) => sameName(a.name, name));
    if (found) return found;
    return DB.put(kind === 'bank' ? 'accounts' : 'debts', kind === 'bank'
      ? { name, type: subtype || 'Checking', balance: 0, kind: 'bank', ledger: true }
      : { name, type: 'Credit Card', balance: 0, apr: 0, minPayment: 0, kind: 'credit', ledger: true });
  }

  // Simple non-cryptographic hash for duplicate detection on import.
  const hashTx = (t) => { const s = `${t.date}|${round2(t.amount)}|${(t.description || '').toLowerCase().trim()}`; let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); };

  /* ------------------------------------------------------------ bills math */
  // Works out which occurrence of a bill is "current" and whether it's paid.
  // A payment made after occurrence N-1 counts toward occurrence N. A bill created
  // after an occurrence isn't treated as owing it. Missed cycles show as overdue.
  // Returns { currentDue, nextDue, paid, daysLeft } (daysLeft < 0 → overdue).
  function billStatus(bill, today = todayISO()) {
    const t = parseISO(today);
    const yearly = bill.frequency === 'yearly';
    const occ = (y, m0) => new Date(y, m0, Math.min(bill.dueDay || 1, daysInMonth(y, m0)));
    const step = (d, n) => (yearly ? occ(d.getFullYear() + n, d.getMonth()) : occ(d.getFullYear(), d.getMonth() + n));
    let next = yearly ? occ(t.getFullYear(), (bill.dueMonth || 1) - 1) : occ(t.getFullYear(), t.getMonth());
    if (next < t) next = step(next, 1);
    const prev = step(next, -1), prev2 = step(next, -2);
    const ref = bill.lastPaid ? parseISO(bill.lastPaid) : bill.createdAt ? parseISO(bill.createdAt.slice(0, 10)) : t;
    const out = (cur, paid) => ({ currentDue: toISO(cur), nextDue: toISO(paid ? step(cur, 1) : cur), paid, daysLeft: daysBetween(today, toISO(cur)) });
    if (ref > prev) return bill.lastPaid ? out(next, true) : out(next, false); // paid for upcoming, or brand-new bill
    if (ref > prev2) return out(next, false);                               // last cycle settled, next one pending
    return out(prev, false);                                                // missed the last cycle → overdue
  }
  const monthlyCost = (bill) => (bill.frequency === 'yearly' ? bill.amount / 12 : bill.amount);

  /* ------------------------------------------------------------ debt payoff */
  // Simulates payoff month by month. strategy: 'avalanche' (highest APR first) | 'snowball' (smallest balance first)
  // Shared with the Advisor tab (advisor-engine.js) so both screens give identical numbers.
  function simulatePayoff(debts, extra = 0, strategy = 'avalanche') {
    const r = AdvisorEngine.payoff(debts, extra, strategy);
    return { months: r.months || 0, interest: r.totalInterest, feasible: r.feasible, order: r.order.filter((o) => o.paidOffMonth).map((o) => ({ id: o.id, name: o.name, month: o.paidOffMonth })) };
  }

  /* ------------------------------------------------------------ app context */
  const AppCtx = createContext(null);
  const useApp = () => useContext(AppCtx);

  function useFinanceData() {
    const [data, setData] = useState({ transactions: [], debts: [], bills: [], budgets: [], accounts: [], settings: {} });
    const [ready, setReady] = useState(false);
    const [error, setError] = useState(null);

    const load = useCallback(async (only) => {
      const names = only ? [].concat(only) : DB.STORES;
      const entries = await Promise.all(names.map(async (n) => [n, await DB.getAll(n)]));
      setData((prev) => {
        const next = { ...prev };
        for (const [n, rows] of entries) next[n] = n === 'settings' ? Object.fromEntries(rows.map((r) => [r.key, r.value])) : rows;
        return next;
      });
    }, []);

    useEffect(() => { load().then(() => setReady(true)).catch((e) => { setError(e.message); setReady(true); }); }, [load]);

    const actions = useMemo(() => ({
      reload: load,
      save: async (store, obj) => { const r = await DB.put(store, obj); await load(store); return r; },
      remove: async (store, key) => { await DB.delete(store, key); await load(store); },
      bulk: async (store, arr) => { const n = await DB.bulkPut(store, arr); await load(store); return n; },
      setSetting: async (k, v) => { await DB.setSetting(k, v); await load('settings'); },
    }), [load]);

    return { data, ready, error, ...actions };
  }

  /* --------------------------------------------------------------- icons */
  // Renders Lucide icon nodes (from the UMD build) as React SVG elements.
  const camel = (k) => k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  function Icon({ name, size = 20, strokeWidth = 2, className = '' }) {
    const node = (window.lucide && (lucide.icons?.[name] || lucide[name]));
    if (!node) return <span style={{ width: size, height: size, display: 'inline-block' }} />;
    const children = node[0] === 'svg' ? node[2] : node;
    return (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
        {children.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...Object.fromEntries(Object.entries(attrs).map(([k, v]) => [camel(k), v])) }))}
      </svg>
    );
  }

  // Bottom sheet: springs up, slides down on close, can be dragged down by its handle to dismiss.
  function Sheet({ open, title, onClose, children }) {
    const [mounted, setMounted] = useState(open), [closing, setClosing] = useState(false);
    const cached = useRef(children), panel = useRef(), drag = useRef(null);
    if (open) cached.current = children;
    useEffect(() => {
      if (open) { setMounted(true); setClosing(false); return; }
      if (!mounted) return;
      if (prefersReducedMotion()) { setMounted(false); return; }
      setClosing(true);
      const t = setTimeout(() => { setMounted(false); setClosing(false); }, 260);
      return () => clearTimeout(t);
    }, [open]);
    useEffect(() => {
      if (!open) return;
      const onKey = (e) => e.key === 'Escape' && onClose();
      document.addEventListener('keydown', onKey);
      document.body.style.overflow = 'hidden';
      return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
    }, [open, onClose]);
    const onDown = (e) => { drag.current = { y: e.clientY, dy: 0 }; e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); };
    const onMove = (e) => { if (!drag.current || !panel.current) return; const dy = Math.max(0, e.clientY - drag.current.y); drag.current.dy = dy; panel.current.style.transition = 'none'; panel.current.style.transform = `translateY(${dy}px)`; };
    const onUp = () => {
      if (!drag.current || !panel.current) return; const { dy } = drag.current; drag.current = null;
      panel.current.style.transition = 'transform .3s cubic-bezier(.22,1,.36,1)';
      if (dy > 110) { panel.current.style.transform = 'translateY(105%)'; setTimeout(onClose, 200); }
      else panel.current.style.transform = '';
    };
    if (!mounted) return null;
    return (
      <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={title}>
        <div className={cls('absolute inset-0 bg-slate-950/45 backdrop-blur-[3px]', closing ? 'backdrop-out' : 'backdrop-in')} onClick={onClose} />
        <div ref={panel} className={cls('glass-sheet relative w-full max-w-lg max-h-[92vh] overflow-y-auto overscroll-contain rounded-t-[30px] border-t border-white/60 dark:border-white/10 pb-safe', closing ? 'sheet-out' : 'sheet-in')}>

            </div>

          </div>
          <div className="px-5 py-4">{open ? children : cached.current}</div>
        </div>
      </div>
    );

  function useSummary() {

      const income = monthTx.filter((t) => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const expense = monthTx.filter((t) => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const assets = data.accounts.reduce((s, a) => s + (Number(a.balance) || 0), 0);
      const liabilities = data.debts.reduce((s, d) => s + (Number(d.balance) || 0), 0);
      const savings = data.accounts.filter(isFundAccount).reduce((s, a) => s + (Number(a.balance) || 0), 0);
      const bankAccts = data.accounts.filter(isBankAccount), cards = data.debts.filter(isCardDebt);

      const cardOwed = cards.reduce((s, d) => s + (Number(d.balance) || 0), 0);
      const subs = data.bills.filter((b) => b.active !== false && b.isSubscription);
      const subsMonthly = subs.reduce((s, b) => s + monthlyCost(b), 0);
      const byCat = {};

                  <span className="inline-flex items-center gap-1.5"><i className="w-2 h-2 rounded-full bg-rose-400 inline-block" />Cards <AnimatedMoney value={s.cardOwed} short className="font-semibold text-white" /></span>
                </div>
              </>;
            })()}
            {s.savings > 0 && <p className="text-xs text-slate-300 mt-3 inline-flex items-center gap-1.5 rounded-full bg-white/[.07] px-2.5 py-1"><Icon name="PiggyBank" size={13} className="text-emerald-300" />Plus <AnimatedMoney value={s.savings} className="font-semibold text-white" /> set aside in savings funds</p>}
          </div>
        </section>
        <div className="grid grid-cols-2 gap-3 mt-3">
          <SummaryCard icon="Landmark" tone="sky" label="Bank Balance" amount={s.bankBalance} sub={`Liquid cash · ${s.bankAccts.length} account${s.bankAccts.length === 1 ? '' : 's'}${s.bankAccts.some((a) => a.ledger && a.balanceSource === 'estimated') ? '\nincludes estimates' : ''}`} onClick={() => go('budget', 'assets')} />
          <SummaryCard icon="CreditCard" tone="red" label="Credit Card Owed" amount={s.cardOwed} sub={`${s.cards.length} card${s.cards.length === 1 ? '' : 's'}${s.cards.some((c) => c.ledger && c.balanceSource === 'estimated') ? '\nincludes estimates' : ''}`} onClick={() => go('budget', 'debt')} />
        </div>

        <div className="grid grid-cols-2 gap-3 mt-3">
          <SummaryCard icon="Scale" label="Net Worth" amount={s.netWorth} sub={`${fmt(s.assets, true)} assets\n${fmt(s.liabilities, true)} debt`} onClick={() => go('budget', 'assets')} />
          <SummaryCard icon="TrendingUp" tone="green" label="Monthly Income" amount={s.income} sub={(() => { const n = s.monthTx.filter((t) => t.type === 'income').length; return `${n} deposit${n === 1 ? '' : 's'}`; })()} onClick={() => go('transactions')} />
          <SummaryCard icon="TrendingDown" tone="red" label="Monthly Expense" amount={s.expense} sub={savingsRate == null ? 'No income logged yet' : savingsRate < 0 ? 'More than income this month' : `Saving ${savingsRate}% of income`} onClick={() => go('transactions')} />
          <SummaryCard icon="Repeat" tone="violet" label="Active Subscriptions" value={String(s.subs.length)} sub={`${fmt(s.subsMonthly)}/mo\n${fmt(s.subsMonthly * 12, true)}/yr`} onClick={() => go('budget', 'bills')} />
        </div>

        <CardDueTracker />

        <Card className="mt-3 p-4">
          <div className="flex items-baseline justify-between">
            <p className="text-sm font-medium text-slate-500">Cash flow this month</p>
            <p className={cls('num font-bold', s.net >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400')}>{s.net >= 0 ? '+' : ''}<AnimatedMoney value={s.net} /></p>
          </div>
          <div className="mt-3 h-3 rounded-full bg-slate-900/[.06] dark:bg-white/[.07] overflow-hidden flex gap-0.5">
            {(s.income + s.expense) > 0 && <>
              <GrowBarRaw value={s.income / (s.income + s.expense)} color="linear-gradient(90deg,#34d399,#10b981)" />
              <GrowBarRaw value={s.expense / (s.income + s.expense)} color="linear-gradient(90deg,#fda4af,#fb7185)" />
            </>}
          </div>
          <div className="flex justify-between text-xs text-slate-500 mt-2">
            <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-emerald-500 inline-block" />In {fmt(s.income, true)}</span>
            <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-rose-400 inline-block" />Out {fmt(s.expense, true)}</span>
          </div>
        </Card>

        <SavingsSection />

        <RecurringCard />

        <SectionTitle action={<button className="press text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('budget', 'bills')}>All bills</button>}>Due soon</SectionTitle>
        <Card className="divide-y divide-slate-900/[.05] dark:divide-white/[.06] rise-list">
          {s.upcoming.length === 0 ? <p className="p-4 text-sm text-slate-500">Nothing due in the next 14 days.</p> :
            s.upcoming.slice(0, 4).map((b) => (
              <div key={b.id} className="flex items-center gap-3 p-3.5">
                <div className={cls('w-10 h-10 rounded-xl grid place-items-center', b.st.daysLeft <= 2 ? 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-400' : 'bg-slate-900/[.05] dark:bg-white/[.07] text-slate-500')}>
                  <Icon name={b.isSubscription ? 'Repeat' : 'Receipt'} size={18} />
                </div>
                <div className="flex-1 min-w-0">
                  <p className="font-medium truncate">{b.name}</p>
                  <p className="text-xs text-slate-500">{b.st.daysLeft < 0 ? `${-b.st.daysLeft}d overdue` : prettyDate(b.st.currentDue)}</p>
                </div>
                <p className="num font-semibold">{fmt(b.amount)}</p>
              </div>
            ))}
        </Card>

        <SpendingBreakdown />

        <MonthlyReportCard />

        <SectionTitle action={<button className="press text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('transactions')}>See all</button>}>Recent</SectionTitle>
        <Card className="divide-y divide-slate-900/[.05] dark:divide-white/[.06] rise-list">
          {recent.length === 0 ? <p className="p-4 text-sm text-slate-500">No transactions yet.</p> : recent.map((t) => <TxRow key={t.id} t={t} />)}
        </Card>
        </>}
      </div>
    );
  }

  /* ======================================= SPENDING BY ACCOUNT TYPE */
  const ACCOUNT_FILTERS = [{ value: 'all', label: 'All' }, { value: 'bank', label: 'Bank Accounts' }, { value: 'credit', label: 'Credit Cards' }];
  const SEG_COLOR = { credit: 'bg-violet-500', bank: 'bg-sky-500', cash: 'bg-amber-500', other: 'bg-slate-400 dark:bg-slate-500' };

  function SpendingBreakdown() {
    const { data, fmt } = useApp();
    const [month, setMonth] = useState(monthKey(todayISO()));
    const [view, setView] = useState('all');
    const agg = useMemo(() => {
      const by = {}; const tot = { bank: 0, credit: 0, cash: 0, other: 0 };
      data.transactions.filter((t) => t.type === 'expense' && monthKey(t.date) === month).forEach((t) => {
        const k = acctTypeOf(t) || 'other';
        const c = (by[t.category] ||= { bank: 0, credit: 0, cash: 0, other: 0 });
        c[k] += t.amount; tot[k] += t.amount;
      });
      return { cats: Object.entries(by).map(([cat, v]) => ({ cat, ...v, total: v.bank + v.credit + v.cash + v.other })), tot };
    }, [data.transactions, month]);
    const val = (c) => (view === 'all' ? c.total : c[view]);
    const rows = agg.cats.filter((c) => val(c) > 0.004).sort((a, b) => val(b) - val(a));
    const max = rows.length ? val(rows[0]) : 1;
    const all = agg.tot.bank + agg.tot.credit + agg.tot.cash + agg.tot.other;
    const share = (k) => (all > 0 ? Math.round((agg.tot[k] / all) * 100) : 0);

    return (
      <>
        <SectionTitle action={<div className="flex items-center gap-1">
          <button className="press w-7 h-7 grid place-items-center rounded-lg text-slate-500" onClick={() => setMonth(addMonths(month, -1))} aria-label="Previous month"><Icon name="ChevronLeft" size={16} /></button>
          <span className="text-xs font-semibold text-slate-600 dark:text-slate-300 w-[72px] text-center">{monthLabel(month, { month: 'short', year: 'numeric' })}</span>
          <button className="press w-7 h-7 grid place-items-center rounded-lg text-slate-500" onClick={() => setMonth(addMonths(month, 1))} aria-label="Next month"><Icon name="ChevronRight" size={16} /></button>
        </div>}>Spending by account</SectionTitle>
        <Card className="p-4">
          <Segmented value={view} onChange={setView} options={ACCOUNT_FILTERS} />
          <div className="grid grid-cols-2 gap-2 mt-3">
            <div className="rounded-xl bg-violet-50 dark:bg-violet-500/10 p-3"><p className="text-xs text-violet-700 dark:text-violet-300 inline-flex items-center gap-1"><Icon name="CreditCard" size={13} />Credit cards</p><p className="num font-bold">{fmt(agg.tot.credit)}</p><p className="text-[11px] text-slate-500">{share('credit')}% of spending</p></div>
            <div className="rounded-xl bg-sky-50 dark:bg-sky-500/10 p-3"><p className="text-xs text-sky-700 dark:text-sky-300 inline-flex items-center gap-1"><Icon name="Landmark" size={13} />Bank accounts</p><p className="num font-bold">{fmt(agg.tot.bank)}</p><p className="text-[11px] text-slate-500">{share('bank')}% of spending</p></div>
          </div>
          {agg.tot.cash > 0.004 && <p className="text-xs text-slate-500 mt-2 inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-amber-500 inline-block" />Plus {fmt(agg.tot.cash)} in cash ({share('cash')}%).</p>}
          {agg.tot.other > 0.004 && <p className="text-xs text-slate-500 mt-1">Plus {fmt(agg.tot.other)} not linked to an account.</p>}
          <div className="mt-4 space-y-3">
            {rows.length === 0 ? <p className="text-sm text-slate-500">No {view === 'bank' ? 'bank ' : view === 'credit' ? 'credit card ' : ''}spending in {monthLabel(month, { month: 'long' })}.</p> :
              rows.slice(0, 8).map((c) => (
                <div key={c.cat}>
                  <div className="flex justify-between text-sm mb-1"><span>{c.cat}</span><span className="num font-medium">{fmt(val(c))}</span></div>
                  <div className="h-2 rounded-full bg-slate-900/[.05] dark:bg-white/[.07] overflow-hidden flex">
                    {(view === 'all' ? ['credit', 'bank', 'cash', 'other'] : [view]).map((k) => c[k] > 0 && <div key={k} className={SEG_COLOR[k]} style={{ width: `${(c[k] / max) * 100}%` }} />)}
                  </div>
                  {view === 'all' && c.credit > 0 && c.bank > 0 && <p className="num text-[11px] text-slate-500 mt-1">Cards {fmt(c.credit)} · Bank {fmt(c.bank)}</p>}
                </div>
              ))}
          </div>
        </Card>
      </>
    );
  }

  /* ================================================= RECURRING CHARGES */
  const CADENCE_LABEL = { weekly: 'Weekly', biweekly: 'Every 2 weeks', monthly: 'Monthly', bimonthly: 'Every 2 months', quarterly: 'Quarterly', semiannual: 'Every 6 months', yearly: 'Yearly' };
  const FLAG_STYLE = {
    danger: 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300',
    warn: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300',
    info: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300',
  };

  function RecurringRow({ item }) {
    const { fmt, recurringAction } = useApp();
    const [busy, setBusy] = useState(false);
    const act = async (a) => { setBusy(true); await recurringAction(a, item); setBusy(false); };
    const cancelled = item.status === 'cancelled';
    const sub = item.kind === 'subscription';
    return (
      <div className={cls('p-3.5', cancelled && !item.flags.some((f) => f.severity === 'danger') && 'opacity-60')}>
        <div className="flex items-start gap-3">
          <div className={cls('w-10 h-10 rounded-xl grid place-items-center shrink-0', sub ? 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300' : 'bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300')}>
            <Icon name={sub ? 'Repeat' : item.kind === 'bill' ? 'Receipt' : 'CalendarClock'} size={18} />
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-baseline justify-between gap-2">
              <p className={cls('font-medium truncate', cancelled && 'line-through decoration-slate-400')}>{item.merchant}</p>
              <p className="num font-semibold shrink-0">{fmt(item.lastAmount)}</p>
            </div>
            <p className="text-xs text-slate-500 mt-0.5">
              {CADENCE_LABEL[item.cadence]} · {cancelled ? `cancelled ${prettyDate(item.decidedAt)}` : item.active ? `next ${prettyDate(item.nextDue)}` : `last ${prettyDate(item.lastDate)}`}
              {item.confidence === 'low' ? ' · possible' : ` · ${item.occurrences} charges`}
            </p>
            {item.flags.length > 0 && (
              <div className="flex flex-wrap gap-1.5 mt-2">
                {item.flags.map((f) => <span key={f.code} className={cls('text-[11px] font-medium px-2 py-0.5 rounded-md', FLAG_STYLE[f.severity])}>{f.message}</span>)}
              </div>
            )}
          </div>
        </div>
        <div className={cls('flex gap-2 mt-3', item.status !== 'new' && 'pl-[52px]')}>
          {item.status === 'new' && <>
            <Button variant="secondary" className="!h-9 !px-3 !text-sm flex-1 whitespace-nowrap" disabled={busy} onClick={() => act('keep')}><Icon name="Check" size={15} className="shrink-0" />Keep</Button>
            <Button variant="secondary" className="!h-9 !px-2 !text-sm flex-[1.4] whitespace-nowrap !text-rose-600 dark:!text-rose-400" disabled={busy} onClick={() => act('cancel')}><Icon name="Ban" size={15} className="shrink-0" />Mark as Cancelled</Button>
          </>}
          {item.status === 'kept' && <>
            <span className="text-xs font-semibold text-emerald-700 dark:text-emerald-400 inline-flex items-center gap-1 mr-auto"><Icon name="CircleCheck" size={14} />Kept{item.billId ? ' · in Bills' : ''}</span>
            <button className="press text-xs font-semibold text-rose-600 dark:text-rose-400" disabled={busy} onClick={() => act('cancel')}>Mark as Cancelled</button>
          </>}
          {cancelled && <>
            <span className="text-xs font-semibold text-slate-500 mr-auto">Saves {fmt(item.annualCost)}/yr</span>
            <button className="press text-xs font-semibold text-brand-700 dark:text-brand-400" disabled={busy} onClick={() => act('undo')}>Undo</button>
          </>}
        </div>
      </div>
    );
  }

  function RecurringCard() {
    const { recurring, fmt, go } = useApp();
    const [open, setOpen] = useState(false);
    if (!recurring) return null;
    const { items, summary } = recurring;
    const review = items.filter((i) => i.status === 'new' || i.flags.some((f) => f.severity === 'danger'));
    const kept = items.filter((i) => i.status === 'kept' && !review.includes(i));
    const cancelled = items.filter((i) => i.status === 'cancelled' && !review.includes(i));
    const preview = review.slice(0, 3);

    return (
      <>
        <SectionTitle action={items.length > 0 && <button className="press text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => setOpen(true)}>See all ({items.length})</button>}>Subscriptions & bills</SectionTitle>
        <Card className="overflow-hidden">
          <div className="p-4 border-b border-slate-100 dark:border-slate-800">
            <div className="flex items-baseline justify-between">
              <p className="num text-xl font-bold">{fmt(summary.monthlyTotal)}<span className="text-sm font-medium text-slate-500">/mo recurring</span></p>
              {summary.needsReview > 0 && <span className="text-xs font-semibold px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">{summary.needsReview} to review</span>}
            </div>
            <p className="text-xs text-slate-500 mt-1">
              {summary.subscriptions} subscription{summary.subscriptions === 1 ? '' : 's'} · {summary.bills} bill{summary.bills === 1 ? '' : 's'} · {fmt(summary.annualTotal, true)}/yr
              {summary.cancelledSavingsAnnual > 0 && <span className="text-emerald-600 dark:text-emerald-400"> · saving {fmt(summary.cancelledSavingsAnnual)}/yr</span>}
            </p>
          </div>
          {items.length === 0 ? (
            <p className="p-4 text-sm text-slate-500">No repeating charges found yet. Import a couple of months of statements and subscriptions will show up here. <button className="press font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('upload')}>Import</button></p>
          ) : preview.length === 0 ? (
            <p className="p-4 text-sm text-slate-500 flex items-center gap-2"><Icon name="CircleCheck" size={16} className="text-emerald-600" />All recurring charges reviewed.</p>
          ) : (
            <div className="divide-y divide-slate-900/[.05] dark:divide-white/[.06]">{preview.map((i) => <RecurringRow key={i.key} item={i} />)}</div>
          )}
          {review.length > preview.length && <button className="press w-full p-3 text-sm font-semibold text-brand-700 dark:text-brand-400 border-t border-slate-100 dark:border-slate-800" onClick={() => setOpen(true)}>Review {review.length - preview.length} more</button>}
        </Card>

        <Sheet open={open} title="Subscriptions & bills" onClose={() => setOpen(false)}>
          <p className="text-sm text-slate-500 -mt-1 mb-2">Found by looking for the same merchant charging a similar amount on a regular schedule. Everything is worked out on this device.</p>
          {[['Needs review', review], ['Kept', kept], ['Cancelled', cancelled]].filter(([, l]) => l.length).map(([title, list]) => (
            <div key={title}>
              <SectionTitle>{title} · {list.length}</SectionTitle>
              <Card className="divide-y divide-slate-900/[.05] dark:divide-white/[.06]">{list.map((i) => <RecurringRow key={i.key} item={i} />)}</Card>
            </div>
          ))}
        </Sheet>
      </>
    );
  }

  /* ===================================================== CATEGORY RULES */
  // Your merchant -> category mappings live in IndexedDB settings ("categoryRules") and are applied on every import.
  const ruleSign = (t) => (t.type === 'income' || (t.type !== 'expense' && t.direction === 'in') ? 'in' : 'out');
  const normText = (x) => (window.StatementParser ? StatementParser.normalizeText(x) : String(x || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim());
  // "PUBLIX #1534 TAMPA FL" -> "publix"; "BLUE BOTTLE COFFEE" -> "blue bottle". Editable before saving.
  function suggestRulePhrase(desc) {
    const words = (window.StatementParser ? StatementParser.normalizeDescription(desc) : normText(desc)).split(' ').filter((w) => w.length > 1);
    if (!words.length) return '';
    return words[0].length >= 5 ? words[0] : words.slice(0, 2).join(' ');
  }
  const ruleHits = (rule, t) => !!StatementParser.matchCustomRule(t.description, ruleSign(t) === 'in' ? 1 : -1, [rule]);
  async function saveCategoryRule(settings, rule) {
    const k = normText(rule.match);
    const rules = (settings.categoryRules || []).filter((r) => !(normText(r.match) === k && (r.sign || 'out') === rule.sign));
    rules.push({ ...rule, match: k, createdAt: new Date().toISOString() });
    await DB.setSetting('categoryRules', rules);
    return rules;
  }

  /* ========================================================= TRANSACTIONS */
  function TxRow({ t, onClick }) {
    const { fmt } = useApp();
    const moneyIn = isMoneyIn(t), transfer = t.type === 'transfer', income = t.type === 'income', card = acctTypeOf(t) === 'credit', cash = acctTypeOf(t) === 'cash';
    const icon = acctTypeOf(t) === 'fund' ? 'PiggyBank' : transfer ? (t.counterparty ? 'Send' : 'ArrowLeftRight') : income ? 'ArrowDownLeft' : card ? 'CreditCard' : cash ? 'Banknote' : 'ArrowUpRight';
    const tone = income ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400'
      : transfer ? 'bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300'
      : card ? 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300' : cash ? 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300';
    return (
      <button onClick={onClick} className="press w-full flex items-center gap-3 p-3.5 text-left active:bg-slate-50 dark:active:bg-slate-800/50">
        <div className={cls('w-10 h-10 rounded-xl grid place-items-center shrink-0', tone)}><Icon name={icon} size={18} /></div>
        <div className="flex-1 min-w-0">
          <p className="font-medium truncate">{t.description || t.category}</p>
          <p className="text-xs text-slate-500 truncate">{t.category === 'Uncategorized' && <span className="inline-flex items-center gap-0.5 mr-1 px-1.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-400/15 dark:text-amber-300 font-semibold"><Icon name="Tag" size={10} />Needs category</span>}{[t.counterparty, t.category === 'Uncategorized' ? null : t.category, t.accountName, prettyDate(t.date)].filter(Boolean).join(' · ')}</p>
        </div>
        <p className={cls('num font-semibold', income && 'text-emerald-600 dark:text-emerald-400', transfer && 'text-slate-500 dark:text-slate-400')}>{moneyIn ? '+' : '−'}{fmt(t.amount)}</p>
      </button>
    );
  }

  function TxForm({ initial, onDone }) {
    const { data, save, remove, toast, reload } = useApp();
    const [f, setF] = useState(() => initial || { type: 'expense', amount: '', category: 'Groceries', date: todayISO(), description: '', accountType: null, accountName: '' });
    const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target ? e.target.value : e }));
    const credit = f.accountType === 'credit';
    const cats = f.type === 'income' ? INCOME_CATEGORIES : f.type === 'transfer' ? TRANSFER_CATEGORIES : EXPENSE_CATEGORIES;
    useEffect(() => { if (!cats.includes(f.category)) setF((p) => ({ ...p, category: p.type === 'transfer' && credit ? 'Card Payment' : cats[0] })); }, [f.type, f.accountType]);
    const acctOptions = [{ value: '', label: 'No account (cash / other)' },
      ...data.accounts.filter(isBankAccount).map((a) => ({ value: `${isCashWallet(a) ? 'cash' : 'bank'}|${a.name}`, label: `${a.name} · ${isCashWallet(a) ? 'cash' : 'bank'}` })),
      ...data.debts.filter(isCardDebt).map((d) => ({ value: `credit|${d.name}`, label: `${d.name} · card` }))];
    const acctValue = f.accountType ? `${f.accountType}|${f.accountName}` : '';
    const pickAccount = (e) => {
      const [kind, ...rest] = e.target.value.split('|');
      setF((p) => ({ ...p, accountType: kind || null, accountName: rest.join('|'), ...(kind === 'credit' && p.type === 'income' ? { type: 'transfer', direction: 'in' } : {}) }));
    };
    // On a credit card: charges raise what you owe; payments and refunds are balance adjustments that lower it.
    const typeOptions = credit
      ? [{ value: 'expense', label: 'Charge' }, { value: 'transfer', label: 'Payment / Credit' }]
      : [{ value: 'expense', label: 'Expense' }, { value: 'income', label: 'Income' }, { value: 'transfer', label: 'Transfer' }];
    // Recategorising an imported/known merchant: offer to remember it and fix the matching transactions too.
    const recat = !!initial && f.category !== initial.category && f.type !== 'transfer' && f.category !== 'Uncategorized' && !!String(f.description || '').trim();
    const [remember, setRemember] = useState(true);
    const [phrase, setPhrase] = useState('');
    const [applyOthers, setApplyOthers] = useState(true);
    useEffect(() => { if (recat && !phrase) setPhrase(suggestRulePhrase(f.description)); }, [recat]);
    const sign = f.type === 'income' ? 'in' : 'out';
    const rule = recat && remember && normText(phrase) ? { match: phrase, category: f.category, sign, type: f.type } : null;
    const others = useMemo(() => (rule ? data.transactions.filter((t) => t.id !== initial.id && t.type === f.type && t.category !== f.category && ruleHits(rule, t)) : []), [rule && rule.match, rule && rule.category, f.type, data.transactions]);
    const phraseMatchesThis = !rule || ruleHits(rule, { ...f, type: f.type });
    const submit = async (e) => {
      e.preventDefault();
      const amount = round2(Math.abs(parseAmount(f.amount)));
      if (!amount) return toast('Enter an amount', 'error');
      const direction = f.type === 'expense' ? 'out' : f.type === 'income' ? 'in' : credit ? 'in' : (f.direction || 'out');
      const rec = { ...f, amount, direction, accountType: f.accountType || null, accountName: f.accountName || '', source: f.source || 'manual' };
      rec.hash = hashTx(rec);
      await save('transactions', rec);
      let msg = initial ? 'Transaction updated' : 'Transaction added';
      if (rule) {
        await saveCategoryRule(data.settings, rule);
        if (applyOthers && others.length) await DB.bulkPut('transactions', others.map((t) => ({ ...t, category: f.category })));
        await reload(['settings', 'transactions']);
        msg = `Saved. "${normText(phrase)}" will go to ${f.category}${applyOthers && others.length ? ` · ${others.length} more updated` : ''}`;
      }
      toast(msg);
      onDone();
    };
    return (
      <form onSubmit={submit} className="space-y-4">
        <Field label="Account"><Select options={acctOptions} value={acctOptions.some((o) => o.value === acctValue) ? acctValue : ''} onChange={pickAccount} /></Field>
        <Segmented value={f.type} onChange={set('type')} options={typeOptions} />
        {f.type === 'transfer' && !credit && <Field label="Direction"><Select options={[{ value: 'out', label: 'Out of this account' }, { value: 'in', label: 'Into this account' }]} value={f.direction || 'out'} onChange={set('direction')} /></Field>}
        <Field label="Amount"><Input inputMode="decimal" placeholder="0.00" value={f.amount} onChange={set('amount')} autoFocus={!initial} /></Field>
        <Field label="Description"><Input placeholder="e.g. Farmers market" value={f.description} onChange={set('description')} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Category"><Select options={cats.includes(f.category) ? cats : [f.category, ...cats]} value={f.category} onChange={set('category')} /></Field>
          <Field label="Date"><Input type="date" value={f.date} onChange={set('date')} /></Field>
        </div>
        {recat && (
          <div className="rounded-[16px] bg-brand-500/[.07] dark:bg-brand-400/[.08] p-3 space-y-2.5 fade-in" data-testid="remember-rule">
            <label className="flex items-start gap-2.5 text-sm">
              <input type="checkbox" className="mt-0.5 w-4 h-4 accent-emerald-600" checked={remember} onChange={(e) => setRemember(e.target.checked)} />
              <span><span className="font-semibold">Remember for future imports</span><span className="block text-xs text-slate-500">Descriptions containing this go to <b>{f.category}</b>.</span></span>
            </label>
            {remember && <>
              <Input aria-label="Merchant words to match" value={phrase} onChange={(e) => setPhrase(e.target.value)} placeholder="e.g. publix" />
              {!phraseMatchesThis && <p className="text-xs text-amber-700 dark:text-amber-300">These words don't appear in this transaction's description.</p>}
              {others.length > 0 && <label className="flex items-start gap-2.5 text-sm">
                <input type="checkbox" className="mt-0.5 w-4 h-4 accent-emerald-600" checked={applyOthers} onChange={(e) => setApplyOthers(e.target.checked)} />
                <span>Also move {others.length} other matching transaction{others.length === 1 ? '' : 's'} to {f.category}</span>
              </label>}
            </>}
          </div>
        )}
        <Button type="submit" className="w-full">{initial ? 'Save changes' : 'Add transaction'}</Button>
        {initial && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={async () => { if (confirm('Delete this transaction?')) { await remove('transactions', initial.id); toast('Deleted'); onDone(); } }}><Icon name="Trash2" size={16} />Delete</Button>}
      </form>
    );
  }

  /* =============================================================== UPLOAD */
  const KIND_INFO = {
    bank: { title: 'Bank Statement', sub: 'Checking or savings', icon: 'Landmark', placeholder: 'e.g. Chase Checking',
      how: 'Deposits count as income, withdrawals as expenses. Transfers between your accounts and payments to credit cards are kept separate so nothing is counted twice.' },

  /**
   * Save one parsed statement into its account and update the account's balance anchor.
   * balanceText: what the user typed (single import) or null to use the balance found on the statement.
   * Accounts are re-read from IndexedDB so several statements in a row don't create duplicate accounts.
   */
  async function importStatement({ report, file, kind, accountName, subtype, balanceText = null }) {
    const [accounts, debts] = await Promise.all([DB.getAll('accounts'), DB.getAll('debts')]);
    const acct = await ensureAccount(kind, accountName, subtype, { accounts, debts });
    const saved = await StatementParser.saveTransactions(report.transactions, { sourceName: file.name, accountType: kind, accountName });
    // Balance anchor: the statement's ending balance (or what the user typed) as of the statement date.
    const typed = balanceText == null ? null : String(balanceText).trim() === '' ? null : parseAmount(balanceText);
    const bal = balanceText == null ? report.meta.endingBalance ?? null : typed;
    const asOf = report.meta.endingBalanceDate || report.meta.statementEnd || report.meta.dateRange[1];
    const patch = { ledger: true, kind };
    if (kind === 'credit' && report.meta.creditLimit && !Number(acct.creditLimit)) patch.creditLimit = report.meta.creditLimit;
    if (kind === 'credit') {
      // Card details printed on the statement: fill gaps, and keep minimum/APR/limit current from the newest statement.
      const m = report.meta, newest = !acct.anchorDate || asOf >= acct.anchorDate;
      if (m.last4 && !acct.last4) patch.last4 = m.last4;
      if (m.apr && (newest || !(Number(acct.apr) > 0))) patch.apr = m.apr;
      if (m.minimumPayment != null && (newest || !Number(acct.minPayment))) patch.minPayment = m.minimumPayment;
      if (m.creditLimit && newest) patch.creditLimit = m.creditLimit;
      if (m.paymentDueDate && !acct.dueDay) { patch.dueDay = parseISO(m.paymentDueDate).getDate(); patch.dueSince = asOf; }
    }
    if (bal != null && !isNaN(bal) && (!acct.anchorDate || asOf >= acct.anchorDate)) {
      Object.assign(patch, { anchorSetAt: new Date().toISOString(), anchorBalance: round2(bal), anchorDate: asOf, balanceSource: report.meta.endingBalance != null && round2(bal) === round2(report.meta.endingBalance) ? 'statement' : 'manual' });
    } else if (!acct.ledger && Number(acct.balance)) {
      // An account you already tracked by hand: its current balance stays the starting point.
      Object.assign(patch, { anchorBalance: Number(acct.balance), anchorDate: todayISO(), anchorSetAt: new Date().toISOString(), balanceSource: 'manual' });
    } else if (acct.anchorBalance == null) patch.balanceSource = 'estimated';
    await DB.put(kind === 'bank' ? 'accounts' : 'debts', { ...acct, ...patch });
    return { ...saved, accountName, kind, needsApr: kind === 'credit' && !(Number(patch.apr ?? acct.apr) > 0), cardDetails: kind === 'credit' ? ['last4', 'apr', 'minPayment', 'dueDay'].filter((k) => patch[k] != null) : [] };
  }
  const statementEnd = (r) => r.meta.endingBalanceDate || r.meta.statementEnd || r.meta.dateRange[1];
  const shortRange = (r) => `${parseISO(r.meta.dateRange[0]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${parseISO(r.meta.dateRange[1]).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
  let batchSeq = 0;

  // Card statement: does it add up, and which card details were found (saved to the card on import).
  function StatementCheck({ meta: m, compact }) {
    const { fmt } = useApp();
    const r = m.reconciliation;
    const found = [m.last4 && `ending ${m.last4}`, m.paymentDueDate && `due ${prettyDate(m.paymentDueDate)}`, m.minimumPayment != null && `minimum ${fmt(m.minimumPayment)}`, m.apr && `APR ${m.apr}%`, m.creditLimit && `limit ${fmt(m.creditLimit, true)}`].filter(Boolean);
    if (compact) return r ? (r.ok ? <span className="text-emerald-700 dark:text-emerald-400"> · adds up ✓</span> : <span className="text-amber-700 dark:text-amber-300"> · doesn’t add up</span>) : null;
    return (
      <div className="mt-3 space-y-1.5 text-xs" data-testid="statement-check">
        {r && (r.ok
          ? <p className="flex gap-1.5 text-emerald-800 dark:text-emerald-300"><Icon name="CircleCheck" size={14} className="shrink-0 mt-px" /><span className="num">Adds up: previous {fmt(r.previousBalance)} + charges {fmt(r.charges)} − payments & credits {fmt(r.credits)} = new balance {fmt(r.newBalance)}</span></p>
          : <p className="flex gap-1.5 text-amber-800 dark:text-amber-300"><Icon name="TriangleAlert" size={14} className="shrink-0 mt-px" /><span className="num">Doesn’t add up: transactions give {fmt(r.expected)} but the statement says {fmt(r.newBalance)}. The balance will use the statement’s figure.</span></p>)}
        {m.interestCharged > 0 && <p className="flex gap-1.5 text-slate-600 dark:text-slate-300"><Icon name="Percent" size={14} className="shrink-0 mt-px" />Interest of {fmt(m.interestCharged)} for this period is added as a charge.</p>}
        {found.length > 0 && <p className="flex gap-1.5 text-slate-600 dark:text-slate-300"><Icon name="CreditCard" size={14} className="shrink-0 mt-px" /><span>Card details found: {found.join(' · ')}. Missing details are saved to the card; the due date can be changed any time.</span></p>}
      </div>
    );
  }

        <Card className="divide-y divide-slate-900/[.05] dark:divide-white/[.06] rise-list" data-testid="batch-list">

                      : <>{shortRange(it.report)}{inf ? <> · <b className="text-slate-700 dark:text-slate-200">{inf.fresh} new</b>{inf.dup ? ` · ${inf.dup} already imported` : ''}{inf.unc ? ` · ${inf.unc} uncategorized` : ''}</> : ''}{it.report.meta.endingBalance != null ? ` · balance ${fmt(it.report.meta.endingBalance)}` : ''}{it.kind === 'credit' && <StatementCheck meta={it.report.meta} compact />}</>
