            <form className="space-y-4" onSubmit={async (e) => { e.preventDefault(); if (!edit.name) return toast('Name it', 'error'); const bal = round2(parseAmount(edit.balance) || 0); const orig = data.debts.find((x) => x.id === edit.id); const balChanged = !orig || Math.abs(bal - Number(orig.balance)) > 0.004; await save('debts', { ...edit, balance: bal, apr: Number(edit.apr) || 0, minPayment: round2(parseAmount(edit.minPayment) || 0), ...(edit.ledger && balChanged ? { anchorBalance: bal, anchorDate: todayISO(), balanceSource: 'manual' } : {}) }); setEdit(null); toast('Debt saved'); }}>
              <Field label="Name"><Input value={edit.name} onChange={(e) => setEdit({ ...edit, name: e.target.value })} placeholder="e.g. Visa card" /></Field>
              <Field label="Type"><Select options={DEBT_TYPES} value={edit.type} onChange={(e) => setEdit({ ...edit, type: e.target.value })} /></Field>
              <div className="grid grid-cols-3 gap-3">
                <Field label="Balance"><Input inputMode="decimal" value={edit.balance} onChange={(e) => setEdit({ ...edit, balance: e.target.value })} /></Field>
                <Field label="APR %"><Input inputMode="decimal" value={edit.apr} onChange={(e) => setEdit({ ...edit, apr: e.target.value })} /></Field>
                <Field label="Min/mo"><Input inputMode="decimal" value={edit.minPayment} onChange={(e) => setEdit({ ...edit, minPayment: e.target.value })} /></Field>
              </div>
              <Button type="submit" className="w-full">Save</Button>
              {edit.id && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={async () => { if (confirm('Delete this debt?')) { await remove('debts', edit.id); setEdit(null); } }}>Delete</Button>}
            </form>
          )}
        </Sheet>
        <Sheet open={!!pay} title={`Payment · ${pay?.name || ''}`} onClose={() => setPay(null)}>
          {pay && (
            <form className="space-y-4" onSubmit={submitPay}>
              <Field label="Amount" hint={data.debts.find((x) => x.id === pay.id)?.ledger ? 'Recorded as a card payment (balance adjustment), not spending.' : 'Reduces the balance and logs a Debt Payment expense.'}><Input inputMode="decimal" value={pay.amount} onChange={(e) => setPay({ ...pay, amount: e.target.value })} autoFocus /></Field>
              <Button type="submit" className="w-full">Log payment</Button>
            </form>
          )}
        </Sheet>
      </div>
    );
  }

  function BillsTab() {
    const { data, save, remove, fmt, toast } = useApp();
    const [edit, setEdit] = useState(null);
    const bills = data.bills.map((b) => ({ ...b, st: billStatus(b) })).sort((a, b) => (a.active === false) - (b.active === false) || a.st.daysLeft - b.st.daysLeft);
    const monthlyTotal = data.bills.filter((b) => b.active !== false).reduce((s, b) => s + monthlyCost(b), 0);

    const markPaid = async (b) => {
      const { st, ...bill } = b;
      await save('bills', { ...bill, lastPaid: todayISO() });
      if (b.logExpense !== false) {
        const tx = { type: 'expense', amount: b.amount, category: b.category || (b.isSubscription ? 'Subscriptions' : 'Utilities'), date: todayISO(), description: b.name, source: 'bill', billId: b.id };
        tx.hash = hashTx(tx); await save('transactions', tx);
      }
      toast(`${b.name} marked paid`);
    };

    return (
      <div>
        <Card className="p-4 mt-4">
          <p className="text-sm text-slate-500">Recurring bills</p>
          <p className="num text-2xl font-bold">{fmt(monthlyTotal)}<span className="text-base font-medium text-slate-500">/mo</span></p>
          <p className="text-xs text-slate-500 mt-1">{data.settings.notify ? 'Reminders on' : 'Turn on reminders in Settings'} · charges found in imports mark bills as paid.</p>
        </Card>
        <SectionTitle action={<button className="text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => setEdit({ name: '', amount: '', dueDay: new Date().getDate(), dueMonth: new Date().getMonth() + 1, frequency: 'monthly', isSubscription: false, category: 'Utilities', active: true })}>+ Add</button>}>Bills & subscriptions</SectionTitle>
        {bills.length === 0 ? <Card><Empty icon="Bell" title="No bills yet" body="Add rent, utilities and subscriptions to get due-date reminders." /></Card> :
          <Card className="divide-y divide-slate-100 dark:divide-slate-800">
            {bills.map((b) => {
              const overdue = !b.st.paid && b.st.daysLeft < 0; const soon = !b.st.paid && b.st.daysLeft <= 3;
              return (
                <div key={b.id} className={cls('flex items-center gap-3 p-3.5', b.active === false && 'opacity-50')}>
                  <button className="flex-1 min-w-0 text-left" onClick={() => { const { st, ...rest } = b; setEdit({ ...rest, amount: String(b.amount) }); }}>
                    <p className="font-medium truncate flex items-center gap-1.5">{b.name}{b.isSubscription && <span className="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300">Sub</span>}</p>
                    <p className={cls('text-xs', overdue ? 'text-rose-600 font-semibold' : soon ? 'text-amber-600 font-medium' : 'text-slate-500')}>
                      {b.st.paid ? `Paid · next ${prettyDate(b.st.nextDue)}` : overdue ? `${-b.st.daysLeft}d overdue` : `Due ${prettyDate(b.st.currentDue)}`} · {b.frequency}
                    </p>
                  </button>
                  <p className="num font-semibold">{fmt(b.amount)}</p>
                  <button onClick={() => !b.st.paid && markPaid(b)} disabled={b.st.paid || b.active === false} aria-label={b.st.paid ? 'Paid' : 'Mark paid'}
                    className={cls('w-9 h-9 rounded-full grid place-items-center border', b.st.paid ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 text-slate-400')}>
                    <Icon name="Check" size={16} strokeWidth={3} />
                  </button>
                </div>
              );
            })}
          </Card>}
        <Sheet open={!!edit} title={edit?.id ? 'Edit bill' : 'New bill'} onClose={() => setEdit(null)}>
          {edit && (
            <form className="space-y-4" onSubmit={async (e) => { e.preventDefault(); const amount = round2(parseAmount(edit.amount)); if (!edit.name || !amount) return toast('Name and amount required', 'error'); await save('bills', { ...edit, amount, dueDay: Number(edit.dueDay), dueMonth: Number(edit.dueMonth) }); setEdit(null); toast('Bill saved'); }}>
              <Field label="Name"><Input value={edit.name} onChange={(e) => setEdit({ ...edit, name: e.target.value })} placeholder="e.g. Rent, Streaming" /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Amount"><Input inputMode="decimal" value={edit.amount} onChange={(e) => setEdit({ ...edit, amount: e.target.value })} /></Field>
                <Field label="Frequency"><Select options={[{ value: 'monthly', label: 'Monthly' }, { value: 'yearly', label: 'Yearly' }]} value={edit.frequency} onChange={(e) => setEdit({ ...edit, frequency: e.target.value })} /></Field>
                {edit.frequency === 'yearly' && <Field label="Month"><Select options={Array.from({ length: 12 }, (_, i) => ({ value: i + 1, label: new Date(2000, i, 1).toLocaleDateString(undefined, { month: 'long' }) }))} value={edit.dueMonth} onChange={(e) => setEdit({ ...edit, dueMonth: e.target.value })} /></Field>}
                <Field label="Due day"><Select options={Array.from({ length: 31 }, (_, i) => ({ value: i + 1, label: String(i + 1) }))} value={edit.dueDay} onChange={(e) => setEdit({ ...edit, dueDay: e.target.value })} /></Field>
                <Field label="Category"><Select options={EXPENSE_CATEGORIES} value={edit.category} onChange={(e) => setEdit({ ...edit, category: e.target.value })} /></Field>
              </div>
              {[['isSubscription', 'This is a subscription'], ['active', 'Active'], ['logExpense', 'Log an expense when marked paid']].map(([k, label]) => (
                <label key={k} className="flex items-center justify-between text-sm"><span>{label}</span>
                  <input type="checkbox" className="w-5 h-5 accent-emerald-600" checked={k === 'isSubscription' ? !!edit[k] : edit[k] !== false} onChange={(e) => setEdit({ ...edit, [k]: e.target.checked })} /></label>
              ))}
              <Button type="submit" className="w-full">Save</Button>
              {edit.id && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={async () => { if (confirm('Delete this bill?')) { await remove('bills', edit.id); setEdit(null); } }}>Delete</Button>}
            </form>
          )}
        </Sheet>
      </div>
    );
  }

              <Button type="submit" className="w-full">Save</Button>
              {edit.id && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={async () => { if (confirm('Delete this asset?')) { await remove('accounts', edit.id); setEdit(null); } }}>Delete</Button>}

        <header className="pt-2"><h1 className="text-2xl font-bold tracking-tight">Budget & Debt</h1></header>
        <div className="mt-4"><Segmented value={sub} onChange={setSub} options={[{ value: 'budget', label: 'Budget' }, { value: 'debt', label: 'Debt' }, { value: 'bills', label: 'Bills' }, { value: 'assets', label: 'Assets' }]} /></div>
        {sub === 'budget' && <BudgetTab />}

  }

  /* ====================================================== ADVISOR */
  const GRADE_TONE = (g) => !g ? 'text-slate-400' : g.startsWith('A') ? 'text-emerald-600 dark:text-emerald-400' : g.startsWith('B') ? 'text-lime-600 dark:text-lime-400' : g.startsWith('C') ? 'text-amber-600 dark:text-amber-400' : 'text-rose-600 dark:text-rose-400';
  const STATUS_BAR = { good: 'bg-emerald-500', ok: 'bg-amber-500', bad: 'bg-rose-500' };
  const fmtPct = (v, d = 0) => (v == null || !isFinite(v) ? '-' : `${(v * 100).toFixed(d)}%`);
  const monthsText = (m) => (m == null ? 'never' : m < 12 ? `${m} mo` : `${Math.floor(m / 12)} yr${m >= 24 ? 's' : ''}${m % 12 ? ` ${m % 12} mo` : ''}`);

  function Bar({ value, className = 'bg-brand-500', track = 'bg-slate-100 dark:bg-slate-800', h = 'h-2' }) {
    return <div className={cls(h, 'rounded-full overflow-hidden', track)}><div className={cls('h-full rounded-full transition-all', className)} style={{ width: `${clamp01(value) * 100}%` }} /></div>;
  }
  const clamp01 = (v) => Math.min(1, Math.max(0, Number(v) || 0));

  function GradeRing({ grade, score }) {
    const r = 42, c = 2 * Math.PI * r, v = clamp01((score || 0) / 100);
    return (
      <div className="relative w-28 h-28 shrink-0">
        <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90" aria-hidden="true">
          <circle cx="50" cy="50" r={r} fill="none" strokeWidth="9" className="stroke-slate-100 dark:stroke-slate-800" />
          <circle cx="50" cy="50" r={r} fill="none" strokeWidth="9" strokeLinecap="round" stroke="currentColor" className={GRADE_TONE(grade)} strokeDasharray={c} strokeDashoffset={c * (1 - v)} style={{ transition: 'stroke-dashoffset .6s ease' }} />
        </svg>
        <div className="absolute inset-0 grid place-items-center text-center">
          <div><p className={cls('text-3xl font-extrabold leading-none', GRADE_TONE(grade))}>{grade || '–'}</p>{score != null && <p className="num text-xs text-slate-500 mt-1">{score}/100</p>}</div>
        </div>
      </div>
    );
  }

  function AdvisorView() {
    const { data, fmt, go } = useApp();
    const [extra, setExtra] = useState(() => String(data.settings.debtExtra ?? 100));
    const extraNum = Math.max(0, parseAmount(extra) || 0);
    const report = useMemo(() => AdvisorEngine.analyze(
      { transactions: data.transactions, bills: data.bills, debts: data.debts, accounts: data.accounts, budgets: data.budgets },
      { extra: extraNum }), [data.transactions, data.bills, data.debts, data.accounts, data.budgets, extraNum]);
    const { metrics: m, health: h, budget503020: plan, debt: d, recommendations: recs } = report;
    const [strategy, setStrategy] = useState(null);
    const shown = strategy || d.recommended || 'avalanche';
    const plan2 = d[shown];
    const periodLabel = m.period.months.length
      ? `${m.period.months.length === 1 ? monthLabel(m.period.months[0]) : `${monthLabel(m.period.months[0], { month: 'short' })} – ${monthLabel(m.period.months[m.period.months.length - 1], { month: 'short', year: 'numeric' })}`}${m.period.partial ? ' (month to date)' : ` · ${m.period.months.length}-month average`}`
      : 'No data yet';

    return (
      <div>
        <header className="pt-2">
          <h1 className="text-2xl font-bold tracking-tight">Budget & Health Advisor</h1>
          <p className="text-sm text-slate-500 mt-0.5">{periodLabel}</p>
        </header>

        {/* ---- Health score ---- */}
        <Card className="mt-4 p-4">
          <div className="flex items-center gap-4">
            <GradeRing grade={h.grade} score={h.score} />
            <div className="min-w-0">
              <p className="text-xs font-semibold uppercase tracking-wide text-slate-500">Financial health</p>
              <p className="font-semibold mt-1 leading-snug">{h.summary}</p>
              {h.caps && h.caps.map((c) => <p key={c} className="text-xs text-rose-600 dark:text-rose-400 mt-1">{c}</p>)}
            </div>
          </div>
          {!h.grade ? (
            <div className="mt-4 flex gap-2"><Button className="flex-1" onClick={() => go('upload')}><Icon name="Upload" size={16} />Import statements</Button><Button variant="secondary" className="flex-1" onClick={() => go('transactions')}>Add manually</Button></div>
          ) : (
            <div className="mt-4 space-y-3.5">
              {h.factors.map((f) => (
                <div key={f.id}>
                  <div className="flex items-baseline justify-between text-sm mb-1.5">
                    <span className="font-medium">{f.label}</span>
                    <span className="num text-slate-500"><span className="font-semibold text-slate-800 dark:text-slate-100">{typeof f.value === 'number' ? fmt(f.value) : f.value}</span> · {f.points}/{f.max}</span>
                  </div>
                  <Bar value={f.ratio} className={STATUS_BAR[f.status]} />
                  <p className="text-xs text-slate-500 mt-1">Target: {f.target}</p>
                </div>
              ))}
            </div>
          )}
        </Card>

        {/* ---- Monthly picture ---- */}
        {m.hasData && <>
          <SectionTitle>Your average month</SectionTitle>
          <Card className="p-4">
            <div className="grid grid-cols-2 gap-3">
              {[['Income', m.income, 'text-emerald-600 dark:text-emerald-400'], ['Left over', m.leftOver, m.leftOver >= 0 ? '' : 'text-rose-600'], ['Fixed expenses', m.fixedExpenses, ''], ['Variable expenses', m.variableExpenses, '']].map(([l, v, c]) => (
                <div key={l} className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3"><p className="text-xs text-slate-500">{l}</p><p className={cls('num text-lg font-bold', c)}>{fmt(v)}</p></div>
              ))}
            </div>
            {m.income > 0 && (() => {
              const fx = m.fixedExpenses / m.income, vr = m.variableExpenses / m.income, sv = Math.max(0, m.leftOver) / m.income;
              return (<>
                <div className="mt-4 h-3 rounded-full overflow-hidden flex bg-slate-100 dark:bg-slate-800">
                  <div className="bg-sky-500" style={{ width: `${clamp01(fx) * 100}%` }} />
                  <div className="bg-amber-400" style={{ width: `${clamp01(Math.min(vr, 1 - clamp01(fx))) * 100}%` }} />
                  <div className="bg-emerald-500" style={{ width: `${clamp01(sv) * 100}%` }} />
                </div>
                <div className="flex justify-between text-xs text-slate-500 mt-2">
                  <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-sky-500 inline-block" />Fixed {fmtPct(fx)}</span>
                  <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-amber-400 inline-block" />Variable {fmtPct(vr)}</span>
                  <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-emerald-500 inline-block" />Saved {fmtPct(m.savingsRate)}</span>
                </div>

            })()}
          </Card>
        </>}

        {/* ---- 50/30/20 ---- */}
        {m.income > 0 && <>
          <SectionTitle>50/30/20 budget</SectionTitle>
          <Card className="p-4">
            <p className="text-sm text-slate-500">Based on {fmt(plan.income)} monthly take-home pay.</p>
            <div className="mt-3 space-y-4">
              {plan.rows.map((r) => {
                const isSave = r.key === 'savings';
                const good = isSave ? r.actual >= r.target : r.actual <= r.target;
                return (
                  <div key={r.key}>
                    <div className="flex items-baseline justify-between">
                      <p className="font-semibold">{r.label} <span className="text-xs font-medium text-slate-500">{Math.round(r.targetShare * 100)}%</span></p>
                      <p className="num text-sm"><span className={cls('font-semibold', good ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400')}>{fmt(r.actual)}</span><span className="text-slate-500"> / {fmt(r.target)}</span></p>
                    </div>
                    <div className="mt-1.5 relative">
                      <Bar value={r.target > 0 ? Math.max(0, r.actual) / (r.target * (isSave ? 1 : 1.5)) : 0} h="h-2.5" className={good ? 'bg-emerald-500' : isSave ? 'bg-amber-500' : 'bg-rose-500'} />
                      {!isSave && <span className="absolute top-[-3px] h-[16px] w-0.5 bg-slate-400 dark:bg-slate-500 rounded" style={{ left: `${100 / 1.5}%` }} title="Target" />}
                    </div>
                    <p className="text-xs text-slate-500 mt-1">{fmtPct(r.actualShare)} of income · {isSave ? (good ? `${fmt(r.actual - r.target)} above target` : `${fmt(r.target - r.actual)} short`) : (good ? `${fmt(r.difference)} under target` : `${fmt(-r.difference)} over target`)}</p>
                  </div>
                );
              })}
            </div>
            {plan.suggestion && <p className="mt-4 text-sm rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3 flex gap-2"><Icon name="Lightbulb" size={16} className="text-amber-500 shrink-0 mt-0.5" /><span>{plan.suggestion.replace(/(\d+\.\d{2})/, (n) => fmt(Number(n)))}</span></p>}
            {plan.topWants.length > 0 && <p className="text-xs text-slate-500 mt-2">Biggest wants: {plan.topWants.map((w) => `${w.category} ${fmt(w.amount)}`).join(' · ')}</p>}
          </Card>
        </>}

        {/* ---- Debt paydown ---- */}
        <SectionTitle action={<button className="text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('budget', 'debt')}>Edit debts</button>}>Debt paydown</SectionTitle>
        {data.debts.filter((x) => x.balance > 0).length === 0 ? (
          <Card><Empty icon="CreditCard" title="No debts tracked" body="Add your cards and loans to compare payoff plans." action={<Button variant="secondary" onClick={() => go('budget', 'debt')}>Add a debt</Button>} /></Card>
        ) : (
          <Card className="p-4">
            <div className="grid grid-cols-3 gap-2 text-center">
              {[['Total debt', fmt(m.debt.total, true)], ['Avg APR', `${m.debt.weightedApr.toFixed(1)}%`], ['Debt-to-income', fmtPct(m.debt.dti)]].map(([l, v]) => (
                <div key={l} className="rounded-xl bg-slate-50 dark:bg-slate-800/60 py-2.5 px-1"><p className="text-[11px] text-slate-500">{l}</p><p className="num font-bold">{v}</p></div>
              ))}
            </div>
            <p className="num text-xs text-slate-500 mt-2">{fmt(m.debt.minPayments)}/mo minimums · about {fmt(m.debt.monthlyInterest)}/mo goes to interest right now</p>

            <div className="mt-4"><Field label="Extra payment per month"><Input inputMode="decimal" value={extra} onChange={(e) => setExtra(e.target.value)} onBlur={() => DB.setSetting('debtExtra', extraNum)} /></Field></div>

            <div className="grid grid-cols-2 gap-2 mt-4">
              {['avalanche', 'snowball'].map((k) => {
                const p = d[k]; const sel = shown === k;
                return (
                  <button key={k} onClick={() => setStrategy(k)} className={cls('text-left rounded-xl border-2 p-3 transition-colors', sel ? 'border-brand-500 bg-brand-50/60 dark:bg-brand-500/10' : 'border-slate-200 dark:border-slate-700')}>
                    <div className="flex items-center justify-between"><p className="font-semibold capitalize">{k}</p>{d.recommended === k && <span className="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded bg-brand-600 text-white">Best</span>}</div>
                    <p className="text-[11px] text-slate-500">{k === 'avalanche' ? 'Highest APR first' : 'Smallest balance first'}</p>
                    {p.feasible ? <>
                      <p className="num font-bold mt-2">{monthsText(p.months)}</p>
                      <p className="num text-xs text-slate-500">{fmt(p.totalInterest)} interest</p>
                      <p className="num text-xs text-slate-500">first payoff: month {p.firstPayoffMonth}</p>
                    </> : <p className="text-xs text-rose-600 mt-2">Doesn’t cover interest</p>}
                  </button>
                );
              })}
            </div>
            <p className="text-sm mt-3 flex gap-2"><Icon name="Target" size={16} className="text-brand-600 shrink-0 mt-0.5" /><span>{d.reason.replace(/(\d+\.\d{2})/g, (n) => fmt(Number(n)))}</span></p>
            {d.interestSavedVsMinimum > 0 && <p className="text-xs text-emerald-700 dark:text-emerald-400 mt-1">vs. no extra payment: {fmt(d.interestSavedVsMinimum)} less interest, debt-free {d.monthsSavedVsMinimum} months sooner.</p>}

            {plan2.feasible && <>
              <p className="text-xs font-semibold uppercase tracking-wide text-slate-500 mt-5 mb-2">Payoff order · {shown}</p>
              <ol className="space-y-3">
                {plan2.order.map((o, i) => (
                  <li key={o.id || o.name}>
                    <div className="flex items-baseline justify-between text-sm">
                      <span className="font-medium"><span className="text-slate-400 mr-1.5">{i + 1}.</span>{o.name} <span className="text-xs text-slate-500">{o.apr}%</span></span>
                      <span className="num text-xs text-slate-500">{fmt(o.startBalance, true)} · paid off {monthLabel(addMonths(monthKey(todayISO()), o.paidOffMonth), { month: 'short', year: 'numeric' })}</span>
                    </div>
                    <div className="mt-1.5"><Bar value={o.paidOffMonth / plan2.months} className="bg-brand-500" /></div>
                  </li>
                ))}
              </ol>
              <p className="num text-xs text-slate-500 mt-3">{fmt(plan2.monthlyBudget)}/mo total · {fmt(plan2.totalPaid)} paid over {monthsText(plan2.months)}</p>
            </>}
          </Card>
        )}

        {/* ---- Recommendations ---- */}
        {recs.length > 0 && <>
          <SectionTitle>Next steps</SectionTitle>
          <Card className="divide-y divide-slate-100 dark:divide-slate-800">
            {recs.map((r) => (
              <div key={r.id} className="flex gap-3 p-3.5">
                <div className={cls('w-8 h-8 rounded-lg grid place-items-center shrink-0', r.severity === 'high' ? 'bg-rose-100 text-rose-600 dark:bg-rose-500/15' : r.severity === 'medium' ? 'bg-amber-100 text-amber-700 dark:bg-amber-500/15' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15')}>
                  <Icon name={r.severity === 'high' ? 'ShieldAlert' : r.severity === 'medium' ? 'Lightbulb' : 'Target'} size={16} />
                </div>
                <div><p className="font-medium text-sm">{r.title}</p><p className="text-sm text-slate-600 dark:text-slate-300">{r.text.replace(/(\d+\.\d{2})/g, (n) => fmt(Number(n)))}</p></div>
              </div>
            ))}
          </Card>
        </>}

        <MonthlyReport />

        <p className="text-xs text-slate-400 text-center mt-6 px-4">Calculated on this device from your saved data using standard formulas. Debt-to-income uses take-home pay, so it reads higher than a lender’s gross-income figure. Educational estimates, not financial advice.</p>
      </div>
    );
  }

  /* ============================================================ GOOGLE */
  function useGoogle() {
    const [st, setSt] = useState(() => GoogleWorkspace.getStatus());
    useEffect(() => GoogleWorkspace.onChange(() => setSt(GoogleWorkspace.getStatus())), []);
    useEffect(() => { const t = setInterval(() => setSt(GoogleWorkspace.getStatus()), 30000); return () => clearInterval(t); }, []);
    return st;
  }

  // Shows a Google error with the right next step: Re-authenticate, Retry, or open Settings.
  function GoogleErrorNote({ error, onRetry }) {
    const { connectGoogle, go } = useApp();
    if (!error) return null;
    const action = GoogleWorkspace.ERROR_ACTION[error.code] || 'retry';
    return (
      <div className="mt-3 rounded-xl border border-rose-200 dark:border-rose-500/30 bg-rose-50 dark:bg-rose-500/10 p-3">
        <p className="text-sm text-rose-700 dark:text-rose-300 flex gap-2"><Icon name="TriangleAlert" size={16} className="shrink-0 mt-0.5" /><span>{error.message}</span></p>
        <div className="flex gap-2 mt-2">
          {action === 'reconnect' && <Button className="!h-9 !text-sm" onClick={async () => { if (await connectGoogle(true)) onRetry && onRetry(); }}><Icon name="RefreshCw" size={15} />Re-authenticate</Button>}
          {action === 'retry' && onRetry && <Button variant="secondary" className="!h-9 !text-sm" onClick={onRetry}><Icon name="RotateCw" size={15} />Try again</Button>}
          {action === 'setup' && <Button variant="secondary" className="!h-9 !text-sm" onClick={() => go('settings')}>Open Settings</Button>}
        </div>
      </div>
    );
  }

  const GSTATUS = {
    connected: { dot: 'bg-emerald-500', text: 'Connected' }, expired: { dot: 'bg-amber-500', text: 'Session expired' },
    connecting: { dot: 'bg-sky-500 animate-pulse', text: 'Connecting…' }, disconnected: { dot: 'bg-slate-400', text: 'Not connected' },
    'not-configured': { dot: 'bg-slate-300 dark:bg-slate-600', text: 'Set up required' },
  };

  function GoogleStatusPill({ st }) {
    const g = GSTATUS[st.status] || GSTATUS.disconnected;
    return <span className="inline-flex items-center gap-1.5 text-xs font-semibold px-2 py-1 rounded-full bg-slate-100 dark:bg-slate-800"><i className={cls('w-2 h-2 rounded-full inline-block', g.dot)} />{g.text}</span>;
  }

  function GoogleSettings() {
    const { data, setSetting, toast, connectGoogle } = useApp();
    const st = useGoogle();
    const [clientId, setClientId] = useState(data.settings.googleClientId || '');
    const [editing, setEditing] = useState(!data.settings.googleClientId);
    const saveId = async () => {
      const id = clientId.trim();
      if (id && !/^[\w-]+\.apps\.googleusercontent\.com$/.test(id)) return toast('That doesn’t look like a Client ID (…apps.googleusercontent.com)', 'error');
      await setSetting('googleClientId', id); setEditing(false); toast(id ? 'Client ID saved' : 'Client ID removed');
    };
    const scope = (ok, label) => <span className={cls('inline-flex items-center gap-1 text-xs font-medium px-2 py-1 rounded-md', ok ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300' : 'bg-slate-100 text-slate-500 dark:bg-slate-800')}><Icon name={ok ? 'Check' : 'Minus'} size={12} />{label}</span>;
    return (
      <>
        <SectionTitle action={<GoogleStatusPill st={st} />}>Google account</SectionTitle>
        <Card className="p-4">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl grid place-items-center bg-slate-100 dark:bg-slate-800"><Icon name="Mail" size={18} /></div>
            <div className="min-w-0 flex-1">
              <p className="font-medium truncate">{st.status === 'connected' ? (st.email || 'Google account') : st.status === 'expired' ? 'Session expired' : 'Gmail & Google Drive'}</p>
              <p className="text-xs text-slate-500">{st.status === 'connected' ? `Session ends in ${st.expiresInMinutes} min` : st.status === 'expired' ? 'Re-authenticate to keep using Gmail and Drive' : 'Scan bills from Gmail and save monthly reports to Drive'}</p>
            </div>
          </div>
          {(st.status === 'connected' || st.status === 'expired') && <div className="flex flex-wrap gap-1.5 mt-3">{scope(st.scopes.gmail, 'Gmail (read-only)')}{scope(st.scopes.drive, 'Drive (app files only)')}</div>}

          {st.configured && !editing && (
            <div className="flex gap-2 mt-4">
              {st.status === 'connected' && <Button variant="secondary" className="flex-1" onClick={async () => { await GoogleWorkspace.disconnect(); toast('Google disconnected'); }}>Disconnect</Button>}
              {st.status === 'expired' && <><Button className="flex-[2]" onClick={() => connectGoogle(true)}><Icon name="RefreshCw" size={16} />Re-authenticate</Button><Button variant="secondary" className="flex-1" onClick={() => GoogleWorkspace.disconnect()}>Disconnect</Button></>}
              {(st.status === 'disconnected' || st.status === 'connecting') && <Button className="flex-1" disabled={st.status === 'connecting'} onClick={() => connectGoogle(false)}><Icon name="LogIn" size={16} />Connect Google Account</Button>}
            </div>
          )}
          {st.lastError && st.lastError.code !== 'TOKEN_EXPIRED' && st.status !== 'connected' && <p className="text-xs text-rose-600 dark:text-rose-400 mt-2">{st.lastError.message}</p>}

          {editing ? (
            <div className="mt-4 space-y-3">
              <Field label="OAuth Client ID" hint="Not secret: it only identifies your app to Google. No client secret is used.">
                <Input value={clientId} onChange={(e) => setClientId(e.target.value)} placeholder="123456789-abc.apps.googleusercontent.com" autoComplete="off" spellCheck={false} />
              </Field>
              <div className="flex gap-2"><Button className="flex-1" onClick={saveId}>Save Client ID</Button>{data.settings.googleClientId && <Button variant="secondary" onClick={() => { setClientId(data.settings.googleClientId); setEditing(false); }}>Cancel</Button>}</div>
              <details className="text-sm text-slate-600 dark:text-slate-300 rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3" open={!data.settings.googleClientId}>
                <summary className="font-semibold cursor-pointer">How to get a Client ID (5 minutes, free)</summary>
                <ol className="list-decimal pl-5 mt-2 space-y-1.5">
                  <li>Open <a className="text-brand-700 dark:text-brand-400 underline" href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener noreferrer">Google Cloud Console → Credentials</a> and create a project.</li>
                  <li>Under <b>APIs &amp; Services → Library</b>, enable the <b>Gmail API</b> and <b>Google Drive API</b>.</li>
                  <li>Under <b>OAuth consent screen</b>, choose <b>External</b>, keep it in <b>Testing</b>, and add your Gmail address as a <b>test user</b>.</li>
                  <li>Under <b>Credentials → Create credentials → OAuth client ID</b>, choose <b>Web application</b> and add <code className="text-xs bg-white dark:bg-slate-900 px-1 rounded">{location.origin}</code> to <b>Authorized JavaScript origins</b>.</li>
                  <li>Copy the Client ID here.</li>
                </ol>
              </details>
            </div>
          ) : (
            <button className="text-xs font-semibold text-brand-700 dark:text-brand-400 mt-3" onClick={() => setEditing(true)}>Change Client ID</button>
          )}
          <p className="text-xs text-slate-500 mt-3">The sign-in token stays in this tab’s session storage and expires after about an hour. Emails are read inside your browser; the only server contacted is Google’s.</p>
        </Card>
      </>
    );
  }

  /* ----- Gmail bill scanner (Upload screen) ----- */
  const EMAIL_KIND = {
    bill: { label: 'Bill', cls: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300' },
    'card-statement': { label: 'Card bill', cls: 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300' },
    statement: { label: 'Statement', cls: 'bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300' },
    paid: { label: 'Paid', cls: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300' },
    other: { label: 'Email', cls: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300' },
  };

  function GmailSync({ onImportFile }) {
    const { data, save, setSetting, toast, fmt, connectGoogle, go } = useApp();
    const st = useGoogle();
    const [days, setDays] = useState('30');
    const [busy, setBusy] = useState(false);
    const [progress, setProgress] = useState(null);
    const [items, setItems] = useState(null);
    const [error, setError] = useState(null);
    const [showHandled, setShowHandled] = useState(false);
    const handled = data.settings.gmailHandled || {};

    const scan = async () => {
      setError(null); setBusy(true); setProgress(null);
      try {
        const live = GoogleWorkspace.getStatus().status; // fresh, not the value captured at render time

  /* ----- Monthly report + Google Drive (Advisor screen) ----- */
  function parseCsvSimple(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter((r) => r.some((v) => v !== ''));
  }
  // Small Markdown renderer for the reports this app writes: headings, tables, lists, **bold**, _italic_.
  function inlineMd(s) { return s.split(/(\*\*[^*]+\*\*|_[^_]+_)/g).map((p, i) => p.startsWith('**') ? <b key={i}>{p.slice(2, -2)}</b> : /^_[^_]+_$/.test(p) ? <i key={i}>{p.slice(1, -1)}</i> : p); }
  function MarkdownView({ text }) {
    const lines = String(text).split('\n'); const out = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^\|/.test(l)) {
        const block = []; while (i < lines.length && /^\|/.test(lines[i])) block.push(lines[i++]); i--;
        const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const [head, sep, ...body] = block; const right = cells(sep || '').map((c) => /:$/.test(c));
        out.push(<div key={i} className="overflow-x-auto my-3"><table className="w-full text-sm"><thead><tr>{cells(head).map((c, j) => <th key={j} className={cls('py-1.5 px-2 border-b border-slate-200 dark:border-slate-700 font-semibold', right[j] ? 'text-right' : 'text-left')}>{inlineMd(c)}</th>)}</tr></thead>
          <tbody>{body.map((r, k) => <tr key={k} className="border-b border-slate-100 dark:border-slate-800">{cells(r).map((c, j) => <td key={j} className={cls('py-1.5 px-2 num', right[j] ? 'text-right' : 'text-left')}>{inlineMd(c)}</td>)}</tr>)}</tbody></table></div>);
      } else if (/^# /.test(l)) out.push(<h2 key={i} className="text-xl font-bold mt-1">{inlineMd(l.slice(2))}</h2>);
      else if (/^## /.test(l)) out.push(<h3 key={i} className="text-base font-bold mt-5">{inlineMd(l.slice(3))}</h3>);
      else if (/^- /.test(l)) out.push(<li key={i} className="ml-5 list-disc text-sm">{inlineMd(l.slice(2))}</li>);
      else if (l.trim()) out.push(<p key={i} className="text-sm text-slate-600 dark:text-slate-300 mt-2">{inlineMd(l)}</p>);
    }
    return <div>{out}</div>;
  }
  function ReportView({ name, text }) {
    if (/\.csv$/i.test(name)) {
      const rows = parseCsvSimple(text);
      return <div className="overflow-x-auto"><table className="w-full text-xs"><tbody>{rows.map((r, i) => <tr key={i} className={cls('border-b border-slate-100 dark:border-slate-800', i === 0 && 'font-semibold')}>{r.map((c, j) => <td key={j} className={cls('py-1.5 px-2 align-top', j === 3 && 'text-right num')}>{c}</td>)}</tr>)}</tbody></table></div>;
    }
    return <MarkdownView text={text} />;
  }

            <Button variant="secondary" onClick={() => download(name, build(), format === 'csv' ? 'text/csv' : 'text/markdown')}><Icon name="Download" size={16} />Download</Button>

          <Button className="w-full mt-2" disabled={busy || !st.configured} onClick={saveToDrive}><Icon name={busy ? 'Hourglass' : 'CloudUpload'} size={16} />{busy ? 'Saving…' : 'Save Monthly Report to Drive'}</Button>

          </Row>
          {installPrompt && <Row icon="Smartphone" label="Install app" sub="Add to home screen for offline use" onClick={install}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>}
          <Row icon="Sparkles" label="Load sample data" sub="Adds demo records (merge)" onClick={loadSample}><Icon name="ChevronRight" size={18} className="text-slate-400" /></Row>
          <Row icon="Trash2" label="Erase all data" danger onClick={wipe} />
        </Card>
        <p className="text-center text-xs text-slate-400 mt-6">Centric Wealth · offline-first · v1.0.0</p>
      </div>
    );
  }

  /* ========================================================== sample data */
  function buildSample() {
    const now = new Date(); const mk = (offset, day) => toISO(new Date(now.getFullYear(), now.getMonth() - offset, Math.min(day, now.getDate() + (offset ? 31 : 0))));
    const tx = [];
    for (let m = 2; m >= 0; m--) {
      tx.push({ type: 'income', amount: 3200, category: 'Salary', date: mk(m, 1), description: 'Payroll deposit' });
      tx.push({ type: 'income', amount: 3200, category: 'Salary', date: mk(m, 15), description: 'Payroll deposit' });
      tx.push({ type: 'expense', amount: 1650, category: 'Housing', date: mk(m, 1), description: 'Rent' });
      tx.push({ type: 'expense', amount: 128.4 + m * 7, category: 'Utilities', date: mk(m, 6), description: 'Electric company' });
      [3, 9, 14, 20].forEach((d, i) => tx.push({ type: 'expense', amount: 62 + i * 18 + m * 4, category: 'Groceries', date: mk(m, d), description: 'Neighborhood market' }));
      [5, 12, 18].forEach((d, i) => tx.push({ type: 'expense', amount: 24 + i * 11, category: 'Dining', date: mk(m, d), description: 'Corner cafe' }));
      tx.push({ type: 'expense', amount: 48.2, category: 'Transport', date: mk(m, 8), description: 'Fuel station' });
      tx.push({ type: 'expense', amount: 15.99, category: 'Subscriptions', date: mk(m, 11), description: 'Streaming service' });
      tx.push({ type: 'expense', amount: m === 0 ? 12.99 : 9.99, category: 'Subscriptions', date: mk(m, 4), description: 'Fitness app membership' });
      tx.push({ type: 'expense', amount: 6.99, category: 'Subscriptions', date: mk(m, 9), description: 'Cloud photo storage' });
    }
    // Spending on the card, income and bills through checking, one card payment a month (a transfer on both sides).
    const ON_CARD = new Set(['Groceries', 'Dining', 'Transport', 'Subscriptions']);
    tx.forEach((t) => Object.assign(t, ON_CARD.has(t.category) ? { accountType: 'credit', accountName: 'Visa Card' } : { accountType: 'bank', accountName: 'Checking' }, { direction: t.type === 'income' ? 'in' : 'out' }));
    for (let m = 2; m >= 1; m--) {
      tx.push({ type: 'transfer', direction: 'out', amount: 640, category: 'Card Payment', date: mk(m, 25), description: 'Payment to Visa Card', accountType: 'bank', accountName: 'Checking' });
      tx.push({ type: 'transfer', direction: 'in', amount: 640, category: 'Card Payment', date: mk(m, 25), description: 'Payment - thank you', accountType: 'credit', accountName: 'Visa Card' });
    }
    tx.forEach((t) => (t.hash = hashTx(t), t.source = 'sample'));
    const today = toISO(now);
    return {
      transactions: tx,
      accounts: [
        { name: 'Checking', type: 'Checking', kind: 'bank', balance: 4210.55, ledger: true, anchorBalance: 4210.55, anchorDate: today, balanceSource: 'manual' },
        { name: 'High-yield savings', type: 'Savings', kind: 'bank', balance: 12500 },
        { name: 'Retirement', type: 'Retirement', balance: 28400 },
      ],
      debts: [
        { name: 'Visa Card', type: 'Credit Card', kind: 'credit', balance: 3840, apr: 24.99, minPayment: 95, ledger: true, anchorBalance: 3840, anchorDate: today, balanceSource: 'manual' },
        { name: 'Auto loan', type: 'Auto Loan', balance: 11200, apr: 6.4, minPayment: 310 },
        { name: 'Student loan', type: 'Student Loan', balance: 18750, apr: 4.99, minPayment: 210 },
      ],
      bills: [
        { name: 'Rent', amount: 1650, dueDay: 1, frequency: 'monthly', category: 'Housing', isSubscription: false, active: true },
        { name: 'Electric', amount: 135, dueDay: 6, frequency: 'monthly', category: 'Utilities', isSubscription: false, active: true },
        { name: 'Streaming service', amount: 15.99, dueDay: 11, frequency: 'monthly', category: 'Subscriptions', isSubscription: true, active: true },
        { name: 'Music streaming', amount: 10.99, dueDay: now.getDate() + 2 > 28 ? 2 : now.getDate() + 2, frequency: 'monthly', category: 'Subscriptions', isSubscription: true, active: true },
        { name: 'Cloud storage', amount: 29.99, dueDay: 14, dueMonth: 3, frequency: 'yearly', category: 'Subscriptions', isSubscription: true, active: true },
      ],
      budgets: [{ category: 'Groceries', limit: 450 }, { category: 'Dining', limit: 150 }, { category: 'Transport', limit: 120 }, { category: 'Utilities', limit: 160 }, { category: 'Shopping', limit: 200 }],
    };
  }

  /* ================================================================= APP */
  const TABS = [
    { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
    { id: 'transactions', label: 'Activity', aria: 'Transactions', icon: 'ArrowLeftRight' },
    { id: 'upload', label: 'Upload', icon: 'Upload' },
    { id: 'budget', label: 'Budget', aria: 'Budget & Debt', icon: 'PiggyBank' },
    { id: 'advisor', label: 'Advisor', aria: 'Budget & Health Advisor', icon: 'HeartPulse' },
    { id: 'settings', label: 'Settings', icon: 'Settings' },
  ];

  function App() {
    const store = useFinanceData();
    const { data, ready, error } = store;
    const [tab, setTab] = useState(() => (location.hash.slice(1).split('/')[0]) || 'dashboard');
    const [sub, setSub] = useState(() => location.hash.split('/')[1] || 'budget');
    const [toastState, setToastState] = useState(null);
    const [installPrompt, setInstallPrompt] = useState(null);
    const [online, setOnline] = useState(navigator.onLine);
    const toastTimer = useRef();

    const toast = useCallback((msg, kind = 'ok') => { setToastState({ msg, kind }); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastState(null), 2400); }, []);
    const go = useCallback((t, s) => { setTab(t); if (s) setSub(s); window.scrollTo(0, 0); }, []);

    useEffect(() => { history.replaceState(null, '', `#${tab}${tab === 'budget' ? '/' + sub : ''}`); }, [tab, sub]);
    useEffect(() => { const h = () => { const [t, s] = location.hash.slice(1).split('/'); if (t) setTab(t); if (s) setSub(s); }; addEventListener('hashchange', h); return () => removeEventListener('hashchange', h); }, []);
    useEffect(() => {
      const bip = (e) => { e.preventDefault(); setInstallPrompt(e); };
      const on = () => setOnline(true), off = () => setOnline(false);
      addEventListener('beforeinstallprompt', bip); addEventListener('online', on); addEventListener('offline', off);
      return () => { removeEventListener('beforeinstallprompt', bip); removeEventListener('online', on); removeEventListener('offline', off); };
    }, []);

    // Theme
    useEffect(() => {
      const mq = matchMedia('(prefers-color-scheme: dark)');
      const apply = () => { const t = data.settings.theme || 'system'; document.documentElement.classList.toggle('dark', t === 'dark' || (t === 'system' && mq.matches)); };
      apply(); mq.addEventListener('change', apply); return () => mq.removeEventListener('change', apply);
    }, [data.settings.theme]);

    // Imported ("ledger") accounts: balance = anchor + newer tagged transactions. Recalculated when data changes.
    useEffect(() => {
      if (!ready) return;
      (async () => {
        let changed = false;
        for (const [storeName, list, kind] of [['accounts', data.accounts, 'bank'], ['debts', data.debts, 'credit']]) {
          for (const a of list) {
            if (!a.ledger) continue;
            const b = ledgerBalance(a, kind, data.transactions);
            if (Math.abs(b - (Number(a.balance) || 0)) > 0.004) { await DB.put(storeName, { ...a, balance: b }); changed = true; }
          }
        }
        if (changed) store.reload(['accounts', 'debts']);
      })().catch((e) => console.warn('Balance update failed', e));
    }, [ready, data.transactions, data.accounts, data.debts]);

    // Recurring subscriptions & bills: detected locally from saved transactions (recurring-scanner.js)
    const decisionsJSON = JSON.stringify(data.settings.recurringDecisions || {});
    const recurring = useMemo(() => (window.RecurringScanner
      ? RecurringScanner.analyze(data.transactions, { bills: data.bills, decisions: JSON.parse(decisionsJSON) })
      : null), [data.transactions, data.bills, decisionsJSON]);

    // Imported charges mark linked bills as paid (and follow subscription price changes).
    useEffect(() => {
      if (!ready || !recurring) return;
      RecurringScanner.reconcile(recurring.items, data.bills).then((n) => n && store.reload('bills')).catch(() => {});
    }, [ready, recurring]);

    // Reminders: rebuild the schedule, show anything due, arm timers; again whenever the app returns to the foreground.
    useEffect(() => {
      if (!ready || !recurring) return;
      const run = () => RecurringScanner.notifications.sync({ items: recurring.items, bills: data.bills, leadDays: data.settings.reminderDays ?? 3, enabled: !!data.settings.notify }).catch((e) => console.warn('Reminder sync failed', e));
      run();
      const vis = () => document.visibilityState === 'visible' && run();
      document.addEventListener('visibilitychange', vis); return () => document.removeEventListener('visibilitychange', vis);
    }, [ready, recurring, data.settings.notify, data.settings.reminderDays]);

    const currency = data.settings.currency || 'USD';
    const fmt = useMemo(() => {
      const full = new Intl.NumberFormat(undefined, { style: 'currency', currency });
      const compact = new Intl.NumberFormat(undefined, { style: 'currency', currency, notation: 'compact', maximumFractionDigits: 1 });
      return (n, short) => (short && Math.abs(n) >= 10000 ? compact : full).format(Number(n) || 0);
    }, [currency]);

    const loadSample = useCallback(async () => {
      const s = buildSample();
      for (const [name, rows] of Object.entries(s)) await DB.bulkPut(name, rows);
      await store.reload(); toast('Sample data loaded');
    }, [store, toast]);
    const install = async () => { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice; setInstallPrompt(null); };

    const recurringAction = useCallback(async (action, item) => {
      try {
        await RecurringScanner[action](item);
        await store.reload(['bills', 'settings']);
        toast(action === 'keep' ? `Keeping ${item.merchant}` : action === 'cancel' ? `${item.merchant} marked as cancelled` : 'Choice undone');
      } catch (e) { toast(e.message, 'error'); }
    }, [store, toast]);

    useEffect(() => { if (ready && window.GoogleWorkspace) GoogleWorkspace.configure({ clientId: data.settings.googleClientId || '' }); }, [ready, data.settings.googleClientId]);
    // Must be called straight from a click: Google's consent popup is blocked otherwise.
    const connectGoogle = useCallback(async (reauth) => {
      try { const r = await GoogleWorkspace.connect({ reauth: !!reauth }); toast(r.scopes.gmail && r.scopes.drive ? `Connected${r.email ? ` as ${r.email}` : ''}` : 'Connected, but some permissions were not granted', r.scopes.gmail && r.scopes.drive ? 'ok' : 'error'); return true; }
      catch (e) { toast(e.message, 'error'); return false; }
    }, [toast]);

    const ctx = { ...store, fmt, toast, go, loadSample, installPrompt, install, recurring, recurringAction, connectGoogle };

    if (!ready) return <div id="boot">Opening Centric Wealth…</div>;
    if (error) return <div className="p-6"><Card className="p-4"><p className="font-semibold text-rose-600">Storage unavailable</p><p className="text-sm text-slate-500 mt-1">{error}. Private-browsing modes in some browsers block IndexedDB.</p></Card></div>;

    return (
      <AppCtx.Provider value={ctx}>
        <div className="min-h-full max-w-lg mx-auto">
          {!online && <div className="pt-safe bg-slate-800 text-white text-xs text-center py-1.5">Offline — everything still works</div>}
          <main className="px-4 pt-safe pb-28">
            <div className="pt-3">
              {tab === 'dashboard' && <Dashboard go={go} />}
              {tab === 'transactions' && <Transactions />}
              {tab === 'upload' && <UploadView />}
              {tab === 'budget' && <BudgetDebt sub={sub} setSub={setSub} />}
              {tab === 'advisor' && <AdvisorView />}
              {tab === 'settings' && <SettingsView />}
            </div>
          </main>

          <nav className="fixed bottom-0 inset-x-0 z-40 border-t border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-950/90 backdrop-blur-lg pb-safe" aria-label="Main">
            <div className="max-w-lg mx-auto grid grid-cols-6">
              {TABS.map((t) => {
                const active = tab === t.id;
                return (
                  <button key={t.id} onClick={() => go(t.id)} aria-label={t.aria || t.label} aria-current={active ? 'page' : undefined}
                    className={cls('flex flex-col items-center justify-center gap-1 h-16 text-[10px] min-[380px]:text-[11px] font-medium transition-colors min-w-0', active ? 'text-brand-600 dark:text-brand-400' : 'text-slate-500 dark:text-slate-400')}>
                    <span className={cls('grid place-items-center w-11 h-7 rounded-full transition-colors', active && 'bg-brand-100 dark:bg-brand-500/15')}><Icon name={t.icon} size={20} strokeWidth={active ? 2.4 : 2} /></span>
                    <span className="max-w-full truncate px-0.5">{t.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
          <Toast toast={toastState} />
        </div>
      </AppCtx.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  // Service worker for offline support (requires HTTPS or localhost — GitHub Pages is HTTPS).
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed', e)));
  }
  </script>
</body>
</html>
