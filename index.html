  function UploadView() {
    const { data, toast, reload, fmt, go } = useApp();
    const [kind, setKind] = useState('bank');
    const [name, setName] = useState('');
    const [subtype, setSubtype] = useState('Checking');
    const [job, setJob] = useState(null);       // { file, report } | { file, error }
    const [password, setPassword] = useState('');
    const [balance, setBalance] = useState('');
    const [busy, setBusy] = useState(false);
    const [result, setResult] = useState(null);
    const [batch, setBatch] = useState(null);       // several statements: [{ id, file, kind, accountName, subtype, status, report, error, password, custom, open, result }]
    const [batchDone, setBatchDone] = useState(null);
    const fileRef = useRef();

    const existing = kind === 'bank' ? data.accounts.filter(isBankAccount) : data.debts.filter(isCardDebt);
    const accountName = name.trim() || (kind === 'bank' ? subtype : 'Credit Card');
    const known = existing.find((a) => sameName(a.name, accountName));

    const parse = async (file, pw) => {
      setBusy(true); setResult(null);
      try {
        const report = await StatementParser.parseStatementDetailed(file, { persist: false, accountType: kind, accountName, password: pw || undefined, customRules: data.settings.categoryRules || [] });
        setJob({ file, report });
        setBalance(report.meta.endingBalance != null ? String(report.meta.endingBalance) : '');
      } catch (e) { setJob({ file, error: e }); }
      setBusy(false);
    };
    // Signs depend on the statement type, so re-read the file if the user switches type.
    useEffect(() => { if (job && job.report) parse(job.file, password); }, [kind]);

    // ---- several statements at once
    const customRules = data.settings.categoryRules || [];
    const updateItem = (id, patch) => setBatch((b) => b && b.map((it) => (it.id === id ? { ...it, ...(typeof patch === 'function' ? patch(it) : patch) } : it)));
    const handleFiles = (list) => {
      const files = Array.from(list || []);
      if (!files.length) return;
      if (files.length === 1 && !batch) return handleFile(files[0]);
      const fresh = !batch || !!batchDone; // after a finished import, start a new list
      setJob(null); setResult(null); setBatchDone(null);
      if (fresh) setTimeout(() => { const el = document.querySelector('[data-testid=batch-list]'); el && el.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' }); }, 120);
      setBatch((old) => {
        const prev = fresh ? null : old;
        const have = new Set((prev || []).map((it) => it.file.name + '|' + it.file.size));
        const add = files.filter((f) => !have.has(f.name + '|' + f.size)).map((file) => {
          const backup = file.name.toLowerCase().endsWith('.json');
          return { id: ++batchSeq, file, kind, accountName, subtype, status: backup ? 'error' : 'queued', error: backup ? { message: 'This is a Centric Wealth backup. Restore it on its own, not together with statements.' } : null, password: '' };
        });
        return [...(prev || []), ...add];
      });
    };
    // Read queued files one at a time (PDF reading is memory-hungry on phones).
    useEffect(() => {
      if (!batch || batch.some((it) => it.status === 'reading')) return;
      const next = batch.find((it) => it.status === 'queued');
      if (!next) return;
      updateItem(next.id, { status: 'reading', error: null });
      StatementParser.parseStatementDetailed(next.file, { persist: false, accountType: next.kind, accountName: next.accountName, password: next.password || undefined, customRules })
        .then((report) => updateItem(next.id, (it) => (it.kind === next.kind ? { status: 'ready', report } : { status: 'queued' })))
        .catch((e) => updateItem(next.id, { status: e.code === 'PDF_PASSWORD' ? 'password' : 'error', error: e }));
    }, [batch]);
    // Steps 1-2 set the account for every file you haven't changed individually.
    useEffect(() => {
      setBatch((b) => b && b.map((it) => (it.custom || ['done', 'importing'].includes(it.status) ? it
        : { ...it, accountName, subtype, ...(it.kind !== kind && it.status !== 'error' ? { kind, status: 'queued', report: null } : {}) })));
    }, [kind, accountName, subtype]);
    const setItemKind = (it, k) => { if (it.kind !== k) updateItem(it.id, { kind: k, custom: true, accountName: k === kind ? accountName : '', status: 'queued', report: null, error: null }); };

    // New vs already-imported per file, counting overlaps with DB and with earlier files in this batch.
    const batchView = useMemo(() => {
      if (!batch) return null;
      const haveBy = new Map();
      const haveFor = (name) => {
        const k = String(name).trim().toLowerCase();
        if (!haveBy.has(k)) { const m = new Map(); data.transactions.filter((t) => sameName(t.accountName, name)).forEach((t) => { const b = String(t.hash || '').split('#')[0]; m.set(b, (m.get(b) || 0) + 1); }); haveBy.set(k, m); }
        return haveBy.get(k);
      };
      const info = {};
      const ready = batch.filter((it) => it.status === 'ready' && it.report && String(it.accountName).trim());
      for (const it of [...ready].sort((a, b) => statementEnd(a.report).localeCompare(statementEnd(b.report)))) {
        const have = haveFor(it.accountName), seen = new Map(); let fresh = 0, dup = 0, unc = 0;
        for (const t of it.report.transactions) {
          const b = StatementParser.hashTx(t.date, Math.abs(t.amount), t.description), n = (seen.get(b) || 0) + 1; seen.set(b, n);
          if (n <= (have.get(b) || 0)) dup++; else { fresh++; if (StatementParser.classify(t, it.kind).category === 'Uncategorized') unc++; }
        }
        for (const [b, n] of seen) have.set(b, Math.max(have.get(b) || 0, n));
        info[it.id] = { fresh, dup, unc };
      }
      const totalFresh = Object.values(info).reduce((s, x) => s + x.fresh, 0);
      return { info, totalFresh, ready: ready.length, reading: batch.some((it) => it.status === 'queued' || it.status === 'reading'), unnamed: batch.some((it) => it.status === 'ready' && !String(it.accountName).trim()) };
    }, [batch, data.transactions]);

    const importAll = async () => {
      setBusy(true);
      const todo = batch.filter((it) => it.status === 'ready' && batchView.info[it.id]).sort((a, b) => statementEnd(a.report).localeCompare(statementEnd(b.report)));
      const done = []; let failed = 0;
      for (const it of todo) {
        if (!batchView.info[it.id].fresh) { updateItem(it.id, { status: 'done', result: { inserted: 0, skippedDuplicates: batchView.info[it.id].dup, accountName: it.accountName } }); continue; }
        updateItem(it.id, { status: 'importing' });
        try {
          const r = await importStatement({ report: it.report, file: it.file, kind: it.kind, accountName: it.accountName.trim(), subtype: it.subtype, balanceText: null });
          updateItem(it.id, { status: 'done', result: r }); done.push(r);
        } catch (e) { failed++; updateItem(it.id, { status: 'error', error: e }); }
      }
      await reload();
      const inserted = done.reduce((s, r) => s + r.inserted, 0);
      const accts = [...new Set(done.map((r) => r.accountName))];
      setBatchDone({ inserted, files: done.length, accounts: accts, failed, needsApr: [...new Set(done.filter((r) => r.needsApr).map((r) => r.accountName))] });
      toast(`Imported ${inserted} from ${done.length} statement${done.length === 1 ? '' : 's'}`);
      setBusy(false);
    };

    const handleFile = async (file) => {
      if (!file) return;
      if (file.name.toLowerCase().endsWith('.json')) {
        try {
          const json = JSON.parse(await file.text());
          const replace = confirm('Restore backup?\n\nOK = replace all current data\nCancel = merge into current data');
          const n = await DB.importAll(json, { replace });
          await reload(); toast(`Restored ${n} records`);
        } catch (e) { toast(e.message, 'error'); }
        return;
      }
      setPassword(''); parse(file);
    };

    // Preview: how each row will be stored, and which are already imported into this account.
    const preview = useMemo(() => {
      if (!job || !job.report) return null;
      const have = new Map();
      data.transactions.filter((t) => sameName(t.accountName, accountName)).forEach((t) => { const b = String(t.hash || '').split('#')[0]; have.set(b, (have.get(b) || 0) + 1); });
      const seen = new Map();
      const rows = job.report.transactions.map((t) => {
        const b = StatementParser.hashTx(t.date, Math.abs(t.amount), t.description); const n = (seen.get(b) || 0) + 1; seen.set(b, n);
        return { ...t, ...StatementParser.classify(t, kind), direction: t.amount < 0 ? 'out' : 'in', amount: Math.abs(t.amount), accountType: kind, accountName, dup: n <= (have.get(b) || 0) };
      });
      const fresh = rows.filter((r) => !r.dup);
      const tally = (f) => { const l = fresh.filter(f); return { n: l.length, total: l.reduce((s, r) => s + r.amount, 0) }; };
      return {
        rows, fresh,
        a: kind === 'bank' ? { label: 'Deposits (income)', ...tally((r) => r.type === 'income'), tone: 'text-emerald-600 dark:text-emerald-400' } : { label: 'Purchases & charges', ...tally((r) => r.type === 'expense'), tone: 'text-violet-700 dark:text-violet-300' },
        b: kind === 'bank' ? { label: 'Withdrawals (expenses)', ...tally((r) => r.type === 'expense'), tone: '' } : { label: 'Payments & credits', ...tally((r) => r.type === 'transfer'), tone: 'text-emerald-600 dark:text-emerald-400' },
        c: kind === 'bank' ? { label: 'Transfers & card payments', ...tally((r) => r.type === 'transfer') } : null,
      };
    }, [job, kind, accountName, data.transactions]);

    const doImport = async () => {
      if (!preview) return;
      setBusy(true);
      try {
        const { report, file } = job;
        const saved = await importStatement({ report, file, kind, accountName, subtype, balanceText: balance });
        await reload();
        setResult(saved);
        setJob(null); setBalance('');
        toast(`Imported ${saved.inserted} into ${accountName}`);
      } catch (e) { toast(e.message, 'error'); }
      setBusy(false);
    };

    const info = KIND_INFO[kind];
    const err = job && job.error;

    return (
      <div>
        <header className="pt-2">
          <h1 className="text-[28px] leading-9 font-extrabold tracking-tight">Upload</h1>
          <p className="text-sm text-slate-500 mt-1">PDF or CSV statements, read on this device and never uploaded anywhere.</p>
        </header>

        <SectionTitle>1 · Statement type</SectionTitle>
        <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Statement type">
          {['bank', 'credit'].map((k) => {
            const sel = kind === k, ki = KIND_INFO[k];
            return (
              <button key={k} role="radio" aria-checked={sel} onClick={() => { setKind(k); setName(''); }}
                className={cls('press rounded-[20px] border-2 p-3.5 text-left transition-all duration-300 ease-in-out', sel ? (k === 'bank' ? 'border-sky-500 bg-sky-50 dark:bg-sky-500/10' : 'border-violet-500 bg-violet-50 dark:bg-violet-500/10') : 'border-transparent card')}>
                <div className={cls('w-9 h-9 rounded-xl grid place-items-center mb-2', k === 'bank' ? 'bg-sky-100 text-sky-700 dark:bg-sky-500/20 dark:text-sky-300' : 'bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300')}><Icon name={ki.icon} size={18} /></div>
                <p className="font-semibold leading-tight">{ki.title}</p>
                <p className="text-xs text-slate-500 mt-0.5">{ki.sub}</p>
              </button>
            );
          })}
        </div>
        <p className="text-xs text-slate-500 mt-2 px-1">{info.how}</p>

        <SectionTitle>2 · Account</SectionTitle>
        <Card className="p-4 space-y-3">
          <Field label="Account label (optional)" hint={known ? `Adds to your existing “${known.name}” account.` : `Creates a new ${kind === 'bank' ? 'bank account' : 'credit card'} called “${accountName}”.`}>
            <Input value={name} onChange={(e) => setName(e.target.value)} placeholder={info.placeholder} list={`acct-${kind}`} autoComplete="off" />
            <datalist id={`acct-${kind}`}>{existing.map((a) => <option key={a.id} value={a.name} />)}</datalist>
          </Field>
          {existing.length > 0 && <div className="flex flex-wrap gap-1.5">{existing.map((a) => (
            <button key={a.id} onClick={() => setName(a.name)} className={cls('press text-xs font-medium px-2.5 py-1 rounded-full border', sameName(a.name, accountName) ? 'border-brand-500 text-brand-700 dark:text-brand-400 bg-brand-50 dark:bg-brand-500/10' : 'border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300')}>{a.name}</button>
          ))}</div>}
          {kind === 'bank' && !known && <Field label="Account type"><Select options={['Checking', 'Savings']} value={subtype} onChange={(e) => setSubtype(e.target.value)} /></Field>}
        </Card>

        <SectionTitle>3 · Files</SectionTitle>
        <input ref={fileRef} type="file" multiple accept=".pdf,.csv,.tsv,.txt,.json,application/pdf,text/csv,application/json" className="hidden" onChange={(e) => { handleFiles(e.target.files); e.target.value = ''; }} />
        <button onClick={() => fileRef.current.click()} disabled={busy}
          onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}
          className="press w-full rounded-[24px] border-2 border-dashed border-brand-500/35 bg-white/60 dark:bg-white/[.03] p-7 text-center active:bg-brand-500/5">
          <div className="mx-auto w-12 h-12 rounded-2xl grid place-items-center bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-400"><Icon name={busy ? 'Hourglass' : 'FileSpreadsheet'} size={24} /></div>
          <p className="font-semibold mt-3">{busy ? 'Reading statement…' : batch ? 'Add more statements' : job ? job.file.name : `Choose ${kind === 'bank' ? 'bank' : 'credit card'} statements`}</p>
          <p className="text-xs text-slate-500 mt-1">One or several PDF / CSV files · or a Centric Wealth backup (.json)</p>
        </button>

        {err && (
          <Card className="mt-3 p-4 border-rose-200 dark:border-rose-500/30">
            <p className="font-semibold text-rose-600 dark:text-rose-400 flex items-center gap-2"><Icon name="TriangleAlert" size={16} />Couldn’t read this file</p>
            <p className="text-sm text-slate-600 dark:text-slate-300 mt-1">{err.message}</p>
            {err.code === 'PDF_PASSWORD' && (
              <form className="flex gap-2 mt-3" onSubmit={(e) => { e.preventDefault(); parse(job.file, password); }}>
                <input className={inputCls} type="password" placeholder="PDF password" value={password} onChange={(e) => setPassword(e.target.value)} autoFocus />
                <Button type="submit">Open</Button>
              </form>
            )}
          </Card>
        )}

        {preview && (
          <>
            <SectionTitle>Preview · {accountName}</SectionTitle>
            <Card className="p-4">
              <div className={cls('grid gap-2', preview.c ? 'grid-cols-3' : 'grid-cols-2')}>
                {[preview.a, preview.b, preview.c].filter(Boolean).map((x) => (
                  <div key={x.label} className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-2.5"><p className="text-[11px] leading-tight text-slate-500">{x.label}</p><p className={cls('num font-bold mt-1', x.tone)}>{fmt(x.total, true)}</p><p className="text-[11px] text-slate-500">{x.n} item{x.n === 1 ? '' : 's'}</p></div>
                ))}
              </div>
              <div className="mt-4">
                <Field label={kind === 'bank' ? 'Ending balance' : 'Statement balance (amount owed)'}
                  hint={job.report.meta.endingBalance != null ? `Found on the statement${job.report.meta.endingBalanceDate ? ` for ${prettyDate(job.report.meta.endingBalanceDate)}` : ''}. Newer transactions are added on top.` : 'Not found on the statement. Enter it for an exact balance, or leave blank to estimate from transactions.'}>
                  <Input inputMode="decimal" placeholder="0.00" value={balance} onChange={(e) => setBalance(e.target.value)} />
                </Field>
              </div>
              {kind === 'credit' && <StatementCheck meta={job.report.meta} />}
              {(() => { const n = preview.fresh.filter((r) => r.category === 'Uncategorized').length, mine = preview.fresh.filter((r) => r.userCategory).length; return (n > 0 || mine > 0) && <p className="text-xs mt-3 flex gap-1.5 text-slate-600 dark:text-slate-300"><Icon name="Tags" size={14} className="shrink-0 mt-px text-brand-600" /><span>{mine > 0 && `${mine} sorted by your saved category rules. `}{n > 0 && `${n} couldn't be matched and will be Uncategorized. Tap one after importing to pick a category; it's remembered for next time.`}</span></p>; })()}
              <p className="text-xs text-slate-500 mt-3">{preview.fresh.length} new · {preview.rows.length - preview.fresh.length} already imported{job.report.warnings.length ? ` · ${job.report.warnings.length} row${job.report.warnings.length === 1 ? '' : 's'} skipped` : ''} · {parseISO(job.report.meta.dateRange[0]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – {parseISO(job.report.meta.dateRange[1]).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</p>
            </Card>
            <Card className="mt-3 divide-y divide-slate-900/[.05] dark:divide-white/[.06] overflow-hidden">
              {preview.rows.slice(0, 8).map((t, i) => <div key={i} className={cls(t.dup && 'opacity-40')}><TxRow t={t} /></div>)}
              {preview.rows.length > 8 && <p className="p-3 text-xs text-center text-slate-500">+ {preview.rows.length - 8} more</p>}
            </Card>
            {job.report.warnings.length > 0 && (
              <Disclosure className="mt-2 text-xs text-slate-500 px-1" summary="Skipped rows">
                <ul className="mt-1 space-y-0.5">{job.report.warnings.slice(0, 20).map((w, i) => <li key={i}>{w.row ? `Row ${w.row}: ` : w.page ? `Page ${w.page}: ` : ''}{w.message}</li>)}</ul>
              </Disclosure>
            )}
            <div className="flex gap-2 mt-4">
              <Button variant="secondary" className="flex-1" onClick={() => setJob(null)}>Cancel</Button>
              <Button className="flex-[2]" disabled={busy || !preview.fresh.length} onClick={doImport}>{preview.fresh.length ? `Import ${preview.fresh.length} into ${accountName}` : 'Nothing new to import'}</Button>
            </div>
          </>
        )}

        {batch && <BatchList batch={batch} view={batchView} done={batchDone} busy={busy} updateItem={updateItem} setItemKind={setItemKind}
          onRemove={(id) => setBatch((b) => { const n = b.filter((it) => it.id !== id); return n.length ? n : null; })}
          onClear={() => { setBatch(null); setBatchDone(null); }} onImport={importAll} />}

        {result && (
          <Card className="mt-3 p-4 bg-emerald-50 dark:bg-emerald-500/10 border-emerald-200 dark:border-emerald-500/20">
            <p className="font-semibold flex items-center gap-2"><Icon name="CircleCheck" size={18} className="text-emerald-600" />Imported {result.inserted} into {result.accountName}</p>
            {result.skippedDuplicates > 0 && <p className="text-sm text-slate-600 dark:text-slate-300 mt-1">{result.skippedDuplicates} already imported, skipped.</p>}
            {result.needsApr && <p className="text-sm text-slate-600 dark:text-slate-300 mt-2">Add this card’s APR and minimum payment so payoff plans are accurate. <button className="press font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('budget', 'debt')}>Open Debt</button></p>}
          </Card>
        )}

        {!job && !result && !batch && (
          <>
            <SectionTitle>Tips</SectionTitle>
            <Card className="p-4 text-sm text-slate-600 dark:text-slate-300 space-y-2">
              <p className="flex gap-2"><Icon name="Check" size={16} className="text-brand-600 shrink-0 mt-0.5" />Download statements from your bank’s website as PDF or CSV. Scanned (photographed) PDFs can’t be read.</p>
              <p className="flex gap-2"><Icon name="Check" size={16} className="text-brand-600 shrink-0 mt-0.5" />Pick several files at once (for example a year of monthly statements). You can check each one and change its account before importing.</p>
              <p className="flex gap-2"><Icon name="Check" size={16} className="text-brand-600 shrink-0 mt-0.5" />Importing the same statement again is safe: duplicates in that account are skipped, including overlaps between statements.</p>
              <p className="flex gap-2"><Icon name="Check" size={16} className="text-brand-600 shrink-0 mt-0.5" />Import both your bank and card statements: the card payment shows up on each, and both are stored as transfers so spending is only counted once.</p>
            </Card>
          </>
        )}
      </div>
    );
  }

  /* ======================================================== BUDGET & DEBT */
  function BudgetTab() {
    const { data, save, remove, fmt, toast } = useApp();
    const s = useSummary();
    const [edit, setEdit] = useState(null);
    const spent = Object.fromEntries(s.topCats);
    const totalLimit = data.budgets.reduce((a, b) => a + b.limit, 0);
    const totalSpent = data.budgets.reduce((a, b) => a + (spent[b.category] || 0), 0);
    const unbudgeted = EXPENSE_CATEGORIES.filter((c) => c !== 'Uncategorized' && !data.budgets.find((b) => b.category === c));

    return (
      <div>
        <Card className="p-4 mt-4">
          <div className="flex justify-between items-baseline"><p className="text-sm text-slate-500">Spent of budget · {monthLabel(s.mk, { month: 'long' })}</p><p className="num text-sm font-semibold">{totalLimit ? Math.round((totalSpent / totalLimit) * 100) : 0}%</p></div>
          <p className="num text-2xl font-extrabold tracking-tight mt-1"><AnimatedMoney value={totalSpent} /> <span className="text-base font-medium text-slate-500">/ {fmt(totalLimit)}</span></p>
          <div className="mt-3"><Progress value={totalLimit ? totalSpent / totalLimit : 0} /></div>
        </Card>
        <SectionTitle action={<button className="press text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => setEdit({ category: unbudgeted[0] || 'Other', limit: '' , isNew: true })}>+ Add</button>}>Categories</SectionTitle>
        {data.budgets.length === 0 ? <Card><Empty icon="PiggyBank" title="No budgets yet" body="Set a monthly limit per category." /></Card> :
          <Card className="divide-y divide-slate-900/[.05] dark:divide-white/[.06]">
            {[...data.budgets].sort((a, b) => (spent[b.category] || 0) / b.limit - (spent[a.category] || 0) / a.limit).map((b) => {
              const sp = spent[b.category] || 0; const left = b.limit - sp;
              return (
                <button key={b.category} className="press w-full text-left p-4" onClick={() => setEdit({ ...b, limit: String(b.limit) })}>
                  <div className="flex justify-between text-sm mb-2"><span className="font-medium">{b.category}</span><span className={cls('num', left < 0 ? 'text-rose-600 font-semibold' : 'text-slate-500')}>{left < 0 ? `${fmt(-left)} over` : `${fmt(left)} left`}</span></div>
                  <Progress value={sp / b.limit} />
                  <p className="num text-xs text-slate-500 mt-1.5">{fmt(sp)} of {fmt(b.limit)}</p>
                </button>
              );
            })}
          </Card>}
        <Sheet open={!!edit} title={edit?.isNew ? 'New budget' : 'Edit budget'} onClose={() => setEdit(null)}>
          {edit && (
            <form className="space-y-4" onSubmit={async (e) => { e.preventDefault(); const limit = round2(parseAmount(edit.limit)); if (!limit) return toast('Enter a limit', 'error'); await save('budgets', { category: edit.category, limit }); setEdit(null); toast('Budget saved'); }}>
              <Field label="Category">{edit.isNew ? <Select options={unbudgeted.length ? unbudgeted : EXPENSE_CATEGORIES} value={edit.category} onChange={(e) => setEdit({ ...edit, category: e.target.value })} /> : <Input value={edit.category} disabled />}</Field>
              <Field label="Monthly limit"><Input inputMode="decimal" value={edit.limit} onChange={(e) => setEdit({ ...edit, limit: e.target.value })} autoFocus /></Field>
              <Button type="submit" className="w-full">Save</Button>
              {!edit.isNew && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={async () => { await remove('budgets', edit.category); setEdit(null); }}>Remove budget</Button>}
            </form>
          )}
        </Sheet>
      </div>
    );
  }

  function DebtTab() {
    const { data, save, remove, fmt, toast, openCards } = useApp();
    const cardInfo = useCards();
    const [edit, setEdit] = useState(null);
    const [pay, setPay] = useState(null);
    const [extra, setExtra] = useState(() => String(data.settings.debtExtra ?? 100));
    const [strategy, setStrategy] = useState(data.settings.debtStrategy || 'avalanche');
    const total = data.debts.reduce((s, d) => s + Number(d.balance), 0);

    const plan = useMemo(() => simulatePayoff(data.debts, parseAmount(extra) || 0, strategy), [data.debts, extra, strategy]);
    const base = useMemo(() => simulatePayoff(data.debts, 0, strategy), [data.debts, strategy]);
    const freeDate = plan.months ? addMonths(monthKey(todayISO()), plan.months) : null;

      e.preventDefault();
      const amount = round2(parseAmount(pay.amount)); if (!amount) return;
      const d = data.debts.find((x) => x.id === pay.id);

        tx.hash = hashTx(tx); await save('transactions', tx);
      } else {
        await save('debts', { ...d, balance: round2(Math.max(0, d.balance - amount)) });
        const tx = { type: 'expense', amount, category: 'Debt Payment', date: todayISO(), description: `Payment · ${d.name}`, source: 'debt', debtId: d.id };
        tx.hash = hashTx(tx); await save('transactions', tx);

      setPay(null); toast('Payment logged');

          <p className="num text-xs text-slate-500 mt-1">{fmt(minTotal)}/mo in minimum payments</p>

          <div className="flex-1 min-w-0"><p className="font-semibold">Manage credit cards</p><p className="text-xs text-slate-500">Add cards, limits and payment due dates</p></div>
          <Icon name="ChevronRight" size={18} className="text-slate-400" />
        </button>
        {data.debts.length === 0 ? <Card><Empty icon="CreditCard" title="No debts tracked" body="Add cards and loans to plan your payoff." /></Card> :
          <Card className="divide-y divide-slate-900/[.05] dark:divide-white/[.06]">
            {data.debts.map((d) => (
              <div key={d.id} className="flex items-center gap-3 p-3.5">
                <button className="press flex-1 min-w-0 text-left flex items-center gap-3" onClick={() => (isCardDebt(d) ? openCards({ edit: d.id }) : setEdit({ ...d, balance: String(d.balance), apr: String(d.apr), minPayment: String(d.minPayment) }))}>
                  {isCardDebt(d) ? <CardChip c={d} size="sm" /> : <div className="w-10 h-10 rounded-xl grid place-items-center bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-400"><Icon name="Landmark" size={18} /></div>}
                  <div className="min-w-0"><p className="font-medium truncate">{d.name}{d.last4 && <span className="num text-slate-400 font-medium"> ••{d.last4}</span>}</p>
                    {(() => { const ci = cardInfo.find((c) => c.id === d.id); return ci && ci.status.set && <div className="my-0.5"><DueBadge st={ci.status} /></div>; })()}<p className="num text-xs text-slate-500">{Number(d.apr) > 0 ? `${d.apr}% APR` : <span className="text-amber-600">APR not set</span>} · min {fmt(d.minPayment)}</p>{d.ledger && <p className="text-[11px] text-slate-400">{balanceNote(d)}</p>}</div>
                </button>
                <div className="text-right"><p className="num font-semibold">{fmt(d.balance)}</p><button className="press text-xs font-semibold text-brand-700 dark:text-brand-400" onClick={() => setPay({ id: d.id, name: d.name, amount: String(d.minPayment || '') })}>Log payment</button></div>
              </div>
            ))}
          </Card>}

        {data.debts.length > 0 && (
          <>
            <SectionTitle>Payoff planner</SectionTitle>
            <Card className="p-4 space-y-4">
              <Segmented value={strategy} onChange={(v) => { setStrategy(v); DB.setSetting('debtStrategy', v); }} options={[{ value: 'avalanche', label: 'Avalanche' }, { value: 'snowball', label: 'Snowball' }]} />
              <p className="text-xs text-slate-500 -mt-2">{strategy === 'avalanche' ? 'Highest interest rate first — lowest total interest.' : 'Smallest balance first — quickest early wins.'}</p>
              <Field label="Extra per month on top of minimums"><Input inputMode="decimal" value={extra} onChange={(e) => setExtra(e.target.value)} onBlur={() => DB.setSetting('debtExtra', parseAmount(extra) || 0)} /></Field>
              {plan.feasible ? (
                <div className="grid grid-cols-2 gap-3">
                  <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3"><p className="text-xs text-slate-500">Debt-free</p><p className="font-bold">{freeDate ? monthLabel(freeDate, { month: 'short', year: 'numeric' }) : '—'}</p><p className="text-xs text-slate-500">{plan.months} months</p></div>
                  <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3"><p className="text-xs text-slate-500">Total interest</p><p className="num font-bold">{fmt(plan.interest)}</p>{base.feasible && base.interest > plan.interest && <p className="num text-xs text-emerald-600">saves {fmt(base.interest - plan.interest, true)}</p>}</div>
                </div>
              ) : <p className="text-sm text-rose-600 flex gap-2"><Icon name="TriangleAlert" size={16} className="shrink-0 mt-0.5" />Payments don’t cover interest — increase the monthly amount.</p>}
              {plan.feasible && <ol className="text-sm space-y-1.5">{plan.order.map((o, i) => <li key={o.id} className="flex justify-between"><span><span className="text-slate-400 mr-2">{i + 1}.</span>{o.name}</span><span className="text-slate-500">{monthLabel(addMonths(monthKey(todayISO()), o.month), { month: 'short', year: '2-digit' })}</span></li>)}</ol>}
            </Card>
          </>

        <Sheet open={!!edit} title={edit?.id ? 'Edit debt' : 'New debt'} onClose={() => setEdit(null)}>

              <Field label="Type"><Select options={DEBT_TYPES} value={edit.type} onChange={(e) => setEdit({ ...edit, type: e.target.value })} /></Field>

                <Field label="Min/mo"><Input inputMode="decimal" value={edit.minPayment} onChange={(e) => setEdit({ ...edit, minPayment: e.target.value })} /></Field>

            </form>
          )}
        </Sheet>
        <Sheet open={!!pay} title={`Payment · ${pay?.name || ''}`} onClose={() => setPay(null)}>
          {pay && (
            <form className="space-y-4" onSubmit={submitPay}>
              <Field label="Amount" hint={data.debts.find((x) => x.id === pay.id)?.ledger ? 'Recorded as a card payment (balance adjustment), not spending.' : 'Reduces the balance and logs a Debt Payment expense.'}><Input inputMode="decimal" value={pay.amount} onChange={(e) => setPay({ ...pay, amount: e.target.value })} autoFocus /></Field>
              <Button type="submit" className="w-full">Log payment</Button>
            </form>
          )}
        </Sheet>
      </div>
    );
  }

  const GRADE_TONE = (g) => !g ? 'text-slate-400' : g.startsWith('A') ? 'text-emerald-600 dark:text-emerald-400' : g.startsWith('B') ? 'text-lime-600 dark:text-lime-400' : g.startsWith('C') ? 'text-amber-600 dark:text-amber-400' : 'text-rose-600 dark:text-rose-400';

  function Bar({ value, className = 'bg-brand-500', track = 'bg-slate-900/[.05] dark:bg-white/[.07]', h = 'h-2' }) {
    return <div className={cls(h, 'rounded-full overflow-hidden', track)}><div className={cls('h-full rounded-full transition-all', className)} style={{ width: `${clamp01(value) * 100}%` }} /></div>;
  }
  const clamp01 = (v) => Math.min(1, Math.max(0, Number(v) || 0));

  function GradeRing({ grade, score }) {
    const r = 42, c = 2 * Math.PI * r, v = clamp01((score || 0) / 100);
    return (
      <div className="relative w-28 h-28 shrink-0">
        <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90" aria-hidden="true">
          <circle cx="50" cy="50" r={r} fill="none" strokeWidth="9" className="stroke-slate-100 dark:stroke-slate-800" />
          <circle cx="50" cy="50" r={r} fill="none" strokeWidth="9" strokeLinecap="round" stroke="currentColor" className={GRADE_TONE(grade)} strokeDasharray={c} strokeDashoffset={c * (1 - v)} style={{ transition: 'stroke-dashoffset .6s ease' }} />
        </svg>
        <div className="absolute inset-0 grid place-items-center text-center">
          <div><p className={cls('text-3xl font-extrabold leading-none', GRADE_TONE(grade))}>{grade || '–'}</p>{score != null && <p className="num text-xs text-slate-500 mt-1">{score}/100</p>}</div>
        </div>
      </div>
    );
  }

  /* ====================================================== ANIMATION HELPERS */
  const prefersReducedMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; } };
  // Counts smoothly from the previous value to the new one (ease-out), e.g. after a deposit.
  function useAnimatedNumber(target, duration = 900) {
    const [v, setV] = useState(prefersReducedMotion() ? target : 0);
    const from = useRef(prefersReducedMotion() ? target : 0), raf = useRef();
    useEffect(() => {
      if (prefersReducedMotion()) { from.current = target; setV(target); return; }
      const start = performance.now(), a = from.current;
      const tick = (now) => { const k = Math.min(1, (now - start) / duration), e = 1 - Math.pow(1 - k, 3), val = a + (target - a) * e; from.current = val; setV(val); if (k < 1) raf.current = requestAnimationFrame(tick); };
      cancelAnimationFrame(raf.current); raf.current = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf.current);
    }, [target]);
    return v;
  }
  function AnimatedMoney({ value, className, short }) { const { fmt } = useApp(); const v = useAnimatedNumber(Number(value) || 0); return <span className={cls('num', className)}>{fmt(v, short)}</span>; }
  // Width grows from 0 on first paint, then animates on every change.
  function GrowBar({ value, color, h = 'h-2.5', track = 'bg-slate-900/[.06] dark:bg-white/[.07]', liquid, children }) {
    const [w, setW] = useState(0);
    useEffect(() => { const id = requestAnimationFrame(() => setW(Math.max(0, Math.min(1, value || 0)))); return () => cancelAnimationFrame(id); }, [value]);
    return <div className={cls('relative rounded-full overflow-hidden', h, track)}><div className={cls('grow-bar h-full rounded-full', liquid && 'liquid')} style={{ width: `${w * 100}%`, background: color }} />{children}</div>;
  }
  // A segment inside a flex track that grows from 0 to its share.
  function GrowBarRaw({ value, color }) {
    const [w, setW] = useState(0);
    useEffect(() => { const id = requestAnimationFrame(() => setW(Math.max(0, Math.min(1, value || 0)))); return () => cancelAnimationFrame(id); }, [value]);
    return <div className="grow-bar h-full rounded-full shrink-0" style={{ width: `${w * 100}%`, background: color }} />;
  }
  // Circular "liquid fill" gauge: the water level rises to the percentage, with moving waves.
  function LiquidGauge({ pct, size = 128, color = '#10b981', label = 'funded' }) {
    const id = useMemo(() => 'lq' + Math.random().toString(36).slice(2, 8), []);
    const p = Math.max(0, Math.min(1, pct || 0));
    const [level, setLevel] = useState(0);
    useEffect(() => { const t = setTimeout(() => setLevel(p), 60); return () => clearTimeout(t); }, [p]);
    const shown = useAnimatedNumber(Math.round((pct || 0) * 100), 1200);
    const wave = 'M0 6 Q15 0 30 6 T60 6 T90 6 T120 6 T150 6 T180 6 T210 6 T240 6 V140 H0 Z';
    return (
      <svg viewBox="0 0 120 120" width={size} height={size} role="img" aria-label={`${Math.round((pct || 0) * 100)}% ${label}`} className="shrink-0">
        <defs><clipPath id={id}><circle cx="60" cy="60" r="54" /></clipPath></defs>
        <circle cx="60" cy="60" r="58" fill="none" stroke={color} strokeOpacity="0.3" strokeWidth="3" />
        <g clipPath={`url(#${id})`}>
          <rect width="120" height="120" className="fill-slate-100 dark:fill-slate-800" />
          <g style={{ transform: `translateY(${6 + 108 * (1 - level)}px)`, transition: prefersReducedMotion() ? 'none' : 'transform 1.4s cubic-bezier(.22,1,.36,1)' }}>
            <path className="wave-b" d={wave} fill={color} opacity="0.35" />
            <path className="wave-a" d={wave} fill={color} opacity="0.85" transform="translate(0 4)" />
          </g>
        </g>
        <text x="60" y="58" textAnchor="middle" className="fill-slate-900 dark:fill-white stroke-white/70 dark:stroke-slate-900/70" style={{ fontSize: 24, fontWeight: 800, paintOrder: 'stroke', strokeWidth: 3 }}>{Math.round(shown)}%</text>
        <text x="60" y="76" textAnchor="middle" className="fill-slate-600 dark:fill-slate-200" style={{ fontSize: 10, fontWeight: 600 }}>{label}</text>
      </svg>
    );
  }

  /* ============================================================ CHARTS */
  function useThemeMode() {
    const get = () => (document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    const [m, setM] = useState(get);
    useEffect(() => { const o = new MutationObserver(() => setM(get())); o.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] }); return () => o.disconnect(); }, []);
    return m;
  }
  function useChartLib() {
    const [st, setSt] = useState(window.Chart ? 'ready' : 'loading'); const [err, setErr] = useState('');
    useEffect(() => { if (window.Chart) return; Analytics.loadChart().then(() => setSt('ready')).catch((e) => { setErr(e.message); setSt('error'); }); }, []);
    return [st, err];
  }
  // Chart.js canvas that updates in place (animated) when its data changes and rebuilds on theme change.
  function ChartBox({ build, dataKey, height = 220, label }) {
    const ref = useRef(), chart = useRef();
    const mode = useThemeMode(); const [st, err] = useChartLib(); const { fmt } = useApp();
    useEffect(() => {
      if (st !== 'ready' || !ref.current) return;
      const cfg = build(Analytics.theme(mode), fmt);
      if (chart.current && chart.current.config.type === cfg.type && chart.current._cwMode === mode) { chart.current.data = cfg.data; chart.current.options = cfg.options; chart.current.update(); }
      else { if (chart.current) chart.current.destroy(); chart.current = new window.Chart(ref.current, cfg); chart.current._cwMode = mode; }
    }, [st, mode, dataKey]);
    useEffect(() => () => { if (chart.current) chart.current.destroy(); }, []);
    return (
      <div className="relative" style={{ height }}>
        {st === 'loading' && <div className="absolute inset-0 skeleton" />}
        {st === 'error' && <p className="absolute inset-0 grid place-items-center text-sm text-slate-500 text-center px-6">{err}</p>}
        <canvas ref={ref} role="img" aria-label={label} />
      </div>
    );
  }
  // "Show numbers" table under each chart (accessibility + exact values).
  function NumbersTable({ head, rows }) {
    return (
      <Disclosure className="mt-2 text-xs" summary="Show numbers">
        <div className="overflow-x-auto mt-2"><table className="w-full num"><thead><tr>{head.map((h, i) => <th key={i} className={cls('py-1 px-1.5 font-semibold text-slate-500 border-b border-slate-200 dark:border-slate-700', i ? 'text-right' : 'text-left')}>{h}</th>)}</tr></thead>
          <tbody>{rows.map((r, i) => <tr key={i} className="border-b border-slate-100 dark:border-slate-800">{r.map((c, j) => <td key={j} className={cls('py-1 px-1.5', j ? 'text-right' : 'text-left')}>{c}</td>)}</tr>)}</tbody></table></div>
      </Disclosure>
    );
  }
  const STATUS = { good: { color: '#0ca30c', icon: 'CircleCheck' }, warning: { color: '#fab219', icon: 'TriangleAlert' }, serious: { color: '#ec835a', icon: 'TriangleAlert' }, critical: { color: '#d03b3b', icon: 'CircleAlert' } };
  const StatusLabel = ({ level, children }) => <span className="inline-flex items-center gap-1 text-xs font-semibold" style={{ color: level === 'warning' ? '#b7791f' : STATUS[level].color }}><Icon name={STATUS[level].icon} size={13} />{children}</span>;

  // Semicircle gauge (savings rate). Status color always comes with an icon + label.
  function SemiGauge({ value, min = -0.2, max = 0.5, level, center, sub }) {
    const v = Math.max(min, Math.min(max, value ?? 0)), k = (v - min) / (max - min);
    const shown = useAnimatedNumber(k, 1100);
    const R = 50, C = Math.PI * R;
    const zeroK = (0 - min) / (max - min);
    return (
      <svg viewBox="0 0 120 70" className="w-full max-w-[220px] mx-auto" role="img" aria-label={`${center} ${sub}`}>
        <path d="M10 62 A50 50 0 0 1 110 62" fill="none" className="stroke-slate-200 dark:stroke-slate-700" strokeWidth="10" strokeLinecap="round" />
        <path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke={STATUS[level].color} strokeWidth="10" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - Math.max(0.001, shown))} />
        <line x1={60 - 56 * Math.cos(Math.PI * zeroK)} y1={62 - 56 * Math.sin(Math.PI * zeroK)} x2={60 - 44 * Math.cos(Math.PI * zeroK)} y2={62 - 44 * Math.sin(Math.PI * zeroK)} className="stroke-slate-400" strokeWidth="1.5" />
        <text x="60" y="52" textAnchor="middle" className="fill-slate-900 dark:fill-white" style={{ fontSize: 18, fontWeight: 800 }}>{center}</text>
        <text x="60" y="66" textAnchor="middle" className="fill-slate-500" style={{ fontSize: 8 }}>{sub}</text>
      </svg>
    );
  }

  const PERIODS = [{ value: '3', label: '3 months' }, { value: '6', label: '6 months' }, { value: '12', label: '12 months' }];
  const pctTxt = (v) => (v == null || !isFinite(v) ? '-' : `${Math.round(v * 100)}%`);

  function AnalyticsView() {
    const { data, fmt, go } = useApp();
    const [period, setPeriod] = useState('6');
    const [ccView, setCcView] = useState('spending');
    const months = useMemo(() => Analytics.monthsBack(Number(period)), [period]);

    const series = useMemo(() => Analytics.monthly(data, months), [data, months]);

    const days = period === '3' ? 90 : period === '6' ? 182 : 365;
    const cf = useMemo(() => Analytics.cashFlow(data, days, period === '3' ? 'day' : 'week'), [data, days, period]);
    const ind = useMemo(() => Analytics.indicators(data, months), [data, months]);
    const totals = { income: series.reduce((s, m) => s + m.income, 0), expense: series.reduce((s, m) => s + m.expense, 0) };
    const sr = ind.latest ? ind.latest.savingsRate : null;
    const srLevel = sr == null ? 'warning' : sr >= 0.2 ? 'good' : sr >= 0.1 ? 'warning' : sr >= 0 ? 'serious' : 'critical';
    const srText = sr == null ? 'No income yet' : sr >= 0.2 ? 'Healthy (20%+)' : sr >= 0.1 ? 'Okay (10-20%)' : sr >= 0 ? 'Low (under 10%)' : 'Spent more than earned';
    const dti = ind.dti;
    const dtiLevel = dti == null ? 'warning' : dti <= 0.2 ? 'good' : dti <= 0.36 ? 'warning' : dti <= 0.43 ? 'serious' : 'critical';
    const dtiText = dti == null ? 'Needs income data' : dti <= 0.2 ? 'Low' : dti <= 0.36 ? 'Manageable' : dti <= 0.43 ? 'High' : 'Very high';
    const t = Analytics.theme(useThemeMode());
    const hasAny = series.some((m) => m.hasData);
    const utilLevel = (u) => (u <= 0.3 ? 'good' : u <= 0.5 ? 'warning' : u <= 0.75 ? 'serious' : 'critical');

    if (!hasAny) return <Card className="mt-4"><Empty icon="ChartColumn" title="No data to chart yet" body="Import a statement or log a few entries and your charts appear here." action={<Button variant="secondary" onClick={() => go('upload')}>Import a statement</Button>} /></Card>;

    return (
      <div>
        <div className="mt-3"><Segmented value={period} onChange={setPeriod} options={PERIODS} /></div>

        {/* Income vs expenses */}
        <SectionTitle>Income vs. expenses</SectionTitle>
        <Card className="p-4">
          <div className="flex gap-4 text-sm mb-2">
            <div><p className="text-xs text-slate-500">Income</p><p className="num font-bold"><AnimatedMoney value={totals.income} short /></p></div>
            <div><p className="text-xs text-slate-500">Expenses</p><p className="num font-bold"><AnimatedMoney value={totals.expense} short /></p></div>
            <div><p className="text-xs text-slate-500">Net</p><p className={cls('num font-bold', totals.income - totals.expense < 0 && 'text-rose-600 dark:text-rose-400')}><AnimatedMoney value={totals.income - totals.expense} short /></p></div>
          </div>
          <ChartBox height={240} label="Monthly income versus expenses, expenses stacked by credit, bank and cash" dataKey={JSON.stringify(series)} build={(th, f) => Analytics.charts.incomeExpense(series, th, f)} />
          <NumbersTable head={['Month', 'Income', 'Cards', 'Bank', 'Cash', 'Total out']} rows={series.map((m) => [m.label, fmt(m.income), fmt(m.credit), fmt(m.bank), fmt(m.cash), fmt(m.expense)])} />
        </Card>

        {/* Credit cards */}
        <SectionTitle action={<button className="press text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('budget', 'debt')}>Cards</button>}>Credit cards</SectionTitle>
        <Card className="p-4">
          {cc.cards.length === 0 ? <Empty icon="CreditCard" title="No credit cards yet" body="Import a credit card statement to see spending, utilization and debt." /> : <>
            <Segmented value={ccView} onChange={setCcView} options={[{ value: 'spending', label: 'Spending' }, { value: 'utilization', label: 'Utilization' }, { value: 'debt', label: 'Debt' }]} />
            <div className="mt-3">
              {ccView === 'spending' && <>
                <p className="text-xs text-slate-500 mb-2">Card charges per month · {fmt(cc.totalCharges.reduce((a, b) => a + b, 0))} over {period} months</p>
                <ChartBox height={220} label="Credit card charges per month, stacked by card" dataKey={'s' + JSON.stringify(cc.totalCharges) + cc.cards.map((c) => c.name).join()} build={(th, f) => Analytics.charts.creditSpending(cc, labels, th, f)} />
                <NumbersTable head={['Month', ...cc.cards.slice(0, 6).map((c) => c.name), 'Total']} rows={labels.map((l, i) => [l, ...cc.cards.slice(0, 6).map((c) => fmt(c.charges[i])), fmt(cc.totalCharges[i])])} />
              </>}
              {ccView === 'utilization' && <div className="space-y-4">
                {cc.overallUtilization != null && <div className="flex items-baseline justify-between"><p className="text-sm text-slate-500">Overall utilization</p><p className="num text-xl font-bold">{pctTxt(cc.overallUtilization)}</p></div>}
                {cc.cards.map((c) => (
                  <div key={c.id || c.name}>
                    <div className="flex items-baseline justify-between text-sm"><span className="font-medium">{c.name}</span>
                      {c.limit ? <span className="num text-slate-500">{fmt(c.balance)} of {fmt(c.limit, true)}</span> : <button className="press text-xs font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('budget', 'debt')}>Add credit limit</button>}</div>
                    {c.limit ? <>
                      <div className="mt-1.5"><GrowBar value={c.utilization} color={STATUS[utilLevel(c.utilization)].color}><span className="absolute top-0 bottom-0 w-0.5 bg-slate-400/70" style={{ left: '30%' }} title="30% guideline" /></GrowBar></div>
                      <div className="flex justify-between mt-1"><StatusLabel level={utilLevel(c.utilization)}>{pctTxt(c.utilization)} used · {c.utilization <= 0.3 ? 'Good' : c.utilization <= 0.5 ? 'Fair' : c.utilization <= 0.75 ? 'High' : 'Very high'}</StatusLabel><span className="text-[11px] text-slate-400">guideline: under 30%</span></div>
                    </> : <p className="text-xs text-slate-500 mt-1">Utilization needs the card's credit limit.</p>}
                  </div>
                ))}
              </div>}
              {ccView === 'debt' && <>
                <p className="text-xs text-slate-500 mb-2">Amount owed at each month end, rebuilt from your current balance and statement history.</p>
                <ChartBox height={220} label="Credit card debt by month" dataKey={'d' + JSON.stringify(cc.totalOwed) + cc.cards.map((c) => c.owed.join()).join('|')} build={(th, f) => Analytics.charts.debtTrajectory(cc, labels, th, f)} />
                <NumbersTable head={['Month', ...cc.cards.slice(0, 5).map((c) => c.name), 'Total']} rows={labels.map((l, i) => [l, ...cc.cards.slice(0, 5).map((c) => (c.owed[i] == null ? '-' : fmt(c.owed[i]))), cc.totalOwed[i] == null ? '-' : fmt(cc.totalOwed[i])])} />
              </>}
            </div>
          </>}
        </Card>

        {/* Category doughnut */}
        <SectionTitle>Spending by category</SectionTitle>
        <Card className="p-4">
          {cat.rows.length === 0 ? <p className="text-sm text-slate-500">No spending in this period.</p> : (
            <div>
              <div className="relative mx-auto" style={{ width: 190 }}>
                <ChartBox height={190} label="Spending share by category" dataKey={'c' + JSON.stringify(cat.rows)} build={(th, f) => Analytics.charts.categories(cat, th, f)} />
                <div className="absolute inset-0 grid place-items-center pointer-events-none text-center"><div><p className="num text-base font-bold leading-tight"><AnimatedMoney value={cat.total} short /></p><p className="text-[11px] text-slate-500">last {period} months</p></div></div>
              </div>
              <ul className="space-y-2 text-sm mt-4">
                {cat.rows.map((r, i) => (
                  <li key={r.category} className="flex items-center gap-2 min-w-0">
                    <i className="w-2.5 h-2.5 rounded-sm shrink-0" style={{ background: r.category === 'Other' && i === cat.rows.length - 1 ? t.muted : t.series[i] }} />
                    <span className="truncate flex-1">{r.category}{r.folded ? <span className="text-slate-400"> (+{r.folded})</span> : ''}</span>
                    <span className="num text-slate-500 text-xs w-10 text-right">{Math.round(r.share * 100)}%</span>
                    <span className="num font-medium w-24 text-right">{fmt(r.total)}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </Card>

        {/* Indicators */}
        <SectionTitle>Financial indicators</SectionTitle>
        <div className="grid grid-cols-1 gap-3">
          <Card className="p-4">
            <div className="flex items-baseline justify-between"><p className="font-semibold">Savings rate</p><span className="text-xs text-slate-500">{ind.latest ? ind.latest.label : ''}</span></div>
            <SemiGauge value={sr} level={srLevel} center={sr == null ? '-' : `${Math.round(sr * 100)}%`} sub="of income saved" />
            <div className="flex justify-between items-center -mt-1"><StatusLabel level={srLevel}>{srText}</StatusLabel>
              {ind.latest && <span className="num text-xs text-slate-500">{fmt(Math.max(0, ind.latest.net))} saved · {fmt(ind.latest.expense)} spent</span>}</div>
            {ind.latest && ind.latest.toFunds > 0 && <p className="text-xs text-slate-500 mt-1">{fmt(ind.latest.toFunds)} of it moved into your savings funds.</p>}
            <div className="mt-3"><ChartBox height={130} label="Savings rate by month" dataKey={'r' + JSON.stringify(series.map((m) => m.savingsRate))} build={(th) => Analytics.charts.savingsRate(series, th)} /></div>
          </Card>
          <Card className="p-4">
            <div className="flex items-baseline justify-between"><p className="font-semibold">Debt-to-income</p><span className="num text-2xl font-extrabold tracking-tight">{pctTxt(dti)}</span></div>
            <p className="text-xs text-slate-500">Minimum debt payments {fmt(ind.debtPayments)} + housing {fmt(ind.housing)} ÷ average income {fmt(ind.avgIncome)}/mo</p>
            <div className="mt-3 relative h-3 rounded-full overflow-hidden flex">
              <div className="h-full bg-emerald-500/25" style={{ width: '33.3%' }} /><div className="h-full bg-amber-400/30" style={{ width: '26.7%' }} /><div className="h-full bg-orange-400/30" style={{ width: '11.7%' }} /><div className="h-full bg-rose-500/25" style={{ width: '28.3%' }} />
              {dti != null && <span className="absolute top-[-2px] bottom-[-2px] w-1.5 rounded-full grow-bar" style={{ left: `calc(${Math.min(1, dti / 0.6) * 100}% - 3px)`, background: STATUS[dtiLevel].color, transition: 'left 1.1s cubic-bezier(.22,1,.36,1)' }} />}
            </div>
            <div className="flex justify-between text-[10px] text-slate-400 mt-1 num"><span>0%</span><span>20%</span><span>36%</span><span>43%</span><span>60%+</span></div>
            <div className="mt-2"><StatusLabel level={dtiLevel}>{dtiText}{dti != null && dti > 0.36 ? ' · lenders prefer 36% or less' : ''}</StatusLabel></div>
          </Card>
        </div>

        {/* Cash flow */}
        <SectionTitle>Bank & cash balance</SectionTitle>
        <Card className="p-4">
          {cf.accounts === 0 ? <p className="text-sm text-slate-500">Add a bank account or log cash to see your balance over time.</p> : <>
            <div className="flex gap-4 text-sm mb-2">
              <div><p className="text-xs text-slate-500">Now</p><p className="num font-bold"><AnimatedMoney value={cf.end} /></p></div>
              <div><p className="text-xs text-slate-500">Change</p><p className={cls('num font-bold', cf.change < 0 ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-700 dark:text-emerald-400')}>{cf.change >= 0 ? '+' : ''}{fmt(cf.change)}</p></div>
              <div><p className="text-xs text-slate-500">Lowest</p><p className="num font-bold">{fmt(cf.min)}</p></div>
            </div>
            <ChartBox height={200} label="Combined bank and cash balance over time" dataKey={'f' + cf.points.length + cf.end + cf.start + period} build={(th, f) => Analytics.charts.cashFlow(cf, th, f)} />
            <p className="text-[11px] text-slate-400 mt-1">{period === '3' ? 'Daily' : 'Weekly'} balance across bank accounts and the cash wallet. Hand-entered balances stay flat.</p>
          </>}
        </Card>
      </div>
    );
  }

  /* ===================================================== CREDIT CARDS */
  const CARD_COLORS = [['#334155', '#0f172a'], ['#2a78d6', '#1e3a8a'], ['#10b981', '#065f46'], ['#6250d6', '#3b2a8f'], ['#eb6834', '#9a3412'], ['#e87ba4', '#9d174d']];
  const ordinal = (n) => { const sfx = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]); };
  const shortDay = (iso) => parseISO(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const cardUtilLevel = (u) => (u <= 0.3 ? 'good' : u <= 0.5 ? 'warning' : u <= 0.75 ? 'serious' : 'critical');

  // Latest payment toward a card: imported or logged card payments, debt payments, or "Mark paid".
  function cardLastPaid(card, transactions) {
    let last = card.lastPaid || null;
    for (const t of transactions) {
      const hit = (card.id != null && t.debtId === card.id) || (t.accountType === 'credit' && t.type === 'transfer' && t.direction === 'in' && t.category === 'Card Payment' && sameName(t.accountName, card.name));
      if (hit && (!last || t.date > last)) last = t.date;
    }
    return last;
  }
  // Cards with balance, utilization and due-date status (shared with reminders via RecurringScanner.cardDueStatus).
  function useCards() {
    const { data } = useApp();
    return useMemo(() => data.debts.filter(isCardDebt).map((c) => {
      const lastPaid = cardLastPaid(c, data.transactions);
      const limit = Number(c.creditLimit) || 0;
      return { ...c, lastPaid, limit, status: RecurringScanner.cardDueStatus({ ...c, lastPaid }, todayISO()), utilization: limit > 0 ? Math.max(0, Number(c.balance) || 0) / limit : null };
    }), [data.debts, data.transactions]);
  }
  const URGENCY_ORDER = { overdue: 0, urgent: 1, soon: 2, ok: 3, unset: 4, paid: 5, clear: 6 };
  const DUE_BADGE = {
    overdue: { cls: 'bg-rose-600 text-white pulse-red', icon: 'CircleAlert' },
    urgent: { cls: 'bg-rose-600 text-white pulse-red', icon: 'AlarmClock' },
    soon: { cls: 'bg-amber-100 text-amber-900 dark:bg-amber-400/15 dark:text-amber-300', icon: 'Clock' },
    ok: { cls: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300', icon: 'CalendarCheck' },
    paid: { cls: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300', icon: 'CircleCheck' },
    clear: { cls: 'bg-slate-900/[.06] text-slate-600 dark:bg-white/[.08] dark:text-slate-300', icon: 'CircleCheck' },
    unset: { cls: 'bg-slate-900/[.06] text-slate-600 dark:bg-white/[.08] dark:text-slate-300', icon: 'CalendarPlus' },
  };
  function dueText(st) {
    if (!st.set) return 'No due date';
    if (st.level === 'clear') return 'Nothing owed';
    if (st.paid) return 'Paid';
    const d = st.daysLeft;
    return d < 0 ? `${-d} day${d === -1 ? '' : 's'} overdue` : d === 0 ? 'Due today' : d === 1 ? 'Due tomorrow' : `Due in ${d} days`;
  }
  const DueBadge = ({ st }) => { const b = DUE_BADGE[st.level]; return <span data-level={st.level} className={cls('inline-flex items-center gap-1 text-[11px] font-bold px-2 py-1 rounded-full whitespace-nowrap shrink-0', b.cls)}><Icon name={b.icon} size={12} strokeWidth={2.5} />{dueText(st)}</span>; };
  const CardChip = ({ c, size = 'md' }) => {
    const [a, b] = CARD_COLORS[(Number(c.color) || 0) % CARD_COLORS.length];
    return (
      <div className={cls('relative shrink-0 rounded-[8px] overflow-hidden text-white shadow-[0_6px_14px_-8px_rgba(14,27,44,.8)]', size === 'md' ? 'w-12 h-8' : 'w-10 h-7')} style={{ background: `linear-gradient(135deg, ${a}, ${b})` }} aria-hidden="true">
        <span className="absolute left-1.5 top-1.5 w-2.5 h-2 rounded-[2px] bg-amber-200/80" />
        <span className="num absolute right-1 bottom-0.5 text-[8px] font-bold tracking-wide opacity-90">{c.last4 || ''}</span>
      </div>
    );
  };
  const nextDueLabel = (st) => (st.paid ? `next ${shortDay(st.nextDue)}` : shortDay(st.currentDue));

  // Dashboard: every card with balance, limit, utilization and its payment countdown, most urgent first.
  function CardDueTracker() {
    const { openCards } = useApp();
    const cards = useCards();
    const sorted = [...cards].sort((a, b) => URGENCY_ORDER[a.status.level] - URGENCY_ORDER[b.status.level] || (a.status.daysLeft ?? 99) - (b.status.daysLeft ?? 99));
    return (
      <>
        <SectionTitle action={<button className="press text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => openCards({})}>Manage</button>}>Credit card due dates</SectionTitle>
        {cards.length === 0
          ? <Card><Empty icon="CreditCard" title="No credit cards yet" body="Add a card to track its balance, limit and payment due date." action={<Button onClick={() => openCards({ edit: 'new' })}><Icon name="Plus" size={16} />Add a card</Button>} /></Card>
          : <Card className="divide-y divide-slate-900/[.05] dark:divide-white/[.06] rise-list" data-testid="card-tracker">{sorted.map((c) => <CardDueRow key={c.id} c={c} />)}</Card>}
      </>
    );
  }
  function CardDueRow({ c }) {
    const { fmt, openCards, markCardPaid } = useApp();
    const st = c.status, actionable = ['overdue', 'urgent', 'soon'].includes(st.level);
    return (
      <div className="p-3.5" data-card={c.name}>
        <div className="flex items-start gap-3">
          <button className="press flex-1 min-w-0 flex items-start gap-3 text-left" onClick={() => openCards({ edit: c.id })} aria-label={`Edit ${c.name}`}>
            <CardChip c={c} />
            <div className="min-w-0 flex-1">
              <p className="font-semibold truncate leading-tight">{c.name}{c.last4 && <span className="num text-slate-400 font-medium"> ••{c.last4}</span>}</p>
              <p className="num text-xs text-slate-500 mt-0.5"><span className="font-semibold text-slate-700 dark:text-slate-200">{fmt(c.balance)}</span>{c.limit ? ` of ${fmt(c.limit, true)}` : ' owed'}</p>
            </div>
          </button>
          <DueBadge st={st} />
        </div>
        {c.limit > 0 && <div className="mt-2.5 flex items-center gap-2">
          <div className="flex-1"><GrowBar value={c.utilization} color={STATUS[cardUtilLevel(c.utilization)].color} h="h-1.5" /></div>
          <span className="num text-[11px] font-semibold text-slate-500 w-14 text-right">{Math.round(c.utilization * 100)}% used</span>
        </div>}
        <div className="flex items-center justify-between gap-2 mt-2 text-xs text-slate-500">
          <span className="min-w-0 truncate">{st.set ? <>Due on the {ordinal(c.dueDay)} · <span className="font-semibold text-slate-700 dark:text-slate-200">{nextDueLabel(st)}</span></> : c.limit ? 'No payment due date yet' : 'Add a limit and due date'}</span>
          {!st.set ? <button className="press shrink-0 font-semibold text-brand-700 dark:text-brand-400" onClick={() => openCards({ edit: c.id })}>Set due date</button>
            : actionable && <button className="press shrink-0 font-semibold text-brand-700 dark:text-brand-400" onClick={() => markCardPaid(c)}>Mark paid</button>}
        </div>
      </div>
    );
  }

  // Day-of-month picker: tap a day, change it any time.
  function DueDayPicker({ value, onChange }) {
    const next = value ? RecurringScanner.cardDueStatus({ dueDay: value, balance: 1, dueSince: todayISO() }).currentDue : null;
    return (
      <div>
        <div className="grid grid-cols-7 gap-1.5" role="radiogroup" aria-label="Payment due day">
          {Array.from({ length: 31 }, (_, i) => i + 1).map((d) => (
            <button type="button" key={d} role="radio" aria-checked={value === d} aria-label={`Due on the ${ordinal(d)}`} onClick={() => onChange(d)}
              className={cls('press num h-9 rounded-[10px] text-sm font-semibold transition-all duration-300 ease-in-out', value === d ? 'bg-gradient-to-b from-brand-500 to-brand-600 text-white shadow-[0_6px_14px_-6px_rgba(5,150,105,.7)] scale-105' : 'bg-slate-900/[.04] dark:bg-white/[.06] text-slate-700 dark:text-slate-200')}>{d}</button>
          ))}
          {value && <button type="button" onClick={() => onChange(null)} className="press col-span-4 h-9 rounded-[10px] text-xs font-semibold text-slate-500 border border-dashed border-slate-300 dark:border-slate-600">No due date</button>}
        </div>
        <p className="text-xs text-slate-500 mt-2" aria-live="polite">{value
          ? <>Due on the <b className="text-slate-800 dark:text-slate-100">{ordinal(value)}</b> of every month · next {shortDay(next)}{value >= 29 ? '. In shorter months it falls on the last day.' : ''}</>
          : 'Pick the day of the month your payment is due. You can change it any time.'}</p>
      </div>
    );
  }

  function CardForm({ card, onDone }) {
    const { data, save, remove, toast, reload, go } = useApp();
    const [f, setF] = useState(() => card
      ? { name: card.name, last4: card.last4 || '', creditLimit: card.creditLimit ?? '', balance: String(card.balance ?? ''), apr: card.apr ? String(card.apr) : '', minPayment: card.minPayment ? String(card.minPayment) : '', dueDay: Number(card.dueDay) || null, reminders: card.reminders !== false, remindDays: card.remindDays ?? '', color: Number(card.color) || 0 }
      : { name: '', last4: '', creditLimit: '', balance: '', apr: '', minPayment: '', dueDay: null, reminders: true, remindDays: '', color: data.debts.filter(isCardDebt).length % CARD_COLORS.length });
    const [confirmDel, setConfirmDel] = useState(false);
    const set = (k) => (e) => setF({ ...f, [k]: e && e.target ? e.target.value : e });
    const orig = card ? data.debts.find((d) => d.id === card.id) : null;
    const st = card ? card.status : null;

    const submit = async (e) => {
      e.preventDefault();
      const name = f.name.trim();
      if (!name) return toast('Give the card a name', 'error');
      if (f.last4 && !/^\d{4}$/.test(f.last4)) return toast('Last 4 digits must be exactly 4 numbers', 'error');
      if (data.debts.some((d) => d.id !== orig?.id && isCardDebt(d) && sameName(d.name, name))) return toast('You already have a card with this name', 'error');
      const bal = round2(parseAmount(f.balance) || 0);
      const balChanged = !orig || Math.abs(bal - Number(orig.balance)) > 0.004;
      const dueDay = f.dueDay ? Number(f.dueDay) : null;
      const limit = f.creditLimit === '' || f.creditLimit == null ? null : round2(parseAmount(f.creditLimit) || 0) || null;
      await save('debts', {
        ...(orig || { type: 'Credit Card', kind: 'credit' }), name, last4: f.last4 || '', creditLimit: limit, balance: bal, apr: Number(f.apr) || 0,
        minPayment: round2(parseAmount(f.minPayment) || 0), dueDay, reminders: !!f.reminders, remindDays: f.remindDays === '' ? null : Number(f.remindDays), color: f.color,
        ...((orig ? Number(orig.dueDay) || null : null) !== dueDay ? { dueSince: todayISO() } : {}),
        ...(orig && orig.ledger && balChanged ? { anchorBalance: bal, anchorDate: todayISO(), anchorSetAt: new Date().toISOString(), balanceSource: 'manual' } : {}),
      });
      // Renamed: keep its imported transactions attached to it.
      if (orig && !sameName(orig.name, name)) {
        const moved = data.transactions.filter((t) => t.accountType === 'credit' && sameName(t.accountName, orig.name)).map((t) => ({ ...t, accountName: name }));
        if (moved.length) { await DB.bulkPut('transactions', moved); await reload('transactions'); }
      }
      toast(orig ? 'Card saved' : 'Card added'); onDone();
    };

    return (
      <form className="space-y-4" onSubmit={submit}>
        <div className="flex items-center gap-3">
          <CardChip c={{ ...f, last4: f.last4 }} />
          <div className="flex gap-1.5">{CARD_COLORS.map(([a, b], i) => <button type="button" key={i} aria-label={`Card color ${i + 1}`} onClick={() => setF({ ...f, color: i })} className={cls('press w-7 h-7 rounded-full ring-offset-2 ring-offset-[var(--sheet)]', f.color === i && 'ring-2 ring-brand-500')} style={{ background: `linear-gradient(135deg, ${a}, ${b})` }} />)}</div>
        </div>
        <div className="grid grid-cols-3 gap-3">
          <div className="col-span-2"><Field label="Card name"><Input value={f.name} onChange={set('name')} placeholder="e.g. Amex Gold" /></Field></div>
          <Field label="Last 4 digits"><Input inputMode="numeric" autoComplete="off" placeholder="1234" value={f.last4} onChange={(e) => setF({ ...f, last4: e.target.value.replace(/\D/g, '').slice(0, 4) })} /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Credit limit"><Input inputMode="decimal" placeholder="e.g. 8,000" value={f.creditLimit} onChange={set('creditLimit')} /></Field>
          <Field label="Current balance"><Input inputMode="decimal" placeholder="0.00" value={f.balance} onChange={set('balance')} /></Field>
          <Field label="APR %"><Input inputMode="decimal" placeholder="e.g. 24.99" value={f.apr} onChange={set('apr')} /></Field>
          <Field label="Minimum payment"><Input inputMode="decimal" placeholder="0.00" value={f.minPayment} onChange={set('minPayment')} /></Field>
        </div>
        {orig?.ledger && <p className="text-xs text-slate-500 -mt-2">This card's balance updates from imported statements. Changing it here sets a new starting balance from today.</p>}

        <div>
          <span className="block text-[13px] font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Payment due date</span>
          <DueDayPicker value={f.dueDay} onChange={(d) => setF({ ...f, dueDay: d })} />
        </div>

        <div className="rounded-[16px] bg-slate-900/[.04] dark:bg-white/[.05] p-3 space-y-3">
          <label className="flex items-center justify-between gap-3">
            <span><span className="block text-sm font-semibold">Payment reminders</span><span className="block text-xs text-slate-500">Before the due date, on the day, and if it's overdue.</span></span>
            <button type="button" role="switch" aria-checked={!!f.reminders} aria-label="Payment reminders" onClick={() => setF({ ...f, reminders: !f.reminders })} className={cls('press w-12 h-7 rounded-full p-0.5 transition-colors duration-300 shrink-0', f.reminders ? 'bg-brand-500' : 'bg-slate-300 dark:bg-slate-700')}>
              <span className={cls('block w-6 h-6 rounded-full bg-white shadow transition-transform duration-300', f.reminders && 'translate-x-5')} />
            </button>
          </label>
          {f.reminders && <Field label="First reminder"><Select value={f.remindDays} onChange={set('remindDays')} options={[{ value: '', label: `App setting (${data.settings.reminderDays ?? 3} days before)` }, { value: 0, label: 'Only on the due date' }, ...[1, 2, 3, 5, 7, 10].map((d) => ({ value: d, label: `${d} day${d > 1 ? 's' : ''} before` }))]} /></Field>}
          {f.reminders && !data.settings.notify && <p className="text-xs text-amber-700 dark:text-amber-300 flex gap-1.5"><Icon name="BellOff" size={14} className="shrink-0 mt-px" /><span>Notifications are off. <button type="button" className="press font-semibold underline" onClick={() => { onDone(); go('settings'); }}>Turn them on in Settings</button>.</span></p>}
        </div>

        {st && st.set && card.lastPaid && orig?.lastPaid === card.lastPaid && st.paid && (
          <p className="text-xs text-slate-500 flex items-center justify-between">Marked paid on {prettyDate(card.lastPaid)}
            <button type="button" className="press font-semibold text-brand-700 dark:text-brand-400" onClick={async () => { await save('debts', { ...orig, lastPaid: null }); toast('Paid mark removed'); }}>Undo</button></p>
        )}

        <Button type="submit" className="w-full">{orig ? 'Save card' : 'Add card'}</Button>
        {orig && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={async () => { if (!confirmDel) return setConfirmDel(true); await remove('debts', orig.id); toast(`${orig.name} deleted`); onDone(); }}>
          <Icon name="Trash2" size={16} />{confirmDel ? 'Tap again to delete this card' : 'Delete card'}</Button>}
        {confirmDel && <p className="text-xs text-slate-500 text-center -mt-2">Its transactions stay in your history.</p>}
      </form>
    );
  }

  // "Manage credit cards": list -> add / edit. state: {} (list) | { edit: id | 'new', fromList }
  function ManageCardsSheet({ state, setState }) {
    const { fmt } = useApp();
    const cards = useCards();
    const editing = state && state.edit && state.edit !== 'new' ? cards.find((c) => c.id === state.edit) : null;
    const title = !state ? 'Credit cards' : state.edit === 'new' ? 'Add credit card' : editing ? `Edit ${editing.name}` : 'Manage credit cards';
    const close = () => setState(null);
    const back = () => (state && state.fromList ? setState({}) : close());
    return (
      <Sheet open={!!state} title={title} onClose={close}>
        {state && (state.edit ? (
          <div key={state.edit} className="fade-in">
            {state.fromList && <button type="button" onClick={() => setState({})} className="press -mt-1 mb-3 inline-flex items-center gap-1 text-sm font-semibold text-brand-700 dark:text-brand-400"><Icon name="ChevronLeft" size={16} />All cards</button>}
            <CardForm card={editing} onDone={back} />
          </div>
        ) : (
          <div className="fade-in">
            {cards.length === 0 ? <Empty icon="CreditCard" title="No cards yet" body="Add a card to track its limit and when the payment is due." /> :
              <div className="card divide-y divide-slate-900/[.05] dark:divide-white/[.06] rise-list">
                {cards.map((c) => (
                  <button key={c.id} type="button" onClick={() => setState({ edit: c.id, fromList: true })} className="press w-full flex items-center gap-3 p-3.5 text-left">
                    <CardChip c={c} />
                    <div className="min-w-0 flex-1">
                      <p className="font-semibold truncate">{c.name}{c.last4 && <span className="num text-slate-400 font-medium"> ••{c.last4}</span>}</p>
                      <p className="num text-xs text-slate-500">{c.dueDay ? `Due on the ${ordinal(c.dueDay)}` : 'No due date'}{c.limit ? ` · limit ${fmt(c.limit, true)}` : ''}</p>
                    </div>
                    <Icon name="ChevronRight" size={18} className="text-slate-400" />
                  </button>
                ))}
              </div>}
            <Button className="w-full mt-4" onClick={() => setState({ edit: 'new', fromList: true })}><Icon name="Plus" size={16} />Add a card</Button>
            <p className="text-xs text-slate-500 mt-3 flex gap-1.5"><Icon name="ShieldCheck" size={14} className="shrink-0 mt-px text-emerald-600" />Saved only on this device. Store just the last 4 digits; never enter a full card number.</p>
          </div>
        ))}
      </Sheet>
    );
