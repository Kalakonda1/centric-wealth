<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div id="root"><div id="boot">Loading Centric Wealth…</div></div>

  <!-- =====================================================================
       FinanceDB — native IndexedDB wrapper (plain JS, no dependencies).
       Exposed as window.FinanceDB so it can be reused outside React.
       ===================================================================== -->
  <script>
  (function () {
    'use strict';
    const DB_NAME = 'centric-wealth';
    const DB_VERSION = 1;

    // Schema: bump DB_VERSION and add to this map to migrate.
    const SCHEMA = {
      transactions: { keyPath: 'id', indexes: [['date', 'date'], ['type', 'type'], ['category', 'category'], ['hash', 'hash']] },
      debts:        { keyPath: 'id', indexes: [] },
      bills:        { keyPath: 'id', indexes: [['active', 'active']] },
      budgets:      { keyPath: 'category', indexes: [] },
      accounts:     { keyPath: 'id', indexes: [] },
      settings:     { keyPath: 'key', indexes: [] },
    };

    let dbPromise = null;

    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB is not supported in this browser.'));
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = req.result;
          const tx = req.transaction;
          for (const [name, def] of Object.entries(SCHEMA)) {
            const store = db.objectStoreNames.contains(name)
              ? tx.objectStore(name)
              : db.createObjectStore(name, { keyPath: def.keyPath });
            for (const [idx, path, opts] of def.indexes) {
              if (!store.indexNames.contains(idx)) store.createIndex(idx, path, opts || { unique: false });
            }
          }
        };
        req.onsuccess = () => {
          const db = req.result;
          db.onversionchange = () => { db.close(); dbPromise = null; }; // another tab upgraded
          resolve(db);
        };
        req.onerror = () => reject(req.error);
        req.onblocked = () => console.warn('[FinanceDB] upgrade blocked — close other tabs of this app.');
      });
      return dbPromise;
    }

    const promisify = (req) => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });

    /** Run fn(storeOrStores) inside a transaction; resolves after commit with fn's return value. */
    async function withTx(storeNames, mode, fn) {
      const db = await open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeNames, mode);
        const stores = Array.isArray(storeNames)
          ? Object.fromEntries(storeNames.map((n) => [n, tx.objectStore(n)]))
          : tx.objectStore(storeNames);
        let result;
        Promise.resolve(fn(stores, tx)).then((r) => { result = r; }).catch((err) => { try { tx.abort(); } catch (_) {} reject(err); });
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      });
    }

    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    const stamp = (obj) => { const now = new Date().toISOString(); return { createdAt: now, ...obj, updatedAt: now }; };

    const FinanceDB = {
      STORES: Object.keys(SCHEMA),
      uid,
      open,
      getAll: (store) => withTx(store, 'readonly', (s) => promisify(s.getAll())),
      get: (store, key) => withTx(store, 'readonly', (s) => promisify(s.get(key))),
      count: (store) => withTx(store, 'readonly', (s) => promisify(s.count())),
      /** Insert or update. Auto-assigns id (for id-keyed stores) and timestamps. */
      put: (store, obj) => withTx(store, 'readwrite', (s) => {
        const rec = stamp(SCHEMA[store].keyPath === 'id' && !obj.id ? { ...obj, id: uid() } : obj);
        s.put(rec);
        return rec;
      }),
      bulkPut: (store, arr) => withTx(store, 'readwrite', (s) => {
        const out = arr.map((o) => stamp(SCHEMA[store].keyPath === 'id' && !o.id ? { ...o, id: uid() } : o));
        out.forEach((r) => s.put(r));
        return out.length;
      }),
      delete: (store, key) => withTx(store, 'readwrite', (s) => { s.delete(key); }),
      clear: (store) => withTx(store, 'readwrite', (s) => { s.clear(); }),
      /** Range query on an index, e.g. FinanceDB.byIndex('transactions','date','2026-10-01','2026-10-31') */
      byIndex: (store, index, lower, upper) => withTx(store, 'readonly', (s) => {
        const range = lower != null && upper != null ? IDBKeyRange.bound(lower, upper) : lower != null ? IDBKeyRange.only(lower) : null;
        return promisify(s.index(index).getAll(range));
      }),

      // ---- settings helpers (key/value) ----
      getSetting: async (key, fallback) => { const r = await FinanceDB.get('settings', key); return r ? r.value : fallback; },
      setSetting: (key, value) => withTx('settings', 'readwrite', (s) => { s.put({ key, value }); }),

      // ---- backup / restore ----
      async exportAll() {
        const data = { app: 'centric-wealth', version: DB_VERSION, exportedAt: new Date().toISOString(), stores: {} };
        for (const name of FinanceDB.STORES) data.stores[name] = await FinanceDB.getAll(name);
        return data;
      },
      async importAll(data, { replace = false } = {}) {
        if (!data || !data.stores) throw new Error('Not a Centric Wealth backup file.');
        const names = FinanceDB.STORES.filter((n) => Array.isArray(data.stores[n]));
        await withTx(names, 'readwrite', (stores) => {
          for (const n of names) {
            if (replace) stores[n].clear();
            data.stores[n].forEach((rec) => stores[n].put(rec));
          }
        });
        return names.reduce((sum, n) => sum + data.stores[n].length, 0);
      },
      async wipe() {
        await withTx(FinanceDB.STORES, 'readwrite', (stores) => { Object.values(stores).forEach((s) => s.clear()); });
      },
    };

    window.FinanceDB = FinanceDB;
  })();
  </script>

  <!-- Optional Google sign-in, Gmail bill scanning and Drive reports (see google-workspace.js).
       Google's own scripts load only when you use these features. -->
  <script src="./google-workspace.js"></script>
  <!-- Recurring subscriptions/bills detection + local reminders (see recurring-scanner.js) -->

  <script src="./statement-parser.js"></script>

  <!-- =====================================================================
       React app (JSX compiled in-browser by Babel Standalone)
       ===================================================================== -->
  <script type="text/babel" data-presets="react">
  const { useState, useEffect, useMemo, useCallback, useContext, createContext, useRef } = React;
  const DB = window.FinanceDB;

  /* ---------------------------------------------------------------- utils */
  const pad = (n) => String(n).padStart(2, '0');
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => toISO(new Date());
  const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const monthKey = (iso) => iso.slice(0, 7);
  const addMonths = (key, n) => { const [y, m] = key.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const monthLabel = (key, opts = { month: 'long', year: 'numeric' }) => { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, opts); };
  const daysInMonth = (y, m0) => new Date(y, m0 + 1, 0).getDate();
  const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  const prettyDate = (iso) => {
    const diff = daysBetween(todayISO(), iso);
    if (diff === 0) return 'Today';
    if (diff === -1) return 'Yesterday';
    if (diff === 1) return 'Tomorrow';
    return parseISO(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  };
  const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const cls = (...a) => a.filter(Boolean).join(' ');
  // Parses typed amounts like "1,234.56", "(45.00)" or "12,50".
  const parseAmount = (v) => {
    if (v == null) return NaN;
    let s = String(v).trim(); if (!s) return NaN;
    const neg = /^\(.*\)$/.test(s) || /-/.test(s);
    s = s.replace(/[^0-9.,]/g, '');
    if (/,\d{2}$/.test(s) && !/\.\d{2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
    const n = parseFloat(s); return isNaN(n) ? NaN : neg ? -n : n;
  };

  const EXPENSE_CATEGORIES = ['Housing', 'Utilities', 'Groceries', 'Dining', 'Transport', 'Health', 'Insurance', 'Shopping', 'Entertainment', 'Subscriptions', 'Debt Payment', 'Education', 'Travel', 'Gifts', 'Other'];
  const INCOME_CATEGORIES = ['Salary', 'Freelance', 'Interest', 'Refund', 'Gift', 'Other Income'];
  const DEBT_TYPES = ['Credit Card', 'Student Loan', 'Auto Loan', 'Mortgage', 'Personal Loan', 'Medical', 'Other'];
  const ACCOUNT_TYPES = ['Checking', 'Savings', 'Cash', 'Investment', 'Retirement', 'Property', 'Other'];
  const TRANSFER_CATEGORIES = ['Transfer', 'Card Payment', 'Card Credit'];

  /* ------------------------------------------------- bank vs credit accounts
     Bank accounts (checking/savings/cash) live in the `accounts` store; credit cards live in `debts`
     so the payoff planner and Advisor include them. Transactions carry accountType + accountName.
     Imported ("ledger") accounts keep an anchor - a known balance on a date (statement ending balance,
     or one you typed) - and their balance = anchor + every tagged transaction after that date. */
  const BANK_TYPES = ['Checking', 'Savings', 'Cash'];
  const isBankAccount = (a) => a.kind === 'bank' || (!a.kind && BANK_TYPES.includes(a.type));
  const isCardDebt = (d) => d.kind === 'credit' || d.type === 'Credit Card';
  const sameName = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
  const acctTypeOf = (t) => (t.accountType === 'bank' || t.accountType === 'credit' ? t.accountType : null);
  const isMoneyIn = (t) => t.type === 'income' || (t.type === 'transfer' && t.direction === 'in');
  // Signed change to a balance: bank = cash in the account; credit = amount owed on the card.
  const txEffect = (t, kind) => (kind === 'bank' ? 1 : -1) * (isMoneyIn(t) ? 1 : -1) * Math.abs(Number(t.amount) || 0);
  function ledgerBalance(acct, kind, txs) {
    let bal = Number(acct.anchorBalance) || 0;
    for (const t of txs) if (acctTypeOf(t) === kind && sameName(t.accountName, acct.name) && (!acct.anchorDate || t.date > acct.anchorDate)) bal += txEffect(t, kind);
    return round2(bal);
  }
  const balanceNote = (a) => !a.ledger ? '' : a.balanceSource === 'statement' ? `statement balance ${prettyDate(a.anchorDate)}` : a.balanceSource === 'manual' ? `balance set ${prettyDate(a.anchorDate)}` : 'estimated from transactions';
  async function ensureAccount(kind, name, subtype, data) {
    const found = (kind === 'bank' ? data.accounts.filter(isBankAccount) : data.debts.filter(isCardDebt)).find((a) => sameName(a.name, name));
    if (found) return found;
    return DB.put(kind === 'bank' ? 'accounts' : 'debts', kind === 'bank'
      ? { name, type: subtype || 'Checking', balance: 0, kind: 'bank', ledger: true }
      : { name, type: 'Credit Card', balance: 0, apr: 0, minPayment: 0, kind: 'credit', ledger: true });
  }

  // Simple non-cryptographic hash for duplicate detection on import.
  const hashTx = (t) => { const s = `${t.date}|${round2(t.amount)}|${(t.description || '').toLowerCase().trim()}`; let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); };

  /* ------------------------------------------------------------ bills math */
  // Works out which occurrence of a bill is "current" and whether it's paid.
  // A payment made after occurrence N-1 counts toward occurrence N. A bill created
  // after an occurrence isn't treated as owing it. Missed cycles show as overdue.
  // Returns { currentDue, nextDue, paid, daysLeft } (daysLeft < 0 → overdue).
  function billStatus(bill, today = todayISO()) {
    const t = parseISO(today);
    const yearly = bill.frequency === 'yearly';
    const occ = (y, m0) => new Date(y, m0, Math.min(bill.dueDay || 1, daysInMonth(y, m0)));
    const step = (d, n) => (yearly ? occ(d.getFullYear() + n, d.getMonth()) : occ(d.getFullYear(), d.getMonth() + n));
    let next = yearly ? occ(t.getFullYear(), (bill.dueMonth || 1) - 1) : occ(t.getFullYear(), t.getMonth());
    if (next < t) next = step(next, 1);
    const prev = step(next, -1), prev2 = step(next, -2);
    const ref = bill.lastPaid ? parseISO(bill.lastPaid) : bill.createdAt ? parseISO(bill.createdAt.slice(0, 10)) : t;
    const out = (cur, paid) => ({ currentDue: toISO(cur), nextDue: toISO(paid ? step(cur, 1) : cur), paid, daysLeft: daysBetween(today, toISO(cur)) });
    if (ref > prev) return bill.lastPaid ? out(next, true) : out(next, false); // paid for upcoming, or brand-new bill
    if (ref > prev2) return out(next, false);                               // last cycle settled, next one pending
    return out(prev, false);                                                // missed the last cycle → overdue
  }
  const monthlyCost = (bill) => (bill.frequency === 'yearly' ? bill.amount / 12 : bill.amount);

  /* ------------------------------------------------------------ debt payoff */
  // Simulates payoff month by month. strategy: 'avalanche' (highest APR first) | 'snowball' (smallest balance first)
  // Shared with the Advisor tab (advisor-engine.js) so both screens give identical numbers.
  function simulatePayoff(debts, extra = 0, strategy = 'avalanche') {
    const r = AdvisorEngine.payoff(debts, extra, strategy);
    return { months: r.months || 0, interest: r.totalInterest, feasible: r.feasible, order: r.order.filter((o) => o.paidOffMonth).map((o) => ({ id: o.id, name: o.name, month: o.paidOffMonth })) };
  }

  /* ------------------------------------------------------------ app context */
  const AppCtx = createContext(null);
  const useApp = () => useContext(AppCtx);

  function useFinanceData() {
    const [data, setData] = useState({ transactions: [], debts: [], bills: [], budgets: [], accounts: [], settings: {} });
    const [ready, setReady] = useState(false);
    const [error, setError] = useState(null);

    const load = useCallback(async (only) => {
      const names = only ? [].concat(only) : DB.STORES;
      const entries = await Promise.all(names.map(async (n) => [n, await DB.getAll(n)]));
      setData((prev) => {
        const next = { ...prev };
        for (const [n, rows] of entries) next[n] = n === 'settings' ? Object.fromEntries(rows.map((r) => [r.key, r.value])) : rows;
        return next;
      });
    }, []);

    useEffect(() => { load().then(() => setReady(true)).catch((e) => { setError(e.message); setReady(true); }); }, [load]);

    const actions = useMemo(() => ({
      reload: load,
      save: async (store, obj) => { const r = await DB.put(store, obj); await load(store); return r; },
      remove: async (store, key) => { await DB.delete(store, key); await load(store); },
      bulk: async (store, arr) => { const n = await DB.bulkPut(store, arr); await load(store); return n; },
      setSetting: async (k, v) => { await DB.setSetting(k, v); await load('settings'); },
    }), [load]);

    return { data, ready, error, ...actions };
  }

  /* --------------------------------------------------------------- icons */
  // Renders Lucide icon nodes (from the UMD build) as React SVG elements.
  const camel = (k) => k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  function Icon({ name, size = 20, strokeWidth = 2, className = '' }) {
    const node = (window.lucide && (lucide.icons?.[name] || lucide[name]));
    if (!node) return <span style={{ width: size, height: size, display: 'inline-block' }} />;
    const children = node[0] === 'svg' ? node[2] : node;
    return (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
        {children.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...Object.fromEntries(Object.entries(attrs).map(([k, v]) => [camel(k), v])) }))}
      </svg>
    );
  }

  /* ------------------------------------------------------- UI primitives */
  const Card = ({ className = '', children, ...p }) => (
    <div className={cls('rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 shadow-sm', className)} {...p}>{children}</div>
  );
  const SectionTitle = ({ children, action }) => (
    <div className="flex items-center justify-between px-1 mb-2 mt-6">
      <h2 className="text-[13px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">{children}</h2>
      {action}
    </div>
  );
  const Button = ({ variant = 'primary', className = '', children, ...p }) => {
    const styles = {
      primary: 'bg-brand-600 text-white active:bg-brand-700 disabled:opacity-50',
      secondary: 'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-100 active:bg-slate-200 dark:active:bg-slate-700',
      danger: 'bg-rose-600 text-white active:bg-rose-700',
      ghost: 'text-brand-700 dark:text-brand-400 active:bg-slate-100 dark:active:bg-slate-800',
    };
    return <button className={cls('inline-flex items-center justify-center gap-2 rounded-xl px-4 h-11 text-[15px] font-semibold transition-colors', styles[variant], className)} {...p}>{children}</button>;
  };
  const Field = ({ label, hint, children }) => (
    <label className="block">
      <span className="block text-[13px] font-medium text-slate-600 dark:text-slate-300 mb-1.5">{label}</span>
      {children}
      {hint && <span className="block text-xs text-slate-500 mt-1">{hint}</span>}
    </label>
  );
  const inputCls = 'w-full h-11 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-3 outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500';
  const Input = (p) => <input className={inputCls} {...p} />;
  const Select = ({ options, ...p }) => (
    <select className={inputCls} {...p}>{options.map((o) => typeof o === 'string' ? <option key={o} value={o}>{o}</option> : <option key={o.value} value={o.value}>{o.label}</option>)}</select>
  );
  const Segmented = ({ value, onChange, options }) => (
    <div className="grid rounded-xl bg-slate-200/70 dark:bg-slate-800 p-1" style={{ gridTemplateColumns: `repeat(${options.length}, 1fr)` }}>
      {options.map((o) => (
        <button key={o.value} type="button" onClick={() => onChange(o.value)}
          className={cls('h-9 rounded-lg text-sm font-semibold transition-colors', value === o.value ? 'bg-white dark:bg-slate-950 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400')}>
          {o.label}
        </button>
      ))}
    </div>
  );
  const Progress = ({ value }) => {
    const pct = Math.min(100, Math.max(0, value * 100));
    const color = value > 1 ? 'bg-rose-500' : value > 0.85 ? 'bg-amber-500' : 'bg-brand-500';
    return <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden"><div className={cls('h-full rounded-full', color)} style={{ width: `${pct}%` }} /></div>;
  };
  const Empty = ({ icon, title, body, action }) => (
    <div className="text-center py-10 px-6">
      <div className="mx-auto mb-3 w-12 h-12 rounded-2xl grid place-items-center bg-slate-100 dark:bg-slate-800 text-slate-500"><Icon name={icon} size={22} /></div>
      <p className="font-semibold">{title}</p>
      {body && <p className="text-sm text-slate-500 mt-1">{body}</p>}
      {action && <div className="mt-4">{action}</div>}
    </div>
  );

  function Sheet({ open, title, onClose, children }) {
    useEffect(() => {
      if (!open) return;
      const onKey = (e) => e.key === 'Escape' && onClose();
      document.addEventListener('keydown', onKey);
      document.body.style.overflow = 'hidden';
      return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
    }, [open, onClose]);
    if (!open) return null;
    return (
      <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={title}>
        <div className="absolute inset-0 bg-slate-950/50 fade" onClick={onClose} />
        <div className="sheet relative w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl bg-white dark:bg-slate-900 pb-safe">
          <div className="sticky top-0 z-10 bg-white/95 dark:bg-slate-900/95 backdrop-blur px-5 pt-3 pb-3 border-b border-slate-100 dark:border-slate-800">
            <div className="mx-auto mb-3 h-1.5 w-10 rounded-full bg-slate-300 dark:bg-slate-700" />
            <div className="flex items-center justify-between">
              <h3 className="text-lg font-bold">{title}</h3>
              <button onClick={onClose} className="w-9 h-9 grid place-items-center rounded-full bg-slate-100 dark:bg-slate-800" aria-label="Close"><Icon name="X" size={18} /></button>
            </div>
          </div>
          <div className="px-5 py-4">{children}</div>
        </div>
      </div>
    );
  }

  function Toast({ toast }) {
    if (!toast) return null;
    return (
      <div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] fade pb-safe">
        <div className={cls('px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium text-white', toast.kind === 'error' ? 'bg-rose-600' : 'bg-slate-900 dark:bg-slate-700')}>{toast.msg}</div>
      </div>
    );
  }

  /* --------------------------------------------------------- derived data */
  function useSummary() {
    const { data } = useApp();
    return useMemo(() => {
      const mk = monthKey(todayISO());
      const monthTx = data.transactions.filter((t) => monthKey(t.date) === mk);
      const income = monthTx.filter((t) => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const expense = monthTx.filter((t) => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const assets = data.accounts.reduce((s, a) => s + (Number(a.balance) || 0), 0);
      const liabilities = data.debts.reduce((s, d) => s + (Number(d.balance) || 0), 0);
      const bankAccts = data.accounts.filter(isBankAccount), cards = data.debts.filter(isCardDebt);
      const bankBalance = bankAccts.reduce((s, a) => s + (Number(a.balance) || 0), 0);
      const cardOwed = cards.reduce((s, d) => s + (Number(d.balance) || 0), 0);
      const subs = data.bills.filter((b) => b.active !== false && b.isSubscription);
      const subsMonthly = subs.reduce((s, b) => s + monthlyCost(b), 0);
      const byCat = {};
      monthTx.filter((t) => t.type === 'expense').forEach((t) => { byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
      const topCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
      const upcoming = data.bills.filter((b) => b.active !== false).map((b) => ({ ...b, st: billStatus(b) }))
        .filter((b) => !b.st.paid && b.st.daysLeft <= 14).sort((a, b) => a.st.daysLeft - b.st.daysLeft);
      return { mk, income, expense, net: income - expense, assets, liabilities, netWorth: assets - liabilities, subs, subsMonthly, topCats, upcoming, monthTx, bankAccts, cards, bankBalance, cardOwed, netBalance: bankBalance - cardOwed };
    }, [data]);
  }

  /* ============================================================ DASHBOARD */
  function SummaryCard({ icon, label, value, sub, tone = 'slate', onClick }) {
    const tones = {
      slate: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200',
      green: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400',
      red: 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-400',
      violet: 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-400',
      sky: 'bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-400',
    };
    return (
      <Card className="p-4 text-left active:scale-[.98] transition-transform cursor-pointer" onClick={onClick} role="button" tabIndex={0}>
        <div className={cls('w-9 h-9 rounded-xl grid place-items-center mb-3', tones[tone])}><Icon name={icon} size={18} /></div>
        <p className="text-xs font-medium text-slate-500 dark:text-slate-400">{label}</p>
        <p className="num text-[22px] leading-7 font-bold tracking-tight mt-0.5 truncate">{value}</p>
        {sub && <p className="text-xs leading-snug text-slate-500 mt-1 whitespace-pre-line">{sub}</p>}
      </Card>
    );
  }

  function Dashboard({ go }) {
    const { data, fmt, loadSample } = useApp();
    const s = useSummary();
    const savingsRate = s.income > 0 ? Math.round((s.net / s.income) * 100) : null;
    const recent = [...data.transactions].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 5);
    const isEmpty = !data.transactions.length && !data.accounts.length && !data.debts.length && !data.bills.length;

    return (
      <div>
        <header className="flex items-center justify-between pt-2">
          <div>
            <p className="text-sm text-slate-500">{monthLabel(s.mk)}</p>
            <h1 className="text-2xl font-bold tracking-tight">Overview</h1>
          </div>
          <span className="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-300">
            <Icon name="ShieldCheck" size={14} /> On-device
          </span>
        </header>

        {isEmpty && (
          <Card className="mt-4 p-4 border-dashed">
            <p className="font-semibold">Welcome to Centric Wealth</p>
            <p className="text-sm text-slate-500 mt-1">Everything you enter is stored in this browser only. Import a bank CSV, add entries by hand, or explore with sample data.</p>
            <div className="flex gap-2 mt-3">
              <Button className="flex-1" onClick={() => go('upload')}><Icon name="Upload" size={16} />Import</Button>
              <Button variant="secondary" className="flex-1" onClick={loadSample}>Try sample</Button>
            </div>
          </Card>
        )}

        <Card className="mt-4 p-4">
          <div className="flex items-baseline justify-between">
            <p className="text-xs font-medium text-slate-500 dark:text-slate-400">Combined net balance</p>
            <p className="text-[11px] text-slate-400">bank cash − card debt</p>
          </div>
          <p className={cls('num text-3xl font-bold tracking-tight mt-0.5', s.netBalance < 0 && 'text-rose-600 dark:text-rose-400')}>{fmt(s.netBalance)}</p>
          {(s.bankBalance > 0 || s.cardOwed > 0) && <>
            <div className="mt-3 h-2.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden flex">
              <div className="bg-sky-500" style={{ width: `${(Math.max(0, s.bankBalance) / (Math.max(0, s.bankBalance) + Math.max(0, s.cardOwed))) * 100}%` }} />
              <div className="bg-rose-400" style={{ width: `${(Math.max(0, s.cardOwed) / (Math.max(0, s.bankBalance) + Math.max(0, s.cardOwed))) * 100}%` }} />
            </div>
            <div className="flex justify-between text-xs text-slate-500 mt-2">
              <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-sky-500 inline-block" />Bank {fmt(s.bankBalance, true)}</span>
              <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-rose-400 inline-block" />Cards {fmt(s.cardOwed, true)}</span>
            </div>
          </>}
        </Card>
        <div className="grid grid-cols-2 gap-3 mt-3">
          <SummaryCard icon="Landmark" tone="sky" label="Bank Balance" value={fmt(s.bankBalance)} sub={`Liquid cash · ${s.bankAccts.length} account${s.bankAccts.length === 1 ? '' : 's'}${s.bankAccts.some((a) => a.ledger && a.balanceSource === 'estimated') ? '\nincludes estimates' : ''}`} onClick={() => go('budget', 'assets')} />
          <SummaryCard icon="CreditCard" tone="red" label="Credit Card Owed" value={fmt(s.cardOwed)} sub={`${s.cards.length} card${s.cards.length === 1 ? '' : 's'}${s.cards.some((c) => c.ledger && c.balanceSource === 'estimated') ? '\nincludes estimates' : ''}`} onClick={() => go('budget', 'debt')} />
        </div>

        <div className="grid grid-cols-2 gap-3 mt-3">
          <SummaryCard icon="Scale" label="Net Worth" value={fmt(s.netWorth)} sub={`${fmt(s.assets, true)} assets\n${fmt(s.liabilities, true)} debt`} onClick={() => go('budget', 'assets')} />
          <SummaryCard icon="TrendingUp" tone="green" label="Monthly Income" value={fmt(s.income)} sub={(() => { const n = s.monthTx.filter((t) => t.type === 'income').length; return `${n} deposit${n === 1 ? '' : 's'}`; })()} onClick={() => go('transactions')} />
          <SummaryCard icon="TrendingDown" tone="red" label="Monthly Expense" value={fmt(s.expense)} sub={savingsRate != null ? `Saving ${savingsRate}% of income` : 'No income logged yet'} onClick={() => go('transactions')} />
          <SummaryCard icon="Repeat" tone="violet" label="Active Subscriptions" value={String(s.subs.length)} sub={`${fmt(s.subsMonthly)}/mo\n${fmt(s.subsMonthly * 12, true)}/yr`} onClick={() => go('budget', 'bills')} />
        </div>

        <Card className="mt-3 p-4">
          <div className="flex items-baseline justify-between">
            <p className="text-sm font-medium text-slate-500">Cash flow this month</p>
            <p className={cls('num font-bold', s.net >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400')}>{s.net >= 0 ? '+' : ''}{fmt(s.net)}</p>
          </div>
          <div className="mt-3 h-3 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden flex">
            {(s.income + s.expense) > 0 && <>
              <div className="bg-emerald-500" style={{ width: `${(s.income / (s.income + s.expense)) * 100}%` }} />
              <div className="bg-rose-400" style={{ width: `${(s.expense / (s.income + s.expense)) * 100}%` }} />
            </>}
          </div>
          <div className="flex justify-between text-xs text-slate-500 mt-2">
            <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-emerald-500 inline-block" />In {fmt(s.income, true)}</span>
            <span className="inline-flex items-center gap-1"><i className="w-2 h-2 rounded-full bg-rose-400 inline-block" />Out {fmt(s.expense, true)}</span>
          </div>
        </Card>

        <RecurringCard />

        <SectionTitle action={<button className="text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('budget', 'bills')}>All bills</button>}>Due soon</SectionTitle>
        <Card className="divide-y divide-slate-100 dark:divide-slate-800">
          {s.upcoming.length === 0 ? <p className="p-4 text-sm text-slate-500">Nothing due in the next 14 days.</p> :
            s.upcoming.slice(0, 4).map((b) => (
              <div key={b.id} className="flex items-center gap-3 p-3.5">
                <div className={cls('w-10 h-10 rounded-xl grid place-items-center', b.st.daysLeft <= 2 ? 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-400' : 'bg-slate-100 dark:bg-slate-800 text-slate-500')}>
                  <Icon name={b.isSubscription ? 'Repeat' : 'Receipt'} size={18} />
                </div>
                <div className="flex-1 min-w-0">
                  <p className="font-medium truncate">{b.name}</p>
                  <p className="text-xs text-slate-500">{b.st.daysLeft < 0 ? `${-b.st.daysLeft}d overdue` : prettyDate(b.st.currentDue)}</p>
                </div>
                <p className="num font-semibold">{fmt(b.amount)}</p>
              </div>
            ))}
        </Card>

        <SpendingBreakdown />

        <SectionTitle action={<button className="text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('transactions')}>See all</button>}>Recent</SectionTitle>
        <Card className="divide-y divide-slate-100 dark:divide-slate-800">
          {recent.length === 0 ? <p className="p-4 text-sm text-slate-500">No transactions yet.</p> : recent.map((t) => <TxRow key={t.id} t={t} />)}
        </Card>
      </div>
    );
  }

  /* ======================================= SPENDING BY ACCOUNT TYPE */
  const ACCOUNT_FILTERS = [{ value: 'all', label: 'All' }, { value: 'bank', label: 'Bank Accounts' }, { value: 'credit', label: 'Credit Cards' }];
  const SEG_COLOR = { credit: 'bg-violet-500', bank: 'bg-sky-500', other: 'bg-slate-400 dark:bg-slate-500' };

  function SpendingBreakdown() {
    const { data, fmt } = useApp();
    const [month, setMonth] = useState(monthKey(todayISO()));
    const [view, setView] = useState('all');
    const agg = useMemo(() => {
      const by = {}; const tot = { bank: 0, credit: 0, other: 0 };
      data.transactions.filter((t) => t.type === 'expense' && monthKey(t.date) === month).forEach((t) => {
        const k = acctTypeOf(t) || 'other';
        const c = (by[t.category] ||= { bank: 0, credit: 0, other: 0 });
        c[k] += t.amount; tot[k] += t.amount;
      });
      return { cats: Object.entries(by).map(([cat, v]) => ({ cat, ...v, total: v.bank + v.credit + v.other })), tot };
    }, [data.transactions, month]);
    const val = (c) => (view === 'all' ? c.total : c[view]);
    const rows = agg.cats.filter((c) => val(c) > 0.004).sort((a, b) => val(b) - val(a));
    const max = rows.length ? val(rows[0]) : 1;
    const all = agg.tot.bank + agg.tot.credit + agg.tot.other;
    const share = (k) => (all > 0 ? Math.round((agg.tot[k] / all) * 100) : 0);

    return (
      <>
        <SectionTitle action={<div className="flex items-center gap-1">
          <button className="w-7 h-7 grid place-items-center rounded-lg text-slate-500" onClick={() => setMonth(addMonths(month, -1))} aria-label="Previous month"><Icon name="ChevronLeft" size={16} /></button>
          <span className="text-xs font-semibold text-slate-600 dark:text-slate-300 w-[72px] text-center">{monthLabel(month, { month: 'short', year: 'numeric' })}</span>
          <button className="w-7 h-7 grid place-items-center rounded-lg text-slate-500" onClick={() => setMonth(addMonths(month, 1))} aria-label="Next month"><Icon name="ChevronRight" size={16} /></button>
        </div>}>Spending by account</SectionTitle>
        <Card className="p-4">
          <Segmented value={view} onChange={setView} options={ACCOUNT_FILTERS} />
          <div className="grid grid-cols-2 gap-2 mt-3">
            <div className="rounded-xl bg-violet-50 dark:bg-violet-500/10 p-3"><p className="text-xs text-violet-700 dark:text-violet-300 inline-flex items-center gap-1"><Icon name="CreditCard" size={13} />Credit cards</p><p className="num font-bold">{fmt(agg.tot.credit)}</p><p className="text-[11px] text-slate-500">{share('credit')}% of spending</p></div>
            <div className="rounded-xl bg-sky-50 dark:bg-sky-500/10 p-3"><p className="text-xs text-sky-700 dark:text-sky-300 inline-flex items-center gap-1"><Icon name="Landmark" size={13} />Bank accounts</p><p className="num font-bold">{fmt(agg.tot.bank)}</p><p className="text-[11px] text-slate-500">{share('bank')}% of spending</p></div>
          </div>
          {agg.tot.other > 0.004 && <p className="text-xs text-slate-500 mt-2">Plus {fmt(agg.tot.other)} not linked to an account (manual entries).</p>}
          <div className="mt-4 space-y-3">
            {rows.length === 0 ? <p className="text-sm text-slate-500">No {view === 'bank' ? 'bank ' : view === 'credit' ? 'credit card ' : ''}spending in {monthLabel(month, { month: 'long' })}.</p> :
              rows.slice(0, 8).map((c) => (
                <div key={c.cat}>
                  <div className="flex justify-between text-sm mb-1"><span>{c.cat}</span><span className="num font-medium">{fmt(val(c))}</span></div>
                  <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden flex">
                    {(view === 'all' ? ['credit', 'bank', 'other'] : [view]).map((k) => c[k] > 0 && <div key={k} className={SEG_COLOR[k]} style={{ width: `${(c[k] / max) * 100}%` }} />)}
                  </div>
                  {view === 'all' && c.credit > 0 && c.bank > 0 && <p className="num text-[11px] text-slate-500 mt-1">Cards {fmt(c.credit)} · Bank {fmt(c.bank)}</p>}
                </div>
              ))}
          </div>
        </Card>
      </>
    );
  }

  /* ================================================= RECURRING CHARGES */
  const CADENCE_LABEL = { weekly: 'Weekly', biweekly: 'Every 2 weeks', monthly: 'Monthly', bimonthly: 'Every 2 months', quarterly: 'Quarterly', semiannual: 'Every 6 months', yearly: 'Yearly' };
  const FLAG_STYLE = {
    danger: 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300',
    warn: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300',
    info: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300',
  };

  function RecurringRow({ item }) {
    const { fmt, recurringAction } = useApp();
    const [busy, setBusy] = useState(false);
    const act = async (a) => { setBusy(true); await recurringAction(a, item); setBusy(false); };
    const cancelled = item.status === 'cancelled';
    const sub = item.kind === 'subscription';
    return (
      <div className={cls('p-3.5', cancelled && !item.flags.some((f) => f.severity === 'danger') && 'opacity-60')}>
        <div className="flex items-start gap-3">
          <div className={cls('w-10 h-10 rounded-xl grid place-items-center shrink-0', sub ? 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300' : 'bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300')}>
            <Icon name={sub ? 'Repeat' : item.kind === 'bill' ? 'Receipt' : 'CalendarClock'} size={18} />
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex items-baseline justify-between gap-2">
              <p className={cls('font-medium truncate', cancelled && 'line-through decoration-slate-400')}>{item.merchant}</p>
              <p className="num font-semibold shrink-0">{fmt(item.lastAmount)}</p>
            </div>
            <p className="text-xs text-slate-500 mt-0.5">
              {CADENCE_LABEL[item.cadence]} · {cancelled ? `cancelled ${prettyDate(item.decidedAt)}` : item.active ? `next ${prettyDate(item.nextDue)}` : `last ${prettyDate(item.lastDate)}`}
              {item.confidence === 'low' ? ' · possible' : ` · ${item.occurrences} charges`}
            </p>
            {item.flags.length > 0 && (
              <div className="flex flex-wrap gap-1.5 mt-2">
                {item.flags.map((f) => <span key={f.code} className={cls('text-[11px] font-medium px-2 py-0.5 rounded-md', FLAG_STYLE[f.severity])}>{f.message}</span>)}
              </div>
            )}
          </div>
        </div>
        <div className={cls('flex gap-2 mt-3', item.status !== 'new' && 'pl-[52px]')}>
          {item.status === 'new' && <>
            <Button variant="secondary" className="!h-9 !px-3 !text-sm flex-1 whitespace-nowrap" disabled={busy} onClick={() => act('keep')}><Icon name="Check" size={15} className="shrink-0" />Keep</Button>
            <Button variant="secondary" className="!h-9 !px-2 !text-sm flex-[1.4] whitespace-nowrap !text-rose-600 dark:!text-rose-400" disabled={busy} onClick={() => act('cancel')}><Icon name="Ban" size={15} className="shrink-0" />Mark as Cancelled</Button>
          </>}
          {item.status === 'kept' && <>
            <span className="text-xs font-semibold text-emerald-700 dark:text-emerald-400 inline-flex items-center gap-1 mr-auto"><Icon name="CircleCheck" size={14} />Kept{item.billId ? ' · in Bills' : ''}</span>
            <button className="text-xs font-semibold text-rose-600 dark:text-rose-400" disabled={busy} onClick={() => act('cancel')}>Mark as Cancelled</button>
          </>}
          {cancelled && <>
            <span className="text-xs font-semibold text-slate-500 mr-auto">Saves {fmt(item.annualCost)}/yr</span>
            <button className="text-xs font-semibold text-brand-700 dark:text-brand-400" disabled={busy} onClick={() => act('undo')}>Undo</button>
          </>}
        </div>
      </div>
    );
  }

  function RecurringCard() {
    const { recurring, fmt, go } = useApp();
    const [open, setOpen] = useState(false);
    if (!recurring) return null;
    const { items, summary } = recurring;
    const review = items.filter((i) => i.status === 'new' || i.flags.some((f) => f.severity === 'danger'));
    const kept = items.filter((i) => i.status === 'kept' && !review.includes(i));
    const cancelled = items.filter((i) => i.status === 'cancelled' && !review.includes(i));
    const preview = review.slice(0, 3);

    return (
      <>
        <SectionTitle action={items.length > 0 && <button className="text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => setOpen(true)}>See all ({items.length})</button>}>Subscriptions & bills</SectionTitle>
        <Card className="overflow-hidden">
          <div className="p-4 border-b border-slate-100 dark:border-slate-800">
            <div className="flex items-baseline justify-between">
              <p className="num text-xl font-bold">{fmt(summary.monthlyTotal)}<span className="text-sm font-medium text-slate-500">/mo recurring</span></p>
              {summary.needsReview > 0 && <span className="text-xs font-semibold px-2 py-1 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300">{summary.needsReview} to review</span>}
            </div>
            <p className="text-xs text-slate-500 mt-1">
              {summary.subscriptions} subscription{summary.subscriptions === 1 ? '' : 's'} · {summary.bills} bill{summary.bills === 1 ? '' : 's'} · {fmt(summary.annualTotal, true)}/yr
              {summary.cancelledSavingsAnnual > 0 && <span className="text-emerald-600 dark:text-emerald-400"> · saving {fmt(summary.cancelledSavingsAnnual)}/yr</span>}
            </p>
          </div>
          {items.length === 0 ? (
            <p className="p-4 text-sm text-slate-500">No repeating charges found yet. Import a couple of months of statements and subscriptions will show up here. <button className="font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('upload')}>Import</button></p>
          ) : preview.length === 0 ? (
            <p className="p-4 text-sm text-slate-500 flex items-center gap-2"><Icon name="CircleCheck" size={16} className="text-emerald-600" />All recurring charges reviewed.</p>
          ) : (
            <div className="divide-y divide-slate-100 dark:divide-slate-800">{preview.map((i) => <RecurringRow key={i.key} item={i} />)}</div>
          )}
          {review.length > preview.length && <button className="w-full p-3 text-sm font-semibold text-brand-700 dark:text-brand-400 border-t border-slate-100 dark:border-slate-800" onClick={() => setOpen(true)}>Review {review.length - preview.length} more</button>}
        </Card>

        <Sheet open={open} title="Subscriptions & bills" onClose={() => setOpen(false)}>
          <p className="text-sm text-slate-500 -mt-1 mb-2">Found by looking for the same merchant charging a similar amount on a regular schedule. Everything is worked out on this device.</p>
          {[['Needs review', review], ['Kept', kept], ['Cancelled', cancelled]].filter(([, l]) => l.length).map(([title, list]) => (
            <div key={title}>
              <SectionTitle>{title} · {list.length}</SectionTitle>
              <Card className="divide-y divide-slate-100 dark:divide-slate-800">{list.map((i) => <RecurringRow key={i.key} item={i} />)}</Card>
            </div>
          ))}
        </Sheet>
      </>
    );
  }

  /* ========================================================= TRANSACTIONS */
  function TxRow({ t, onClick }) {
    const { fmt } = useApp();
    const moneyIn = isMoneyIn(t), transfer = t.type === 'transfer', income = t.type === 'income', card = acctTypeOf(t) === 'credit';
    const icon = transfer ? 'ArrowLeftRight' : income ? 'ArrowDownLeft' : card ? 'CreditCard' : 'ArrowUpRight';
    const tone = income ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400'
      : transfer ? 'bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300'
      : card ? 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300';
    return (
      <button onClick={onClick} className="w-full flex items-center gap-3 p-3.5 text-left active:bg-slate-50 dark:active:bg-slate-800/50">
        <div className={cls('w-10 h-10 rounded-xl grid place-items-center shrink-0', tone)}><Icon name={icon} size={18} /></div>
        <div className="flex-1 min-w-0">
          <p className="font-medium truncate">{t.description || t.category}</p>
          <p className="text-xs text-slate-500 truncate">{[t.category, t.accountName, prettyDate(t.date)].filter(Boolean).join(' · ')}</p>
        </div>
        <p className={cls('num font-semibold', income && 'text-emerald-600 dark:text-emerald-400', transfer && 'text-slate-500 dark:text-slate-400')}>{moneyIn ? '+' : '−'}{fmt(t.amount)}</p>
      </button>
    );
  }

  function TxForm({ initial, onDone }) {
    const { data, save, remove, toast } = useApp();
    const [f, setF] = useState(() => initial || { type: 'expense', amount: '', category: 'Groceries', date: todayISO(), description: '', accountType: null, accountName: '' });
    const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target ? e.target.value : e }));
    const credit = f.accountType === 'credit';
    const cats = f.type === 'income' ? INCOME_CATEGORIES : f.type === 'transfer' ? TRANSFER_CATEGORIES : EXPENSE_CATEGORIES;
    useEffect(() => { if (!cats.includes(f.category)) setF((p) => ({ ...p, category: p.type === 'transfer' && credit ? 'Card Payment' : cats[0] })); }, [f.type, f.accountType]);
    const acctOptions = [{ value: '', label: 'No account (cash / other)' },
      ...data.accounts.filter(isBankAccount).map((a) => ({ value: `bank|${a.name}`, label: `${a.name} · bank` })),
      ...data.debts.filter(isCardDebt).map((d) => ({ value: `credit|${d.name}`, label: `${d.name} · card` }))];
    const acctValue = f.accountType ? `${f.accountType}|${f.accountName}` : '';
    const pickAccount = (e) => {
      const [kind, ...rest] = e.target.value.split('|');
      setF((p) => ({ ...p, accountType: kind || null, accountName: rest.join('|'), ...(kind === 'credit' && p.type === 'income' ? { type: 'transfer', direction: 'in' } : {}) }));
    };
    // On a credit card: charges raise what you owe; payments and refunds are balance adjustments that lower it.
    const typeOptions = credit
      ? [{ value: 'expense', label: 'Charge' }, { value: 'transfer', label: 'Payment / Credit' }]
      : [{ value: 'expense', label: 'Expense' }, { value: 'income', label: 'Income' }, { value: 'transfer', label: 'Transfer' }];
    const submit = async (e) => {
      e.preventDefault();
      const amount = round2(Math.abs(parseAmount(f.amount)));
      if (!amount) return toast('Enter an amount', 'error');
      const direction = f.type === 'expense' ? 'out' : f.type === 'income' ? 'in' : credit ? 'in' : (f.direction || 'out');
      const rec = { ...f, amount, direction, accountType: f.accountType || null, accountName: f.accountName || '', source: f.source || 'manual' };
      rec.hash = hashTx(rec);
      await save('transactions', rec);
      toast(initial ? 'Transaction updated' : 'Transaction added');
      onDone();
    };
    return (
      <form onSubmit={submit} className="space-y-4">
        <Field label="Account"><Select options={acctOptions} value={acctOptions.some((o) => o.value === acctValue) ? acctValue : ''} onChange={pickAccount} /></Field>
        <Segmented value={f.type} onChange={set('type')} options={typeOptions} />
        {f.type === 'transfer' && !credit && <Field label="Direction"><Select options={[{ value: 'out', label: 'Out of this account' }, { value: 'in', label: 'Into this account' }]} value={f.direction || 'out'} onChange={set('direction')} /></Field>}
        <Field label="Amount"><Input inputMode="decimal" placeholder="0.00" value={f.amount} onChange={set('amount')} autoFocus={!initial} /></Field>
        <Field label="Description"><Input placeholder="e.g. Farmers market" value={f.description} onChange={set('description')} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Category"><Select options={cats.includes(f.category) ? cats : [f.category, ...cats]} value={f.category} onChange={set('category')} /></Field>
          <Field label="Date"><Input type="date" value={f.date} onChange={set('date')} /></Field>
        </div>
        <Button type="submit" className="w-full">{initial ? 'Save changes' : 'Add transaction'}</Button>
        {initial && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={async () => { if (confirm('Delete this transaction?')) { await remove('transactions', initial.id); toast('Deleted'); onDone(); } }}><Icon name="Trash2" size={16} />Delete</Button>}
      </form>
    );
  }

  function Transactions() {
    const { data, fmt } = useApp();
    const [month, setMonth] = useState(monthKey(todayISO()));
    const [q, setQ] = useState('');
    const [type, setType] = useState('all');
    const [acct, setAcct] = useState('all');
    const [editing, setEditing] = useState(null); // null | 'new' | tx

    const list = useMemo(() => data.transactions
      .filter((t) => monthKey(t.date) === month)
      .filter((t) => type === 'all' || t.type === type)
      .filter((t) => acct === 'all' || acctTypeOf(t) === acct)
      .filter((t) => !q || `${t.description} ${t.category} ${t.accountName || ''}`.toLowerCase().includes(q.toLowerCase()))
      .sort((a, b) => b.date.localeCompare(a.date)), [data.transactions, month, q, type, acct]);
    const groups = useMemo(() => list.reduce((g, t) => ((g[t.date] ||= []).push(t), g), {}), [list]);
    const totIn = list.filter((t) => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const totOut = list.filter((t) => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

    return (
      <div>
        <header className="flex items-center justify-between pt-2">
          <h1 className="text-2xl font-bold tracking-tight">Transactions</h1>
          <Button className="!h-10 !px-3" onClick={() => setEditing('new')} aria-label="Add transaction"><Icon name="Plus" size={18} />Add</Button>
        </header>

        <div className="flex items-center justify-between mt-4">
          <button className="w-10 h-10 grid place-items-center rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800" onClick={() => setMonth(addMonths(month, -1))} aria-label="Previous month"><Icon name="ChevronLeft" /></button>
          <div className="text-center">
            <p className="font-semibold">{monthLabel(month)}</p>
            <p className="num text-xs text-slate-500"><span className="text-emerald-600 dark:text-emerald-400">+{fmt(totIn, true)}</span> · −{fmt(totOut, true)}{list.some((t) => t.type === 'transfer') ? ' · transfers excluded' : ''}</p>
          </div>
          <button className="w-10 h-10 grid place-items-center rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800" onClick={() => setMonth(addMonths(month, 1))} aria-label="Next month"><Icon name="ChevronRight" /></button>
        </div>

        <div className="relative mt-3">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="Search" size={18} /></span>
          <input className={cls(inputCls, 'pl-10')} placeholder="Search description, category or account" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <div className="mt-3"><Segmented value={acct} onChange={setAcct} options={ACCOUNT_FILTERS} /></div>
        <div className="mt-2"><Segmented value={type} onChange={setType} options={[{ value: 'all', label: 'All types' }, { value: 'expense', label: acct === 'credit' ? 'Charges' : 'Expenses' }, { value: 'income', label: 'Income' }, { value: 'transfer', label: acct === 'credit' ? 'Payments' : 'Transfers' }]} /></div>

        {list.length === 0 ? <Empty icon="Receipt" title="No transactions" body="Nothing matches this month and filter." action={<Button variant="secondary" onClick={() => setEditing('new')}>Add one</Button>} /> :
          Object.entries(groups).map(([date, items]) => (
            <div key={date}>
              <SectionTitle>{prettyDate(date)}</SectionTitle>
              <Card className="divide-y divide-slate-100 dark:divide-slate-800 overflow-hidden">
                {items.map((t) => <TxRow key={t.id} t={t} onClick={() => setEditing(t)} />)}
              </Card>
            </div>
          ))}

        <Sheet open={!!editing} title={editing === 'new' ? 'New transaction' : 'Edit transaction'} onClose={() => setEditing(null)}>
          {editing && <TxForm initial={editing === 'new' ? null : { ...editing, amount: String(editing.amount) }} onDone={() => setEditing(null)} />}
        </Sheet>
      </div>
    );
  }

  /* =============================================================== UPLOAD */
  const KIND_INFO = {
    bank: { title: 'Bank Statement', sub: 'Checking or savings', icon: 'Landmark', placeholder: 'e.g. Chase Checking',
      how: 'Deposits count as income, withdrawals as expenses. Transfers between your accounts and payments to credit cards are kept separate so nothing is counted twice.' },
    credit: { title: 'Credit Card Statement', sub: 'Any card issuer', icon: 'CreditCard', placeholder: 'e.g. Amex Gold',
      how: 'Purchases count as expenses and add to what you owe. Payments and refunds are balance adjustments that reduce the card balance; they are not income.' },
  };
  const UPLOAD_ERRORS = { PDF_NO_TEXT: 'scanned', PDF_PASSWORD: 'password' };

  function UploadView() {
    const { data, toast, reload, fmt, go } = useApp();
    const [kind, setKind] = useState('bank');
    const [name, setName] = useState('');
    const [subtype, setSubtype] = useState('Checking');
    const [job, setJob] = useState(null);       // { file, report } | { file, error }
    const [password, setPassword] = useState('');
    const [balance, setBalance] = useState('');
    const [busy, setBusy] = useState(false);
    const [result, setResult] = useState(null);
    const fileRef = useRef();
    const [gmailFile, setGmailFile] = useState(null);

    const existing = kind === 'bank' ? data.accounts.filter(isBankAccount) : data.debts.filter(isCardDebt);
    const accountName = name.trim() || (kind === 'bank' ? subtype : 'Credit Card');
    const known = existing.find((a) => sameName(a.name, accountName));

    const parse = async (file, pw) => {
      setBusy(true); setResult(null);
      try {
        const report = await StatementParser.parseStatementDetailed(file, { persist: false, accountType: kind, accountName, password: pw || undefined });
        setJob({ file, report });
        setBalance(report.meta.endingBalance != null ? String(report.meta.endingBalance) : '');
      } catch (e) { setJob({ file, error: e }); }
      setBusy(false);
    };
    // A statement attachment from Gmail: set its type and label first, then read it like a picked file.
    const importFromGmail = (file, k, label) => { setKind(k); setName(label); setGmailFile(file); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    useEffect(() => { if (gmailFile) { const f = gmailFile; setGmailFile(null); setPassword(''); parse(f); } }, [gmailFile]);

    // Signs depend on the statement type, so re-read the file if the user switches type.
    useEffect(() => { if (job && job.report) parse(job.file, password); }, [kind]);

    const handleFile = async (file) => {
      if (!file) return;
      if (file.name.toLowerCase().endsWith('.json')) {
        try {
          const json = JSON.parse(await file.text());
          const replace = confirm('Restore backup?\n\nOK = replace all current data\nCancel = merge into current data');
          const n = await DB.importAll(json, { replace });
          await reload(); toast(`Restored ${n} records`);
        } catch (e) { toast(e.message, 'error'); }
        return;
      }
      setPassword(''); parse(file);
    };

    // Preview: how each row will be stored, and which are already imported into this account.
    const preview = useMemo(() => {
      if (!job || !job.report) return null;
      const have = new Map();
      data.transactions.filter((t) => sameName(t.accountName, accountName)).forEach((t) => { const b = String(t.hash || '').split('#')[0]; have.set(b, (have.get(b) || 0) + 1); });
      const seen = new Map();
      const rows = job.report.transactions.map((t) => {
        const b = StatementParser.hashTx(t.date, Math.abs(t.amount), t.description); const n = (seen.get(b) || 0) + 1; seen.set(b, n);
        return { ...t, ...StatementParser.classify(t, kind), direction: t.amount < 0 ? 'out' : 'in', amount: Math.abs(t.amount), accountType: kind, accountName, dup: n <= (have.get(b) || 0) };
      });
      const fresh = rows.filter((r) => !r.dup);
      const tally = (f) => { const l = fresh.filter(f); return { n: l.length, total: l.reduce((s, r) => s + r.amount, 0) }; };
      return {
        rows, fresh,
        a: kind === 'bank' ? { label: 'Deposits (income)', ...tally((r) => r.type === 'income'), tone: 'text-emerald-600 dark:text-emerald-400' } : { label: 'Purchases & charges', ...tally((r) => r.type === 'expense'), tone: 'text-violet-700 dark:text-violet-300' },
        b: kind === 'bank' ? { label: 'Withdrawals (expenses)', ...tally((r) => r.type === 'expense'), tone: '' } : { label: 'Payments & credits', ...tally((r) => r.type === 'transfer'), tone: 'text-emerald-600 dark:text-emerald-400' },
        c: kind === 'bank' ? { label: 'Transfers & card payments', ...tally((r) => r.type === 'transfer') } : null,
      };
    }, [job, kind, accountName, data.transactions]);

    const doImport = async () => {
      if (!preview) return;
      setBusy(true);
      try {
        const { report, file } = job;
        const acct = await ensureAccount(kind, accountName, subtype, data);
        const saved = await StatementParser.saveTransactions(report.transactions, { sourceName: file.name, accountType: kind, accountName });
        // Balance anchor: the statement's ending balance (or what the user typed) as of the statement date.
        const bal = balance.trim() === '' ? null : parseAmount(balance);
        const asOf = report.meta.endingBalanceDate || report.meta.statementEnd || report.meta.dateRange[1];
        const patch = { ledger: true, kind };
        if (bal != null && !isNaN(bal) && (!acct.anchorDate || asOf >= acct.anchorDate)) {
          Object.assign(patch, { anchorBalance: round2(bal), anchorDate: asOf, balanceSource: report.meta.endingBalance != null && round2(bal) === round2(report.meta.endingBalance) ? 'statement' : 'manual' });
        } else if (!acct.ledger && Number(acct.balance)) {
          // An account you already tracked by hand: its current balance stays the starting point.
          Object.assign(patch, { anchorBalance: Number(acct.balance), anchorDate: todayISO(), balanceSource: 'manual' });
        } else if (acct.anchorBalance == null) patch.balanceSource = 'estimated';
        await DB.put(kind === 'bank' ? 'accounts' : 'debts', { ...acct, ...patch });
        await reload();
        setResult({ ...saved, accountName, kind, needsApr: kind === 'credit' && !(Number(acct.apr) > 0) });
        setJob(null); setBalance('');
        toast(`Imported ${saved.inserted} into ${accountName}`);
      } catch (e) { toast(e.message, 'error'); }
      setBusy(false);
    };

    const info = KIND_INFO[kind];
    const err = job && job.error;

    return (
      <div>
        <header className="pt-2">
          <h1 className="text-2xl font-bold tracking-tight">Upload</h1>
          <p className="text-sm text-slate-500 mt-1">PDF or CSV statements, read on this device and never uploaded anywhere.</p>
        </header>

        <SectionTitle>1 · Statement type</SectionTitle>
        <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Statement type">
          {['bank', 'credit'].map((k) => {
            const sel = kind === k, ki = KIND_INFO[k];
            return (
              <button key={k} role="radio" aria-checked={sel} onClick={() => { setKind(k); setName(''); }}
                className={cls('rounded-2xl border-2 p-3.5 text-left transition-colors', sel ? (k === 'bank' ? 'border-sky-500 bg-sky-50 dark:bg-sky-500/10' : 'border-violet-500 bg-violet-50 dark:bg-violet-500/10') : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900')}>
                <div className={cls('w-9 h-9 rounded-xl grid place-items-center mb-2', k === 'bank' ? 'bg-sky-100 text-sky-700 dark:bg-sky-500/20 dark:text-sky-300' : 'bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300')}><Icon name={ki.icon} size={18} /></div>
                <p className="font-semibold leading-tight">{ki.title}</p>
                <p className="text-xs text-slate-500 mt-0.5">{ki.sub}</p>
              </button>
            );
          })}
        </div>
        <p className="text-xs text-slate-500 mt-2 px-1">{info.how}</p>

        <SectionTitle>2 · Account</SectionTitle>
        <Card className="p-4 space-y-3">
          <Field label="Account label (optional)" hint={known ? `Adds to your existing “${known.name}” account.` : `Creates a new ${kind === 'bank' ? 'bank account' : 'credit card'} called “${accountName}”.`}>
            <Input value={name} onChange={(e) => setName(e.target.value)} placeholder={info.placeholder} list={`acct-${kind}`} autoComplete="off" />
            <datalist id={`acct-${kind}`}>{existing.map((a) => <option key={a.id} value={a.name} />)}</datalist>
          </Field>
          {existing.length > 0 && <div className="flex flex-wrap gap-1.5">{existing.map((a) => (
            <button key={a.id} onClick={() => setName(a.name)} className={cls('text-xs font-medium px-2.5 py-1 rounded-full border', sameName(a.name, accountName) ? 'border-brand-500 text-brand-700 dark:text-brand-400 bg-brand-50 dark:bg-brand-500/10' : 'border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300')}>{a.name}</button>
          ))}</div>}
          {kind === 'bank' && !known && <Field label="Account type"><Select options={['Checking', 'Savings']} value={subtype} onChange={(e) => setSubtype(e.target.value)} /></Field>}
        </Card>

        <SectionTitle>3 · File</SectionTitle>
        <input ref={fileRef} type="file" accept=".pdf,.csv,.tsv,.txt,.json,application/pdf,text/csv,application/json" className="hidden" onChange={(e) => { handleFile(e.target.files[0]); e.target.value = ''; }} />
        <button onClick={() => fileRef.current.click()} disabled={busy}
          onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}
          className="w-full rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 p-7 text-center active:bg-slate-50 dark:active:bg-slate-800">
          <div className="mx-auto w-12 h-12 rounded-2xl grid place-items-center bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-400"><Icon name={busy ? 'Hourglass' : 'FileSpreadsheet'} size={24} /></div>
          <p className="font-semibold mt-3">{busy ? 'Reading statement…' : job ? job.file.name : `Choose a ${kind === 'bank' ? 'bank' : 'credit card'} statement`}</p>
          <p className="text-xs text-slate-500 mt-1">PDF · CSV · or a Centric Wealth backup (.json)</p>
        </button>

        {err && (
          <Card className="mt-3 p-4 border-rose-200 dark:border-rose-500/30">
            <p className="font-semibold text-rose-600 dark:text-rose-400 flex items-center gap-2"><Icon name="TriangleAlert" size={16} />Couldn’t read this file</p>
            <p className="text-sm text-slate-600 dark:text-slate-300 mt-1">{err.message}</p>
            {err.code === 'PDF_PASSWORD' && (
              <form className="flex gap-2 mt-3" onSubmit={(e) => { e.preventDefault(); parse(job.file, password); }}>
                <input className={inputCls} type="password" placeholder="PDF password" value={password} onChange={(e) => setPassword(e.target.value)} autoFocus />
                <Button type="submit">Open</Button>
              </form>
            )}
          </Card>
        )}

        {preview && (
          <>
            <SectionTitle>Preview · {accountName}</SectionTitle>
            <Card className="p-4">
              <div className={cls('grid gap-2', preview.c ? 'grid-cols-3' : 'grid-cols-2')}>
                {[preview.a, preview.b, preview.c].filter(Boolean).map((x) => (
                  <div key={x.label} className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-2.5"><p className="text-[11px] leading-tight text-slate-500">{x.label}</p><p className={cls('num font-bold mt-1', x.tone)}>{fmt(x.total, true)}</p><p className="text-[11px] text-slate-500">{x.n} item{x.n === 1 ? '' : 's'}</p></div>
                ))}
              </div>
              <div className="mt-4">
                <Field label={kind === 'bank' ? 'Ending balance' : 'Statement balance (amount owed)'}
                  hint={job.report.meta.endingBalance != null ? `Found on the statement${job.report.meta.endingBalanceDate ? ` for ${prettyDate(job.report.meta.endingBalanceDate)}` : ''}. Newer transactions are added on top.` : 'Not found on the statement. Enter it for an exact balance, or leave blank to estimate from transactions.'}>
                  <Input inputMode="decimal" placeholder="0.00" value={balance} onChange={(e) => setBalance(e.target.value)} />
                </Field>
              </div>
              <p className="text-xs text-slate-500 mt-3">{preview.fresh.length} new · {preview.rows.length - preview.fresh.length} already imported{job.report.warnings.length ? ` · ${job.report.warnings.length} row${job.report.warnings.length === 1 ? '' : 's'} skipped` : ''} · {parseISO(job.report.meta.dateRange[0]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – {parseISO(job.report.meta.dateRange[1]).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</p>
            </Card>
            <Card className="mt-3 divide-y divide-slate-100 dark:divide-slate-800 overflow-hidden">
              {preview.rows.slice(0, 8).map((t, i) => <div key={i} className={cls(t.dup && 'opacity-40')}><TxRow t={t} /></div>)}
              {preview.rows.length > 8 && <p className="p-3 text-xs text-center text-slate-500">+ {preview.rows.length - 8} more</p>}
            </Card>
            {job.report.warnings.length > 0 && (
              <details className="mt-2 text-xs text-slate-500 px-1"><summary className="cursor-pointer">Skipped rows</summary>
                <ul className="mt-1 space-y-0.5">{job.report.warnings.slice(0, 20).map((w, i) => <li key={i}>{w.row ? `Row ${w.row}: ` : w.page ? `Page ${w.page}: ` : ''}{w.message}</li>)}</ul>
              </details>
            )}
            <div className="flex gap-2 mt-4">
              <Button variant="secondary" className="flex-1" onClick={() => setJob(null)}>Cancel</Button>
              <Button className="flex-[2]" disabled={busy || !preview.fresh.length} onClick={doImport}>{preview.fresh.length ? `Import ${preview.fresh.length} into ${accountName}` : 'Nothing new to import'}</Button>
            </div>
          </>
        )}

        {result && (
          <Card className="mt-3 p-4 bg-emerald-50 dark:bg-emerald-500/10 border-emerald-200 dark:border-emerald-500/20">
            <p className="font-semibold flex items-center gap-2"><Icon name="CircleCheck" size={18} className="text-emerald-600" />Imported {result.inserted} into {result.accountName}</p>
            {result.skippedDuplicates > 0 && <p className="text-sm text-slate-600 dark:text-slate-300 mt-1">{result.skippedDuplicates} already imported, skipped.</p>}
            {result.needsApr && <p className="text-sm text-slate-600 dark:text-slate-300 mt-2">Add this card’s APR and minimum payment so payoff plans are accurate. <button className="font-semibold text-brand-700 dark:text-brand-400" onClick={() => go('budget', 'debt')}>Open Debt</button></p>}
          </Card>
        )}

        {!job && <GmailSync onImportFile={importFromGmail} />}

        {!job && !result && (
          <>
            <SectionTitle>Tips</SectionTitle>
            <Card className="p-4 text-sm text-slate-600 dark:text-slate-300 space-y-2">
              <p className="flex gap-2"><Icon name="Check" size={16} className="text-brand-600 shrink-0 mt-0.5" />Download statements from your bank’s website as PDF or CSV. Scanned (photographed) PDFs can’t be read.</p>
              <p className="flex gap-2"><Icon name="Check" size={16} className="text-brand-600 shrink-0 mt-0.5" />Importing the same statement again is safe: duplicates in that account are skipped.</p>
              <p className="flex gap-2"><Icon name="Check" size={16} className="text-brand-600 shrink-0 mt-0.5" />Import both your bank and card statements: the card payment shows up on each, and both are stored as transfers so spending is only counted once.</p>
            </Card>
          </>
        )}
      </div>
    );
  }

  /* ======================================================== BUDGET & DEBT */
  function BudgetTab() {
    const { data, save, remove, fmt, toast } = useApp();
    const s = useSummary();
    const [edit, setEdit] = useState(null);
    const spent = Object.fromEntries(s.topCats);
    const totalLimit = data.budgets.reduce((a, b) => a + b.limit, 0);
    const totalSpent = data.budgets.reduce((a, b) => a + (spent[b.category] || 0), 0);
    const unbudgeted = EXPENSE_CATEGORIES.filter((c) => !data.budgets.find((b) => b.category === c));

    return (
      <div>
        <Card className="p-4 mt-4">
          <div className="flex justify-between items-baseline"><p className="text-sm text-slate-500">Spent of budget · {monthLabel(s.mk, { month: 'long' })}</p><p className="num text-sm font-semibold">{totalLimit ? Math.round((totalSpent / totalLimit) * 100) : 0}%</p></div>
          <p className="num text-2xl font-bold mt-1">{fmt(totalSpent)} <span className="text-base font-medium text-slate-500">/ {fmt(totalLimit)}</span></p>
          <div className="mt-3"><Progress value={totalLimit ? totalSpent / totalLimit : 0} /></div>
        </Card>
        <SectionTitle action={<button className="text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => setEdit({ category: unbudgeted[0] || 'Other', limit: '' , isNew: true })}>+ Add</button>}>Categories</SectionTitle>
        {data.budgets.length === 0 ? <Card><Empty icon="PiggyBank" title="No budgets yet" body="Set a monthly limit per category." /></Card> :
          <Card className="divide-y divide-slate-100 dark:divide-slate-800">
            {[...data.budgets].sort((a, b) => (spent[b.category] || 0) / b.limit - (spent[a.category] || 0) / a.limit).map((b) => {
              const sp = spent[b.category] || 0; const left = b.limit - sp;
              return (
                <button key={b.category} className="w-full text-left p-4" onClick={() => setEdit({ ...b, limit: String(b.limit) })}>
                  <div className="flex justify-between text-sm mb-2"><span className="font-medium">{b.category}</span><span className={cls('num', left < 0 ? 'text-rose-600 font-semibold' : 'text-slate-500')}>{left < 0 ? `${fmt(-left)} over` : `${fmt(left)} left`}</span></div>
                  <Progress value={sp / b.limit} />
                  <p className="num text-xs text-slate-500 mt-1.5">{fmt(sp)} of {fmt(b.limit)}</p>
                </button>
              );
            })}
          </Card>}
        <Sheet open={!!edit} title={edit?.isNew ? 'New budget' : 'Edit budget'} onClose={() => setEdit(null)}>
          {edit && (
            <form className="space-y-4" onSubmit={async (e) => { e.preventDefault(); const limit = round2(parseAmount(edit.limit)); if (!limit) return toast('Enter a limit', 'error'); await save('budgets', { category: edit.category, limit }); setEdit(null); toast('Budget saved'); }}>
              <Field label="Category">{edit.isNew ? <Select options={unbudgeted.length ? unbudgeted : EXPENSE_CATEGORIES} value={edit.category} onChange={(e) => setEdit({ ...edit, category: e.target.value })} /> : <Input value={edit.category} disabled />}</Field>
              <Field label="Monthly limit"><Input inputMode="decimal" value={edit.limit} onChange={(e) => setEdit({ ...edit, limit: e.target.value })} autoFocus /></Field>
              <Button type="submit" className="w-full">Save</Button>
              {!edit.isNew && <Button type="button" variant="ghost" className="w-full !text-rose-600" onClick={async () => { await remove('budgets', edit.category); setEdit(null); }}>Remove budget</Button>}
            </form>
          )}
        </Sheet>
      </div>
    );
  }

  function DebtTab() {
    const { data, save, remove, fmt, toast } = useApp();
    const [edit, setEdit] = useState(null);
    const [pay, setPay] = useState(null);
    const [extra, setExtra] = useState(() => String(data.settings.debtExtra ?? 100));
    const [strategy, setStrategy] = useState(data.settings.debtStrategy || 'avalanche');
    const total = data.debts.reduce((s, d) => s + Number(d.balance), 0);
    const minTotal = data.debts.reduce((s, d) => s + Number(d.minPayment || 0), 0);
    const plan = useMemo(() => simulatePayoff(data.debts, parseAmount(extra) || 0, strategy), [data.debts, extra, strategy]);
    const base = useMemo(() => simulatePayoff(data.debts, 0, strategy), [data.debts, strategy]);
    const freeDate = plan.months ? addMonths(monthKey(todayISO()), plan.months) : null;

    const submitPay = async (e) => {
      e.preventDefault();
      const amount = round2(parseAmount(pay.amount)); if (!amount) return;
      const d = data.debts.find((x) => x.id === pay.id);
      if (d.ledger && isCardDebt(d)) {
        // Card tracked from statements: the payment is a balance adjustment on the card; the balance recalculates.
        const tx = { type: 'transfer', direction: 'in', amount, category: 'Card Payment', date: todayISO(), description: `Payment · ${d.name}`, source: 'debt', accountType: 'credit', accountName: d.name };
        tx.hash = hashTx(tx); await save('transactions', tx);
      } else {
        await save('debts', { ...d, balance: round2(Math.max(0, d.balance - amount)) });
        const tx = { type: 'expense', amount, category: 'Debt Payment', date: todayISO(), description: `Payment · ${d.name}`, source: 'debt', debtId: d.id };
        tx.hash = hashTx(tx); await save('transactions', tx);
      }
      setPay(null); toast('Payment logged');
    };

    return (
      <div>
        <Card className="p-4 mt-4">
          <p className="text-sm text-slate-500">Total debt</p>
          <p className="num text-2xl font-bold">{fmt(total)}</p>
          <p className="num text-xs text-slate-500 mt-1">{fmt(minTotal)}/mo in minimum payments</p>
        </Card>

        <SectionTitle action={<button className="text-sm font-semibold text-brand-700 dark:text-brand-400" onClick={() => setEdit({ name: '', type: 'Credit Card', balance: '', apr: '', minPayment: '' })}>+ Add</button>}>Accounts</SectionTitle>
        {data.debts.length === 0 ? <Card><Empty icon="CreditCard" title="No debts tracked" body="Add cards and loans to plan your payoff." /></Card> :
          <Card className="divide-y divide-slate-100 dark:divide-slate-800">
            {data.debts.map((d) => (
              <div key={d.id} className="flex items-center gap-3 p-3.5">
                <button className="flex-1 min-w-0 text-left flex items-center gap-3" onClick={() => setEdit({ ...d, balance: String(d.balance), apr: String(d.apr), minPayment: String(d.minPayment) })}>
                  <div className="w-10 h-10 rounded-xl grid place-items-center bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-400"><Icon name="CreditCard" size={18} /></div>
                  <div className="min-w-0"><p className="font-medium truncate">{d.name}</p><p className="num text-xs text-slate-500">{Number(d.apr) > 0 ? `${d.apr}% APR` : <span className="text-amber-600">APR not set</span>} · min {fmt(d.minPayment)}</p>{d.ledger && <p className="text-[11px] text-slate-400">{balanceNote(d)}</p>}</div>
                </button>
                <div className="text-right"><p className="num font-semibold">{fmt(d.balance)}</p><button className="text-xs font-semibold text-brand-700 dark:text-brand-400" onClick={() => setPay({ id: d.id, name: d.name, amount: String(d.minPayment || '') })}>Log payment</button></div>
              </div>
            ))}
          </Card>}

        {data.debts.length > 0 && (
          <>
            <SectionTitle>Payoff planner</SectionTitle>
            <Card className="p-4 space-y-4">
              <Segmented value={strategy} onChange={(v) => { setStrategy(v); DB.setSetting('debtStrategy', v); }} options={[{ value: 'avalanche', label: 'Avalanche' }, { value: 'snowball', label: 'Snowball' }]} />
              <p className="text-xs text-slate-500 -mt-2">{strategy === 'avalanche' ? 'Highest interest rate first — lowest total interest.' : 'Smallest balance first — quickest early wins.'}</p>
              <Field label="Extra per month on top of minimums"><Input inputMode="decimal" value={extra} onChange={(e) => setExtra(e.target.value)} onBlur={() => DB.setSetting('debtExtra', parseAmount(extra) || 0)} /></Field>
              {plan.feasible ? (
                <div className="grid grid-cols-2 gap-3">
                  <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3"><p className="text-xs text-slate-500">Debt-free</p><p className="font-bold">{freeDate ? monthLabel(freeDate, { month: 'short', year: 'numeric' }) : '—'}</p><p className="text-xs text-slate-500">{plan.months} months</p></div>
                  <div className="rounded-xl bg-slate-50 dark:bg-slate-800/60 p-3"><p className="text-xs text-slate-500">Total interest</p><p className="num font-bold">{fmt(plan.interest)}</p>{base.feasible && base.interest > plan.interest && <p className="num text-xs text-emerald-600">saves {fmt(base.interest - plan.interest, true)}</p>}</div>
                </div>
              ) : <p className="text-sm text-rose-600 flex gap-2"><Icon name="TriangleAlert" size={16} className="shrink-0 mt-0.5" />Payments don’t cover interest — increase the monthly amount.</p>}
              {plan.feasible && <ol className="text-sm space-y-1.5">{plan.order.map((o, i) => <li key={o.id} className="flex justify-between"><span><span className="text-slate-400 mr-2">{i + 1}.</span>{o.name}</span><span className="text-slate-500">{monthLabel(addMonths(monthKey(todayISO()), o.month), { month: 'short', year: '2-digit' })}</span></li>)}</ol>}
            </Card>
          </>
        )}

        <Sheet open={!!edit} title={edit?.id ? 'Edit debt' : 'New debt'} onClose={() => setEdit(null)}>
          {edit && (
